<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Magister Auxilium — Elementos</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>body{background:#555;padding:40px}
.sheet{width:1600px;height:1000px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}
.sheet>div{position:relative;display:grid;place-items:center;overflow:hidden}
.sheet small{position:absolute;left:28px;bottom:24px;font:500 10px var(--sans);letter-spacing:.3em;text-transform:uppercase}</style></head><body>
<div class="sheet e" data-export="05-ELEMENTOS-GRAFICOS/elementos-graficos-prancha">
  <div class="paper"><img src="estrela-8-pontas--dourado.svg" style="width:170px"><small class="gold">Estrela de oito pontas</small></div>
  <div class="paper preto"><img src="estrela-8-pontas-linha--dourado.svg" style="width:220px"><small class="ouro">Estrela · traço</small></div>
  <div class="paper verde"><img src="circulo-aureo--dourado.svg" style="width:260px"><small class="ouro">Círculo áureo</small></div>
  <div class="paper"><img src="livro-aberto-linhas--verde.svg" style="width:260px"><small class="petro">Livro aberto · linhas</small></div>
  <div class="paper preto"><img src="curva-manto--dourado.svg" style="width:260px"><small class="ouro">Curvas do manto</small></div>
  <div style="background:url(padrao-dourado-sobre-marfim.svg) 0 0/110px"><small class="petro" style="background:var(--marfim);padding:6px">Padrão · marfim</small></div>
  <div style="background:url(padrao-dourado-sobre-preto.svg) 0 0/110px"><small class="ouro" style="background:var(--preto);padding:6px">Padrão · preto</small></div>
  <div style="background:url(padrao-turquesa-sobre-verde.svg) 0 0/110px"><small class="ivory" style="background:var(--petroleo);padding:6px">Padrão · petróleo</small></div>
</div></body></html>
