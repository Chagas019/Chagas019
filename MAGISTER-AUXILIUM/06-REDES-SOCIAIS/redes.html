<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Magister Auxilium — Redes sociais</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>body{padding:40px;display:grid;gap:40px;justify-content:start;background:#555}
.post{width:1080px;height:1080px;position:relative;overflow:hidden}.EL{position:absolute}</style></head><body>

<!-- AVATAR DE PERFIL (círculo — o recorte é do avatar, o logotipo fica inteiro dentro) -->
<div class="e" data-export="06-REDES-SOCIAIS/avatar-perfil" style="width:1080px;height:1080px;background:#fff;display:grid;place-items:center">
  <div data-logo="760" data-opts='{"plate":false,"pad":0}'></div>
</div>

<!-- POST 1 · citação (escuro) -->
<div class="post e paper preto" data-export="06-REDES-SOCIAIS/post-01-citacao" style="color:var(--marfim)">
  <img class="EL" src="../05-ELEMENTOS-GRAFICOS/circulo-aureo--dourado.svg" style="width:900px;right:-330px;top:-300px;opacity:.4">
  <img class="EL" src="../05-ELEMENTOS-GRAFICOS/estrela-8-pontas--dourado.svg" style="width:44px;left:100px;top:110px">
  <div class="display" style="position:absolute;left:100px;right:120px;top:270px;font-size:86px;font-style:italic;line-height:1.05">“[ citação ou versículo ]”</div>
  <div class="eyebrow ouro" style="position:absolute;left:104px;top:650px;font-size:16px">[ referência ]</div>
  <div style="position:absolute;left:100px;bottom:100px" data-logo="140" data-opts='{"pad":12}'></div>
</div>

<!-- POST 2 · evento (claro) -->
<div class="post e paper" data-export="06-REDES-SOCIAIS/post-02-evento">
  <div style="position:absolute;right:0;top:0;bottom:0;width:360px;background:var(--petroleo);overflow:hidden"><div style="position:absolute;inset:0;background:url(../05-ELEMENTOS-GRAFICOS/padrao-turquesa-sobre-verde.svg) 0 0/140px;opacity:.45"></div></div>
  <div style="position:absolute;left:90px;top:90px" data-logo="170" data-opts='{"plate":false,"pad":0}'></div>
  <div class="eyebrow gold" style="position:absolute;left:94px;top:400px;font-size:16px">[ categoria ]</div>
  <div class="display petro" style="position:absolute;left:90px;top:450px;width:560px;font-size:96px">[ Título do evento ]</div>
  <div style="position:absolute;left:94px;bottom:110px;font:500 22px/1.7 var(--sans);color:var(--grafite)"><span class="gold">●</span> [ data ] &nbsp; <span class="gold">●</span> [ horário ]<br><span class="gold">●</span> [ local ]</div>
  <div style="position:absolute;right:120px;top:480px;width:120px;height:120px;border-radius:50%;display:grid;place-items:center" class="foil-bg"><img src="../05-ELEMENTOS-GRAFICOS/estrela-8-pontas--marfim.svg" style="width:60px"></div>
</div>

<!-- POST 3 · comunicado (verde) -->
<div class="post e paper verde" data-export="06-REDES-SOCIAIS/post-03-comunicado" style="color:var(--marfim);text-align:center">
  <img class="EL" src="../05-ELEMENTOS-GRAFICOS/livro-aberto-linhas--dourado.svg" style="width:520px;left:280px;top:110px;opacity:.9">
  <div class="caps ouro" style="position:absolute;left:0;right:0;top:560px;font-size:22px">Comunicado</div>
  <div class="display" style="position:absolute;left:120px;right:120px;top:620px;font-size:64px">[ título do comunicado ]</div>
  <div style="position:absolute;left:0;right:0;bottom:90px;font:400 18px var(--sans);opacity:.8">[ @perfil ]</div>
</div>

<!-- STORY 1080×1920 -->
<div class="e paper preto" data-export="06-REDES-SOCIAIS/story" style="width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--marfim);text-align:center">
  <img class="EL" src="../05-ELEMENTOS-GRAFICOS/curva-manto--dourado.svg" style="width:1400px;left:-160px;bottom:-560px;opacity:.5">
  <div style="position:absolute;left:340px;top:260px" data-logo="400" data-opts='{"pad":30}'></div>
  <div class="eyebrow ouro" style="position:absolute;left:0;right:0;top:820px;font-size:20px">[ chamada ]</div>
  <div class="display" style="position:absolute;left:110px;right:110px;top:890px;font-size:110px">[ Título ]</div>
  <div style="position:absolute;left:340px;right:340px;top:1260px;height:96px;border:1.5px solid var(--ouro);display:grid;place-items:center;font:500 20px var(--sans);letter-spacing:.3em" class="ouro">[ AÇÃO ]</div>
</div>

<!-- MOCKUP: perfil em celular -->
<div class="e" data-export="02-MOCKUPS/perfil-instagram" style="width:1600px;height:1000px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2b2a28,#121110)">
  <div style="position:absolute;left:560px;top:70px;width:480px;height:980px;border-radius:64px;background:#0b0b0b;padding:16px;box-shadow:0 0 0 2px #3a3836,0 60px 90px -20px rgba(0,0,0,.8)">
    <div style="width:100%;height:100%;border-radius:50px;background:#fff;overflow:hidden;font-family:var(--sans);color:#111">
      <div style="height:54px"></div>
      <div style="padding:0 22px;font:600 17px var(--sans)">[ @perfil ]</div>
      <div style="display:flex;align-items:center;gap:24px;padding:18px 22px">
        <div style="width:96px;height:96px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--dourado);background:#fff;display:grid;place-items:center"><div data-logo="72" data-opts='{"plate":false,"pad":0}'></div></div>
        <div style="display:flex;gap:22px;font-size:12px;text-align:center"><div><b>[ 0 ]</b><br>posts</div><div><b>[ 0 ]</b><br>seguidores</div><div><b>[ 0 ]</b><br>seguindo</div></div></div>
      <div style="padding:0 22px;font-size:12px;line-height:1.5"><b>Magister Auxilium</b><br>[ bio ]</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:18px" id="grid"></div>
    </div></div>
</div>
<script src="../assets/components.js"></script>
<script>
const g=document.getElementById('grid');
const ids=['post-01-citacao','post-02-evento','post-03-comunicado','post-02-evento','post-03-comunicado','post-01-citacao','post-03-comunicado','post-01-citacao','post-02-evento'];
ids.forEach(id=>{const n=document.querySelector(`[data-export="06-REDES-SOCIAIS/${id}"]`).cloneNode(true);n.removeAttribute('data-export');
 const w=document.createElement('div');w.style.cssText='width:148px;height:148px;overflow:hidden';n.style.transform='scale(.137)';n.style.transformOrigin='0 0';w.appendChild(n);g.appendChild(w);});
</script></body></html>
