<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Magister Auxilium — Mockups</title>
<link rel="stylesheet" href="../assets/brand.css">
<style>body{padding:40px;display:grid;gap:40px;justify-content:start;background:#555}
.scene{width:1600px;height:1000px;position:relative;overflow:hidden}</style></head><body>

<!-- FACHADA -->
<div class="scene e" data-export="02-MOCKUPS/fachada" style="background:linear-gradient(180deg,#8fa6a8 0%,#c9d3d0 40%,#b9b2a6 40.1%,#a59d90 100%)">
  <div style="position:absolute;left:180px;right:180px;top:180px;bottom:120px;background:linear-gradient(180deg,#e9e3d8,#d8d0c2);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)"></div>
  <!-- letreiro: painel marfim com o logotipo original aplicado -->
  <div style="position:absolute;left:180px;right:180px;top:180px;height:250px;background:var(--grafite);display:flex;align-items:center;justify-content:center;gap:50px">
    <div data-logo="190" data-opts='{"pad":14,"style":"box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 2px #B98732"}'></div>
  </div>
  <div style="position:absolute;left:180px;right:180px;top:430px;height:6px" class="foil-bg"></div>
  <!-- portas de vidro -->
  <div style="position:absolute;left:560px;width:480px;top:520px;bottom:120px;background:linear-gradient(120deg,rgba(18,61,59,.85),rgba(7,92,90,.6) 50%,rgba(18,61,59,.9));border:8px solid var(--preto)"><div style="position:absolute;left:50%;top:0;bottom:0;width:6px;background:var(--preto)"></div></div>
  <div style="position:absolute;left:260px;width:220px;top:540px;height:260px;background:linear-gradient(120deg,rgba(18,61,59,.75),rgba(54,189,181,.25));border:6px solid var(--preto)"></div>
  <div style="position:absolute;right:260px;width:220px;top:540px;height:260px;background:linear-gradient(120deg,rgba(18,61,59,.75),rgba(54,189,181,.25));border:6px solid var(--preto)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(#77706a,#5b5550)"></div>
</div>

<!-- PLACA (latão/acrílico na parede) -->
<div class="scene e paper" data-export="02-MOCKUPS/placa" style="background-color:#d9d3c8;display:grid;place-items:center">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.45),transparent 60%)"></div>
  <div style="width:720px;height:460px;background:var(--preto);position:relative;display:grid;grid-template-columns:300px 1fr;align-items:center;padding:0 60px;gap:50px;box-shadow:0 4px 6px rgba(0,0,0,.25),0 60px 70px -30px rgba(0,0,0,.6)">
    <div data-logo="300" data-opts='{"pad":22}'></div>
    <div style="color:var(--marfim)"><img src="../05-ELEMENTOS-GRAFICOS/estrela-8-pontas--dourado.svg" style="width:22px"><div class="eyebrow ouro" style="margin-top:22px;line-height:2">[ Setor / Sala ]</div><div class="rule ouro" style="margin:18px 0;width:80px"></div><div style="font:italic 400 18px var(--serif);opacity:.8">[ informação complementar ]</div></div>
    <div style="position:absolute;left:18px;top:18px;width:12px;height:12px;border-radius:50%" class="foil-bg"></div><div style="position:absolute;right:18px;top:18px;width:12px;height:12px;border-radius:50%" class="foil-bg"></div><div style="position:absolute;left:18px;bottom:18px;width:12px;height:12px;border-radius:50%" class="foil-bg"></div><div style="position:absolute;right:18px;bottom:18px;width:12px;height:12px;border-radius:50%" class="foil-bg"></div>
  </div>
</div>

<!-- CAMISETA -->
<div class="scene e" data-export="02-MOCKUPS/camiseta" style="background:radial-gradient(ellipse at 50% 35%,#f4efe6,#d6cdbd);display:grid;place-items:center">
  <svg viewBox="0 0 600 640" style="position:absolute;width:720px;left:440px;top:150px;filter:drop-shadow(0 40px 40px rgba(0,0,0,.25))">
    <defs><linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#0b4a48"/><stop offset=".5" stop-color="#075C5A"/><stop offset="1" stop-color="#063f3d"/></linearGradient></defs>
    <path d="M200 20 Q300 70 400 20 L560 90 L600 230 L500 260 L490 620 Q300 650 110 620 L100 260 L0 230 L40 90 Z" fill="url(#t)"/>
    <path d="M200 20 Q300 90 400 20" fill="none" stroke="#04302f" stroke-width="12"/>
    <path d="M100 260 L110 620 M500 260 L490 620" stroke="#04302f" stroke-width="2" opacity=".4"/>
  </svg>
  <!-- aplicação: logotipo original em etiqueta marfim no peito (sem alteração de cor) -->
  <div style="position:absolute;left:870px;top:300px" data-logo="120" data-opts='{"pad":8,"marfim":true,"style":"box-shadow:0 2px 6px rgba(0,0,0,.35)"}'></div>
  <div class="eyebrow petro" style="position:absolute;left:80px;bottom:70px">Camiseta institucional · verde petróleo · logo em etiqueta bordada</div>
</div>

<!-- ASSINATURA DIGITAL (e-mail) -->
<div class="e" data-export="06-REDES-SOCIAIS/assinatura-email" style="width:760px;height:220px;background:#fff;display:grid;grid-template-columns:150px 1px 1fr;gap:28px;align-items:center;padding:30px 36px;font-family:var(--sans)">
  <div data-logo="150" data-opts='{"plate":false,"pad":0}'></div>
  <div style="height:140px;background:var(--dourado)"></div>
  <div><div style="font:500 24px var(--serif);color:var(--petroleo)">[ Nome ]</div>
  <div style="font:600 9px var(--sans);letter-spacing:.3em;color:var(--dourado);margin-top:6px;text-transform:uppercase">[ Cargo ]</div>
  <div style="font:400 11px/1.8 var(--sans);color:var(--grafite);margin-top:12px">[ telefone ] · [ e-mail ]<br>[ site ] · [ @instagram ]</div></div>
</div>
<script src="../assets/components.js"></script></body></html>
