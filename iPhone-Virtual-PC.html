<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Virtual PC">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="iPhone Virtual PC — ambiente de computador virtual em um único arquivo HTML, offline.">
<title>iPhone Virtual PC</title>
<style>
/* =========================================================
   iPhone Virtual PC — Apple Edition
   Arquivo único: HTML + CSS + JS. Sem dependências externas.
   ========================================================= */
:root{
  --accent:#0a84ff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --mb-h:28px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --dock-s:52px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
  --bg:#000;--text:#f5f5f7;--text2:rgba(235,235,245,.64);--text3:rgba(235,235,245,.36);
  --win:rgba(32,32,35,.9);--pane:#1f1f22;--pane2:#2a2a2e;--sidebar:rgba(44,44,48,.55);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --glass:rgba(38,38,42,.5);--glass-strong:rgba(34,34,38,.82);
  --hover:rgba(255,255,255,.07);--active:rgba(255,255,255,.13);--input:rgba(255,255,255,.07);
  --shadow:0 26px 70px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.14);
  --code-bg:#1b1b1f;--code-text:#e8e8ec;--gutter:#5d5d68;--caret:#fff;
  --tk-kw:#ff7ab2;--tk-str:#ff8170;--tk-num:#d9c97c;--tk-com:#7f8c98;--tk-fn:#67b7a4;--tk-tag:#5dd8ff;
  --tk-attr:#d0a8ff;--tk-prop:#67b7a4;--tk-sel:#5dd8ff;--tk-lit:#d9c97c;--tk-pun:#a6a6b1;--tk-key:#d0a8ff;--tk-val:#e8e8ec;
}
:root[data-theme=light]{
  --bg:#ececee;--text:#1d1d1f;--text2:rgba(60,60,67,.7);--text3:rgba(60,60,67,.4);
  --win:rgba(246,246,248,.92);--pane:#ffffff;--pane2:#f2f2f5;--sidebar:rgba(232,232,236,.6);
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.15);
  --glass:rgba(246,246,248,.55);--glass-strong:rgba(248,248,250,.86);
  --hover:rgba(0,0,0,.05);--active:rgba(0,0,0,.09);--input:rgba(0,0,0,.05);
  --shadow:0 26px 70px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.16);
  --code-bg:#ffffff;--code-text:#1d1d1f;--gutter:#a7a7b0;--caret:#000;
  --tk-kw:#ad3da4;--tk-str:#d12f1b;--tk-num:#272ad8;--tk-com:#707f8c;--tk-fn:#3e8087;--tk-tag:#0b4f79;
  --tk-attr:#804fb8;--tk-prop:#3e8087;--tk-sel:#0b4f79;--tk-lit:#272ad8;--tk-pun:#6c6c75;--tk-key:#804fb8;--tk-val:#1d1d1f;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;background:#000}
body{margin:0;position:fixed;left:0;right:0;top:var(--app-top,0px);height:var(--app-h,100%);overflow:hidden;
  font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit}
input,textarea,.selectable,.term-out,.ed-ta{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.reduce *{transition-duration:0s!important;animation-duration:0s!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}

/* ---------- Wallpaper ---------- */
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .6s var(--ease)}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s}

/* ---------- Boot ---------- */
#boot{position:fixed;inset:0;z-index:99999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .6s var(--ease)}
#boot .logo{width:74px;height:74px;color:#f5f5f7}
#boot .bar{width:170px;height:5px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:#f5f5f7;border-radius:5px;transition:width .35s var(--ease)}
#boot .sub{position:absolute;bottom:calc(30px + var(--safe-b));color:rgba(255,255,255,.35);font-size:11px;letter-spacing:.3px;text-align:center;padding:0 20px}
#boot.out{opacity:0;pointer-events:none}

/* ---------- Menubar ---------- */
#menubar{position:absolute;left:0;right:0;top:0;height:calc(var(--mb-h) + var(--safe-t));padding:var(--safe-t) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));
  display:flex;align-items:center;gap:2px;z-index:9000;color:#fff;
  background:rgba(20,20,24,.32);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 .5px 0 rgba(255,255,255,.08);text-shadow:0 0 6px rgba(0,0,0,.25)}
:root[data-theme=light] #menubar{background:rgba(255,255,255,.4);color:#000;text-shadow:none;box-shadow:0 .5px 0 rgba(0,0,0,.1)}
.mb-item{height:22px;padding:0 9px;border-radius:5px;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.mb-item:hover,.mb-item.open{background:rgba(255,255,255,.18)}
:root[data-theme=light] .mb-item:hover,:root[data-theme=light] .mb-item.open{background:rgba(0,0,0,.1)}
#mb-logo svg{width:15px;height:15px}
#mb-app{font-weight:700}
.mb-sp{flex:1}
#mb-right{display:flex;align-items:center;gap:2px}
#mb-right svg.i{width:15px;height:15px}
#mb-net.off{opacity:.4}
#mb-clock{font-variant-numeric:tabular-nums}

/* ---------- Desktop ---------- */
#desktop{position:absolute;left:0;right:0;top:calc(var(--mb-h) + var(--safe-t));bottom:0;overflow:hidden}
#desk-icons{position:absolute;top:14px;right:calc(14px + var(--safe-r));bottom:110px;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;gap:6px;z-index:1}
.dicon{width:86px;padding:6px 2px 4px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.dicon .ic{width:58px;height:58px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.dicon .ic svg,.dicon .ic img{max-width:100%;max-height:100%}
.dicon .ic img{border-radius:6px;object-fit:cover;width:54px;height:54px}
.dicon span{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);line-height:1.25;padding:1px 5px;border-radius:4px;word-break:break-word;max-width:86px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dicon.sel .ic{background:rgba(255,255,255,.14);border-radius:8px}
.dicon.sel span{background:var(--accent);text-shadow:none}

/* ---------- Windows ---------- */
.win{position:absolute;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--win);
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:var(--shadow);min-width:260px;min-height:170px;
  transform-origin:50% 50%;will-change:transform}
.win:not(.focused){box-shadow:0 14px 40px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.1)}
.win.min{display:none}
.win.max{border-radius:10px}
.win.anim{transition:left .32s var(--ease),top .32s var(--ease),width .32s var(--ease),height .32s var(--ease)}
.win-tb{height:40px;flex:none;display:flex;align-items:center;padding:0 10px;gap:10px;position:relative;touch-action:none;border-bottom:.5px solid var(--line)}
.tls{display:flex;gap:8px;z-index:2}
.tl{width:13px;height:13px;border-radius:50%;position:relative;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.tl::before,.tl::after{content:"";position:absolute;inset:0;margin:auto;opacity:0;background:rgba(0,0,0,.6)}
.tl-c{background:#ff5f57}.tl-m{background:#febc2e}.tl-z{background:#28c840}
.tl-c::before,.tl-c::after{width:7px;height:1.4px;transform:rotate(45deg)}.tl-c::after{transform:rotate(-45deg)}
.tl-m::before{width:7px;height:1.4px}.tl-m::after{display:none}
.tl-z::before{width:6px;height:6px;background:none;border-top:1.5px solid rgba(0,0,0,.6);border-left:1.5px solid rgba(0,0,0,.6);transform:translate(-1px,-1px)}
.tl-z::after{width:6px;height:6px;background:none;border-bottom:1.5px solid rgba(0,0,0,.6);border-right:1.5px solid rgba(0,0,0,.6);transform:translate(1px,1px)}
.tls:hover .tl::before,.tls:hover .tl::after{opacity:1}
.win:not(.focused) .tl{background:rgba(128,128,128,.4)}
.win:not(.focused) .tls:hover .tl-c{background:#ff5f57}.win:not(.focused) .tls:hover .tl-m{background:#febc2e}.win:not(.focused) .tls:hover .tl-z{background:#28c840}
.win-title{position:absolute;left:90px;right:90px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13px;color:var(--text2);pointer-events:none;white-space:nowrap;overflow:hidden}
.win.focused .win-title{color:var(--text)}
.wt-t{overflow:hidden;text-overflow:ellipsis}
.win-tbx{margin-left:auto;display:flex;gap:4px;z-index:2}
.win-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.rz{position:absolute;z-index:5;touch-action:none}
.rz-r{top:10px;right:-3px;bottom:10px;width:8px;cursor:ew-resize}
.rz-l{top:10px;left:-3px;bottom:10px;width:8px;cursor:ew-resize}
.rz-b{left:10px;right:10px;bottom:-3px;height:8px;cursor:ns-resize}
.rz-br{right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize}
.rz-bl{left:0;bottom:0;width:18px;height:18px;cursor:nesw-resize}
.touch .rz-br::after{content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);border-radius:0 0 3px 0}
.win.max .rz{display:none}

/* ---------- Dock ---------- */
#dock{position:absolute;left:50%;bottom:calc(8px + var(--safe-b));transform:translateX(-50%);z-index:8000;display:flex;align-items:flex-end;gap:5px;padding:6px 8px;border-radius:22px;max-width:calc(100% - 16px);
  background:rgba(60,60,66,.32);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2),0 10px 40px rgba(0,0,0,.35);transition:transform .35s var(--ease),opacity .3s}
:root[data-theme=light] #dock{background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.6),0 10px 40px rgba(0,0,0,.18)}
body.kb #dock{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.dock-i{position:relative;width:var(--dock-s);height:var(--dock-s);flex:none;transition:width .14s,height .14s;display:flex;justify-content:center}
.dock-i .appicon{width:100%;height:100%}
.dock-i.bounce{animation:bounce .55s var(--ease) 2}
@keyframes bounce{50%{transform:translateY(-18px)}}
.dock-i .dot{position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:rgba(255,255,255,.85);opacity:0;transition:opacity .2s}
:root[data-theme=light] .dock-i .dot{background:rgba(0,0,0,.7)}
.dock-i.run .dot{opacity:1}
.dock-sep{width:1px;align-self:stretch;margin:4px 3px;background:rgba(255,255,255,.25)}
.dock-tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:7px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--glass-strong);color:var(--text);box-shadow:0 0 0 .5px var(--line2),0 6px 20px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.mouse .dock-i:hover .dock-tip{opacity:1}

/* ---------- App icons ---------- */
.appicon{position:relative;border-radius:23%;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 3px 8px rgba(0,0,0,.28)}
.appicon::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%);pointer-events:none}
.appicon svg{width:70%;height:70%}
.appicon.xs{width:16px;height:16px;border-radius:4px;box-shadow:none}
.appicon.sm{width:28px;height:28px;border-radius:7px}
.appicon.lg{width:64px;height:64px}
.appicon.xl{width:96px;height:96px}

/* ---------- Glass / menus / dialogs ---------- */
.glass{background:var(--glass-strong);-webkit-backdrop-filter:blur(36px) saturate(180%);backdrop-filter:blur(36px) saturate(180%);box-shadow:0 0 0 .5px var(--line2),0 16px 50px rgba(0,0,0,.4)}
.ctx{position:fixed;z-index:20000;min-width:200px;max-width:280px;padding:5px;border-radius:10px;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.ctx-i{display:flex;width:100%;align-items:center;gap:10px;padding:5px 10px;border-radius:5px;text-align:left;font-size:13px;line-height:1.35}
.ctx-i:hover:not(:disabled),.ctx-i:focus-visible{background:var(--accent);color:#fff;outline:none}
.ctx-i:disabled{opacity:.4}
.ctx-i.danger{color:#ff453a}.ctx-i.danger:hover{color:#fff;background:#ff453a}
.ctx-i span{flex:1}.ctx-i kbd{font:inherit;opacity:.5}
.ctx-sep{height:.5px;margin:5px 8px;background:var(--line2)}
.ctx-h{padding:4px 10px 2px;font-size:11px;font-weight:600;color:var(--text3)}
.touch .ctx-i{padding:10px 12px;font-size:15px}

.dlg-ov{position:fixed;inset:0;z-index:30000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.25);animation:fade .18s}
@keyframes fade{from{opacity:0}}
.dlg-ov.out{opacity:0;transition:opacity .16s}
.dlg{width:290px;max-width:100%;border-radius:14px;padding:20px 16px 16px;text-align:center;animation:pop .2s var(--spring)}
.dlg-ic{display:flex;justify-content:center;margin-bottom:10px}
.dlg h3{margin:0 0 6px;font-size:14px;font-weight:700}
.dlg p{margin:0 0 12px;font-size:12px;color:var(--text2);line-height:1.45;white-space:pre-line}
.dlg input{width:100%;font-size:16px;padding:7px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--input);outline:none;margin-bottom:12px}
.dlg input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.dlg-btns{display:flex;gap:8px}
.dlg-btns.col{flex-direction:column}
.btn{flex:1;height:30px;padding:0 14px;border-radius:7px;background:var(--active);font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:#ff453a;color:#fff}
.btn.small{flex:none;height:26px;padding:0 10px;font-size:12px}
.touch .btn{height:36px}.touch .btn.small{height:32px}

/* ---------- Toasts ---------- */
#toasts{position:fixed;top:calc(var(--mb-h) + var(--safe-t) + 8px);right:calc(10px + var(--safe-r));z-index:25000;display:flex;flex-direction:column;gap:8px;width:340px;max-width:calc(100% - 20px);pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:16px;animation:tin .4s var(--spring)}
.toast.out{transition:transform .3s var(--ease),opacity .3s;transform:translateX(120%);opacity:0}
@keyframes tin{from{transform:translateX(110%);opacity:0}}
.toast b{display:block;font-size:13px;margin-bottom:1px}
.toast div{font-size:12px;color:var(--text2);line-height:1.35;word-break:break-word}

/* ---------- Spotlight / Control center ---------- */
.spot-ov{position:fixed;inset:0;z-index:28000;display:flex;justify-content:center;align-items:flex-start;padding:calc(var(--safe-t) + 14vh) 14px 0;background:rgba(0,0,0,.12);animation:fade .15s}
.spot{width:620px;max-width:100%;border-radius:16px;overflow:hidden;animation:pop .2s var(--spring)}
.spot-in{display:flex;align-items:center;gap:10px;padding:12px 16px}
.spot-in svg.i{width:22px;height:22px;color:var(--text2)}
.spot-in input{flex:1;font-size:21px;border:0;background:none;outline:none;font-weight:300}
.spot-res{max-height:50vh;overflow:auto;border-top:.5px solid var(--line2);padding:6px}
.spot-res:empty{display:none}
.spot-r{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;text-align:left}
.spot-r.on{background:var(--accent);color:#fff}
.spot-r small{margin-left:auto;opacity:.6;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.spot-r .fi{width:24px;height:24px;display:flex}
.cc{position:fixed;z-index:21000;top:calc(var(--mb-h) + var(--safe-t) + 6px);right:calc(8px + var(--safe-r));width:320px;max-width:calc(100% - 16px);border-radius:18px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;animation:pop .18s var(--spring)}
.cc-t{border-radius:14px;padding:10px 12px;background:var(--hover);box-shadow:inset 0 0 0 .5px var(--line);display:flex;align-items:center;gap:10px;font-size:12px;text-align:left}
.cc-t .b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--active);flex:none}
.cc-t.on .b{background:var(--accent);color:#fff}
.cc-t small{display:block;color:var(--text2);font-size:11px}
.cc-w{grid-column:1/-1}
.cc-w label{font-size:12px;font-weight:600;display:block;margin-bottom:8px}
.range{width:100%;-webkit-appearance:none;appearance:none;height:26px;border-radius:13px;background:var(--active);outline:none;overflow:hidden}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:-200px 0 0 187px var(--text2)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.sw.on{box-shadow:0 0 0 2px var(--pane),0 0 0 4px currentColor}

/* ---------- Shared app UI ---------- */
.tb{display:flex;align-items:center;gap:4px;padding:6px 8px;flex:none;border-bottom:.5px solid var(--line);min-height:44px;overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tbb{height:28px;min-width:28px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--text2);flex:none;font-size:12px}
.tbb:hover{background:var(--hover);color:var(--text)}
.tbb:active,.tbb.on{background:var(--active);color:var(--text)}
.tbb:disabled{opacity:.35}
.tbb.txt{padding:0 9px}
.touch .tbb{height:34px;min-width:34px}
.sp{flex:1}
.seg{display:inline-flex;background:var(--input);border-radius:7px;padding:2px;flex:none}
.seg button{height:24px;padding:0 10px;border-radius:5px;font-size:12px;color:var(--text2)}
.seg button.on{background:var(--pane2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
:root[data-theme=light] .seg button.on{background:#fff}
.touch .seg button{height:30px}
.field{height:28px;border-radius:7px;border:0;background:var(--input);padding:0 10px;outline:none;font-size:13px;min-width:0}
.field:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.touch .field{font-size:16px;height:34px}
.side{width:190px;flex:none;background:var(--sidebar);border-right:.5px solid var(--line);overflow-y:auto;padding:8px 8px 16px}

/* Ícones de arquivos */
const EXTC={html:'#e44d26',htm:'#e44d26',css:'#2965f1',js:'#e0a800',mjs:'#e0a800',json:'#2fa84f',md:'#6e6e78',txt:'#8e8e93',svg:'#ff9500',png:'#af52de',jpg:'#af52de',jpeg:'#af52de',gif:'#af52de',webp:'#af52de',zip:'#636366',xml:'#ff6b35'};
const IMG_EXT=['png','jpg','jpeg','gif','webp','svg','bmp','ico'];
const TEXT_EXT=['html','htm','css','js','mjs','json','txt','md','svg','xml','csv','ts','jsx','tsx','yml','yaml','log','py','sh'];
const P={
  norm(p,cwd='/'){p=String(p||'').trim();if(!p)return cwd;if(p==='~')p='/';else if(p.startsWith('~/'))p='/'+p.slice(2);
    const abs=p.startsWith('/')?p:(cwd.replace(/\/+$/,'')+'/'+p);const out=[];
    for(const s of abs.split('/')){if(!s||s==='.')continue;if(s==='..')out.pop();else out.push(s)}return '/'+out.join('/')},
  dir(p){const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i)},
  base(p){return p.slice(p.lastIndexOf('/')+1)},
  join(a,b){return P.norm(b,a)},
  ext(p){const b=P.base(p),i=b.lastIndexOf('.');return i>0?b.slice(i+1).toLowerCase():''},
  stem(p){const b=P.base(p),i=b.lastIndexOf('.');return i>0?b.slice(0,i):b},
  rel(from,to){return to.startsWith(from==='/'?'/':from+'/')?to.slice(from==='/'?1:from.length+1):to}
};
const FOLDER_SVG=(special)=>`<svg viewBox="0 0 64 52"><path d="M3 8a5 5 0 0 1 5-5h15l5 5h28a5 5 0 0 1 5 5v4H3z" fill="#2a8cf0"/><path d="M3 15h58v30a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z" fill="#5db4ff"/><path d="M3 15h58v3H3z" fill="#7cc4ff" opacity=".7"/>${special?`<g transform="translate(22 22) scale(.85)" stroke="#2a7fd8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="${special}"/></g>`:''}</svg>`;
const DOC_SVG=(ext)=>{const c=EXTC[ext]||'#8e8e93';const t=(ext||'doc').slice(0,4).toUpperCase();
  return `<svg viewBox="0 0 48 60"><path d="M7 2h25l13 13v39a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z" fill="#f7f7f9" stroke="#d6d6dc" stroke-width="1"/><path d="M32 2v9a4 4 0 0 0 4 4h9" fill="#dcdce2"/><g stroke="#d2d2d8" stroke-width="2" stroke-linecap="round"><path d="M10 20h18M10 25h24M10 30h14"/></g><rect x="5" y="37" width="38" height="14" rx="3.5" fill="${c}"/><text x="24" y="47.6" font-size="${t.length>3?8:9.5}" font-weight="800" text-anchor="middle" fill="#fff" font-family="-apple-system,Helvetica,Arial,sans-serif">${esc(t)}</text></svg>`};
const SPECIAL={'/Desktop':'M4 5h16v11H4zM9 20h6M12 16v4','/Documentos':IP.file,'/Projetos':IP.layers,'/Downloads':IP.download,'/Lixeira':IP.trash};
function fileIcon(path,node){
  if(!node)node=FS.node(path);
  if(node&&node.t==='d')return FOLDER_SVG(SPECIAL[path]);
  const x=P.ext(path);
  if(node&&node.e==='b64'&&IMG_EXT.includes(x))return `<img src="${node.d}" alt="" loading="lazy">`;
  return DOC_SVG(x);
}

/* =========================================================
   2. ARMAZENAMENTO (IndexedDB → localStorage → memória)
   ========================================================= */
const Store={
  backend:'memória',db:null,mem:{},
  async init(){
    try{
      if(!window.indexedDB)throw 0;
      this.db=await new Promise((res,rej)=>{const r=indexedDB.open('iphone-virtual-pc',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
        setTimeout(()=>rej(new Error('timeout')),2500)});
      await this.set('__t',1);this.backend='IndexedDB';return;
    }catch(e){this.db=null}
    try{localStorage.setItem('__ivpc','1');localStorage.removeItem('__ivpc');this.backend='localStorage'}catch(e){this.backend='memória'}
  },
  get(k){
    if(this.db)return new Promise(res=>{try{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}catch(e){res(undefined)}});
    if(this.backend==='localStorage'){try{const v=localStorage.getItem('ivpc:'+k);return Promise.resolve(v?JSON.parse(v):undefined)}catch(e){return Promise.resolve(undefined)}}
    return Promise.resolve(this.mem[k]);
  },
  set(k,v){
    if(this.db)return new Promise((res,rej)=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}catch(e){rej(e)}})
      .catch(e=>{toast('Erro ao salvar','Armazenamento cheio ou bloqueado: '+(e&&e.message||e),'alert')});
    if(this.backend==='localStorage'){try{localStorage.setItem('ivpc:'+k,JSON.stringify(v))}catch(e){toast('Armazenamento cheio','O localStorage atingiu o limite. Exporte seus projetos.','alert')}return Promise.resolve()}
    this.mem[k]=v;return Promise.resolve();
  }
};

/* =========================================================
   3. SISTEMA DE ARQUIVOS VIRTUAL
   nó: {t:'d',c:{},m} | {t:'f',d:string,e:'u'|'b64',m,o?}
   ========================================================= */
const SYS_DIRS=['/','/Desktop','/Documentos','/Projetos','/Downloads','/Lixeira'];
const FS={
  root:null,_q:new Set(),
  init(data){this.root=data&&data.t==='d'?data:{t:'d',c:{},m:Date.now()};SYS_DIRS.slice(1).forEach(d=>{if(!this.isDir(d))this.mkdir(d)})},
  node(p){p=P.norm(p);if(p==='/')return this.root;let n=this.root;for(const s of p.slice(1).split('/')){if(!n||n.t!=='d')return null;n=n.c[s]}return n||null},
  exists(p){return!!this.node(p)},isDir(p){const n=this.node(p);return!!n&&n.t==='d'},
  list(p){const n=this.node(p);if(!n||n.t!=='d')throw new Error('Pasta não encontrada: '+p);
    return Object.keys(n.c).map(name=>({name,path:P.join(p,name),node:n.c[name],dir:n.c[name].t==='d'}))
      .sort((a,b)=>(b.dir-a.dir)||a.name.localeCompare(b.name,'pt',{numeric:true,sensitivity:'base'}))},
  read(p){const n=this.node(p);if(!n)throw new Error('Arquivo não encontrado: '+p);if(n.t==='d')throw new Error('É uma pasta: '+p);return n.d},
  validName(n){if(!n||/[\/\\:*?"<>|]/.test(n)||n==='.'||n==='..'||n.length>120)throw new Error('Nome inválido: "'+n+'"')},
  mkdir(p){p=P.norm(p);let n=this.root;for(const s of p.slice(1).split('/').filter(Boolean)){this.validName(s);if(!n.c[s])n.c[s]={t:'d',c:{},m:Date.now()};else if(n.c[s].t!=='d')throw new Error('Já existe um arquivo chamado "'+s+'"');n=n.c[s]}this._ch(p);return n},
  write(p,data,e='u'){p=P.norm(p);const name=P.base(p);this.validName(name);const par=this.mkdir(P.dir(p));const ex=par.c[name];
    if(ex&&ex.t==='d')throw new Error('"'+name+'" é uma pasta');par.c[name]={t:'f',d:String(data),e,m:Date.now()};par.m=Date.now();this._ch(p)},
  rm(p){p=P.norm(p);if(SYS_DIRS.includes(p))throw new Error('Pasta do sistema não pode ser removida');const par=this.node(P.dir(p)),name=P.base(p);

function openPath(p,how){
  const n=FS.node(p);if(!n)return toast('Não encontrado',p,'alert');
  if(n.t==='d')return WM.open('files',{path:p});
  const x=P.ext(p);
  if(how==='editor'||(!['html','htm'].includes(x)&&!IMG_EXT.includes(x)&&how!=='view'))return WM.open('editor',{path:p});
  return WM.open('browser',{url:'vfs:'+p});
}
async function newItem(dir,isDir,defName){

  if(!name)return null;try{FS.validName(name);const p=P.join(dir,name);if(FS.exists(p))throw new Error('Já existe "'+name+'"');
    if(isDir)FS.mkdir(p);else FS.write(p,starterFor(name));return p}catch(e){Dialog.alert('Não foi possível criar',e.message);return null}
}
function starterFor(name){const x=P.ext(name);
  if(x==='html'||x==='htm')return`<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>${P.stem(name)}</title>\n</head>\n<body>\n  <h1>${P.stem(name)}</h1>\n</body>\n</html>\n`;
  if(x==='css')return`/* ${name} */\nbody {\n  margin: 0;\n}\n`;if(x==='js')return`// ${name}\nconsole.log('Olá de ${name}');\n`;if(x==='json')return`{\n  "nome": "${P.stem(name)}"\n}\n`;return''}
async function renameItem(p){const old=P.base(p);const nn=await Dialog.prompt('Renomear','Novo nome para "'+old+'"',old,'files');if(!nn||nn===old)return null;
  try{FS.validName(nn);return FS.move(p,P.join(P.dir(p),nn))}catch(e){Dialog.alert('Erro ao renomear',e.message);return null}}
async function moveItemTo(p){const dirs=[];FS.walk('/',(q,n)=>{if(n.t==='d'&&!q.startsWith('/Lixeira')&&q!==p&&!q.startsWith(p+'/')&&q!==P.dir(p))dirs.push(q)});dirs.unshift('/');
  const target=await new Promise(res=>{const ov=el(`<div class="dlg-ov"><div class="dlg glass" style="width:340px;text-align:left"><h3 style="text-align:center">Mover "${esc(P.base(p))}" para…</h3><div style="max-height:46vh;overflow:auto;margin:10px 0" class="mv-l"></div><div class="dlg-btns"><button class="btn">Cancelar</button></div></div></div>`);
    dirs.forEach(d=>{if(d===P.dir(p))return;const b=el(`<button class="side-i">${ic('folder')}<span>${esc(d==='/'?'Disco virtual (/)':d)}</span></button>`);b.onclick=()=>{ov.remove();res(d)};$('.mv-l',ov).append(b)});
    $('.btn',ov).onclick=()=>{ov.remove();res(null)};document.body.append(ov)});
  if(!target)return;try{FS.move(p,P.join(target,FS.unique(target,P.base(p))));toast('Movido',P.base(p)+' → '+target,'files')}catch(e){Dialog.alert('Erro ao mover',e.message)}}
function itemMenu(p,x,y,extra=[]){
  const n=FS.node(p);if(!n)return;const inTrash=p.startsWith('/Lixeira/');const isProj=P.dir(p)==='/Projetos'&&n.t==='d';const xt=P.ext(p);
  Menu.open([
    inTrash?{label:'Restaurar',action:()=>{const d=FS.restore(p);toast('Restaurado',d,'files')}}:{label:'Abrir',action:()=>openPath(p)},
    !inTrash&&n.t==='f'?{label:'Abrir no Editor',action:()=>openPath(p,'editor')}:null,
    !inTrash&&(['html','htm'].includes(xt)||isProj)?{label:'Visualizar no Navegador',action:()=>isProj?openProjectPreview(p):openPath(p,'view')}:null,
    !inTrash&&isProj?{label:'Editar projeto',action:()=>openProjectEditor(p)}:null,
    '-',
    !inTrash?{label:'Renomear…',action:()=>renameItem(p)}:null,
    !inTrash?{label:'Duplicar',action:()=>{try{FS.copy(p,P.join(P.dir(p),FS.unique(P.dir(p),P.base(p))))}catch(e){Dialog.alert('Erro',e.message)}}}:null,
    !inTrash?{label:'Mover para…',action:()=>moveItemTo(p)}:null,
    {label:'Exportar / Compartilhar',action:()=>n.t==='d'?exportFolderZip(p):saveBlob(P.base(p),new Blob([nodeBytes(n)],{type:MIME[xt]||'application/octet-stream'}))},
    {label:'Informações',action:()=>Dialog.alert(P.base(p),`Local: ${P.dir(p)}\nTipo: ${n.t==='d'?'Pasta':(LANG_NAME[HL.lang(p)]||xt.toUpperCase()||'Arquivo')}\nTamanho: ${fmtSize(FS.size(n))}${n.t==='d'?`\nArquivos: ${FS.count(p)}`:''}\nModificado: ${fmtDate(n.m)}`,'files')},
    ...extra,'-',
    {label:inTrash?'Apagar permanentemente':'Mover para a Lixeira',danger:true,action:async()=>{if(inTrash&&!(await Dialog.confirm('Apagar permanentemente?','"'+P.base(p)+'" será removido para sempre.','Apagar',true,'trashFull')))return;try{FS.trash(p);if(!inTrash)toast('Movido para a Lixeira',P.base(p),'trashFull')}catch(e){Dialog.alert('Erro',e.message)}}}
  ],x,y);
}

    sc.addEventListener('click',()=>{if(!getSelection().toString())inp.focus()});
    printH(`<span class="ok h">iPhone Virtual PC — Terminal</span> <span class="badge sim">simulado</span>
<span class="d">Sessão iniciada em ${new Date().toLocaleString('pt-BR')}. Isto NÃO é um terminal Linux:
os comandos são funções JavaScript que manipulam o disco virtual salvo no navegador.</span>
Digite <span class="b">help</span> para ver os comandos. Experimente: <span class="b">ls</span>, <span class="b">tree Projetos</span>, <span class="b">js Math.PI</span>

    prompt();if(!isTouch)setTimeout(()=>inp.focus(),300);
  }};

function projectFiles(dir){const out=[];FS.walk(dir,(p,n)=>{if(n.t==='f')out.push({rel:P.rel(dir,p),path:p,node:n})});return out}
function exportSingleHTML(dir){const i=findIndex(dir);if(!i)return Dialog.alert('Sem página HTML','O projeto precisa de um index.html.','projects');
  const html=buildHTML(i,null,false);saveBlob(P.base(dir)+'.html',new Blob([html],{type:'text/html'}))}
function exportFolderZip(dir){const files=projectFiles(dir).map(f=>({name:P.base(dir)+'/'+f.rel,bytes:nodeBytes(f.node)}));if(!files.length)return toast('Pasta vazia','Nada para exportar','projects');saveBlob(P.base(dir)+'.zip',zipBuild(files))}
function exportProjectJSON(dir){const files={};projectFiles(dir).forEach(f=>files[f.rel]={d:f.node.d,e:f.node.e});saveBlob(P.base(dir)+'.vpc.json',new Blob([JSON.stringify({format:'ivpc-project',v:1,name:P.base(dir),exported:new Date().toISOString(),files},null,1)],{type:'application/json'}))}
function openProjectEditor(dir){WM.open('editor',{project:dir})}
function openProjectPreview(dir){const i=findIndex(dir);if(i)WM.open('browser',{url:'vfs:'+i});else toast('Sem index.html','Crie um index.html no projeto','projects')}
async function importIntoProjects(files){
  if(!files.length)return null;let created=null;
  try{
    if(files.length===1&&/\.zip$/i.test(files[0].name)){const ents=await unzip(await files[0].arrayBuffer());if(!ents.length)throw new Error('ZIP vazio');
      const tops=new Set(ents.map(e=>e.name.split('/')[0]));const strip=tops.size===1&&ents.every(e=>e.name.includes('/'));
      const name=FS.unique('/Projetos',strip?[...tops][0]:files[0].name.replace(/\.zip$/i,''));created='/Projetos/'+name;FS.mkdir(created);
      for(const e of ents){const rel=strip?e.name.slice(e.name.indexOf('/')+1):e.name;if(!rel)continue;const n=bytesToNode(rel,e.bytes);FS.write(P.join(created,rel),n.d,n.e)}}
    else if(files.length===1&&/\.json$/i.test(files[0].name)){const txt=await files[0].text();let j=null;try{j=JSON.parse(txt)}catch(e){}
      if(j&&j.format==='ivpc-project'){created='/Projetos/'+FS.unique('/Projetos',j.name||'Importado');FS.mkdir(created);for(const[rel,f]of Object.entries(j.files||{}))FS.write(P.join(created,rel),f.d,f.e||'u')}
      else if(j&&j.format==='ivpc-system'){toast('Backup do sistema','Use Configurações › Armazenamento › Restaurar backup','settings');return null}
      else{created='/Projetos/'+FS.unique('/Projetos',P.stem(files[0].name));FS.write(P.join(created,files[0].name),txt)}}
    else{const html=files.find(f=>/\.html?$/i.test(f.name));const name=FS.unique('/Projetos',html?(/^index\.html?$/i.test(html.name)?'Projeto importado':P.stem(html.name)):'Importado');created='/Projetos/'+name;FS.mkdir(created);
      for(const f of files){const n=bytesToNode(f.name,await readFileAsBytes(f));FS.write(P.join(created,f.name),n.d,n.e)}}
    toast('Projeto importado',P.base(created)+` · ${FS.count(created)} arquivo(s)`,'projects');return created;
  }catch(e){Dialog.alert('Falha na importação',e.message,'projects');return null}
}
Apps.projects={name:'Projetos',w:860,h:560,single:true,kw:'projetos sites apps exportar importar',about:'Crie, edite, importe e exporte projetos HTML/CSS/JS. Exportações podem ser salvas no app Arquivos do iPhone.',
  mount(w,o){
    w.body.innerHTML=`<div class="tb"><b style="font-size:15px;padding:0 6px">Projetos</b><div class="sp"></div><input class="field srch" placeholder="Buscar" style="width:130px" autocapitalize="off"><button class="btn small primary" data-a="new">${ic('plus')} Novo</button><button class="btn small" data-a="import">${ic('upload')} Importar</button></div><div class="pj"></div>`;
    const box=$('.pj',w.body);let q='';
    const grads=['linear-gradient(135deg,#5e5ce6,#bf5af2)','linear-gradient(135deg,#ff375f,#ff9f0a)','linear-gradient(135deg,#0a84ff,#64d2ff)','linear-gradient(135deg,#30d158,#0a84ff)','linear-gradient(135deg,#ff9f0a,#ffd60a)','linear-gradient(135deg,#1c1c1e,#5e5ce6)','linear-gradient(135deg,#bf5af2,#ff375f)'];
    const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
    const draw=()=>{let ps=[];try{ps=FS.list('/Projetos').filter(f=>f.dir)}catch(e){}if(q)ps=ps.filter(p=>p.name.toLowerCase().includes(q));
      if(!ps.length){box.innerHTML=`<div class="empty" style="height:100%">${appIcon('projects','lg')}<b style="color:var(--text)">${q?'Nenhum projeto encontrado':'Nenhum projeto ainda'}</b><span>Crie um projeto a partir de um modelo ou importe arquivos HTML, CSS, JS, ZIP ou JSON do iPhone.</span><button class="btn small primary" data-a="new">${ic('plus')} Novo projeto</button></div>`;return}
      box.innerHTML=`<div class="pj-grid">${ps.map(p=>{const files=projectFiles(p.path);const exts=[...new Set(files.map(f=>P.ext(f.path)).filter(x=>['html','css','js','json'].includes(x)))];let last=p.node.m;files.forEach(f=>{if(f.node.m>last)last=f.node.m});
        return`<div class="pj-c" data-p="${esc(p.path)}"><div class="pj-th" style="background:${grads[hash(p.name)%grads.length]}"><div class="chips">${exts.map(x=>`<i>${x.toUpperCase()}</i>`).join('')}</div><span>${esc(p.name)}</span></div>
          <div class="pj-b"><h4>${esc(p.name)}</h4><small>${files.length} arquivo(s) · ${fmtSize(FS.size(p.node))} · ${ago(last)}</small>
          <div class="row"><button class="btn small primary" data-a="edit">${ic('code')} Editar</button><button class="btn small" data-a="view">${ic('play')} Ver</button><button class="btn small" data-a="exp" aria-label="Exportar">${ic('share')}</button><button class="btn small" data-a="more" aria-label="Mais">${ic('more')}</button></div></div></div>`}).join('')}</div>`};
    const create=async()=>{let tpl='site';
      const html=`<div class="tpl-grid">${Object.entries(TPL).map(([k,t])=>`<button class="tpl ${k===tpl?'on':''}" data-t="${k}"><b>${esc(t.n)}</b><small>${esc(t.d)}</small></button>`).join('')}</div>`;
      const pr=Dialog.show({title:'Novo projeto',msg:'Escolha um modelo e dê um nome',html,input:FS.unique('/Projetos','Meu Projeto'),icon:'projects',buttons:[{label:'Cancelar',value:null},{label:'Criar',value:'__in',primary:true}]});
      setTimeout(()=>{$$('.dlg .tpl').forEach(b=>b.onclick=()=>{tpl=b.dataset.t;$$('.dlg .tpl').forEach(x=>x.classList.toggle('on',x===b))})},0);
      const name=await pr;if(!name)return;try{const d=createProject(name,tpl);toast('Projeto criado',P.base(d),'projects');openProjectEditor(d)}catch(e){Dialog.alert('Erro',e.message,'projects')}};
    const imp=async()=>{const fs=await pickFiles({accept:'.zip,.json,.html,.htm,.css,.js,.mjs,.txt,.md,.svg,image/*'});const d=await importIntoProjects(fs);if(d)openProjectEditor(d)};
    const expMenu=(p,b)=>{const r=b.getBoundingClientRect();Menu.open([{header:'Exportar "'+P.base(p)+'"'},{label:'HTML único (abre no Safari)',action:()=>exportSingleHTML(p)},{label:'Arquivo ZIP (todos os arquivos)',action:()=>exportFolderZip(p)},{label:'Backup do projeto (.json)',action:()=>exportProjectJSON(p)}],r.left-160,r.bottom+4,b)};
    w.body.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const c=b.closest('.pj-c');const p=c&&c.dataset.p;
      if(a==='new')create();else if(a==='import')imp();
      else if(a==='edit')openProjectEditor(p);else if(a==='view')openProjectPreview(p);else if(a==='exp')expMenu(p,b);
      else if(a==='more'){const r=b.getBoundingClientRect();Menu.open([{label:'Abrir pasta em Arquivos',action:()=>WM.open('files',{path:p})},{label:'Renomear…',action:()=>renameItem(p)},{label:'Duplicar',action:()=>FS.copy(p,P.join('/Projetos',FS.unique('/Projetos',P.base(p))))},'-',
        {label:'Mover para a Lixeira',danger:true,action:async()=>{if(await Dialog.confirm('Mover "'+P.base(p)+'" para a Lixeira?','Você poderá restaurá-lo pela Lixeira.','Mover',true,'trashFull')){FS.trash(p);toast('Projeto na Lixeira',P.base(p),'trashFull')}}}],r.left-150,r.bottom+4,b)}});
    onLongPress(box,e=>{const c=e.target.closest&&e.target.closest('.pj-c');if(c)itemMenu(c.dataset.p,e.clientX,e.clientY)});
    $('.srch',w.body).oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
    w.on('fs',p=>{if(p.startsWith('/Projetos')||p==='/Lixeira'||p.startsWith('/Lixeira'))draw()});
    w.api.reopen=o=>{if(o.create)create();if(o.import)imp()};
    draw();w.api.reopen(o);
  }};

Apps.settings={name:'Configurações',w:820,h:560,single:true,kw:'ajustes preferencias tema papel parede',about:'Personalize aparência, papel de parede, Dock, editor e gerencie o armazenamento.',
  mount(w,o){
    const tabs=[['look','Aparência','palette','linear-gradient(180deg,#5e5ce6,#3634a3)'],['wall','Papel de parede','image','linear-gradient(180deg,#64d2ff,#0a84ff)'],['dock','Dock e Mesa','grid','linear-gradient(180deg,#8e8e93,#48484a)'],['editor','Editor e Terminal','code','linear-gradient(180deg,#bf5af2,#8944ab)'],['storage','Armazenamento','disk','linear-gradient(180deg,#30d158,#248a3d)'],['about','Sobre e limitações','info','linear-gradient(180deg,#ff9f0a,#c93400)']];
    let tab=o.tab||'look';
    w.body.innerHTML=`<div class="st"><aside class="side st-side"></aside><div class="drawer-bg"></div><section class="st-main"></section></div>`;
    const side=$('.st-side',w.body),main=$('.st-main',w.body),bg=$('.drawer-bg',w.body);
    bg.onclick=()=>{side.classList.remove('open');bg.classList.remove('show')};
    const tog=(k,lbl,sub='')=>`<div class="row-s"><div class="lbl">${lbl}${sub?`<small>${sub}</small>`:''}</div><button class="tog ${S[k]?'on':''}" data-tog="${k}" role="switch" aria-checked="${!!S[k]}" aria-label="${esc(lbl)}"></button></div>`;
    const draw=()=>{side.innerHTML=`<div class="side-h">Configurações</div>`+tabs.map(([k,n,i,g])=>`<button class="side-i ${tab===k?'on':''}" data-t="${k}"><div class="appicon" style="background:${g}">${ic(i).replace('class="i ','class="i " style="color:#fff;width:14px;height:14px" ')}</div>${n}</button>`).join('');
      $$('.side-i',side).forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();side.classList.remove('open');bg.classList.remove('show')});
      const head=`<h2 style="display:flex;align-items:center;gap:8px"><button class="tbb mob" data-a="side" aria-label="Menu">${ic('sidebar')}</button>${tabs.find(t=>t[0]===tab)[1]}</h2>`;
      let h='';
      if(tab==='look')h=`<div class="grp-h">Tema</div><div class="grp"><div class="themes">${[['dark','Escuro','linear-gradient(135deg,#1c1c1e,#3a3a3c)'],['light','Claro','linear-gradient(135deg,#f5f5f7,#d1d1d6)'],['auto','Automático','linear-gradient(135deg,#f5f5f7 50%,#1c1c1e 50%)']].map(([k,n,g])=>`<button class="th-o ${S.theme===k?'on':''}" data-theme="${k}"><i style="background:${g}"></i>${n}</button>`).join('')}</div></div>
        <div class="grp-h">Cor de destaque</div><div class="grp"><div class="row-s"><div class="swatches">${ACCENTS.map(c=>`<button class="sw ${S.accent===c?'on':''}" data-acc="${c}" style="background:${c};color:${c}" aria-label="${c}"></button>`).join('')}</div></div></div>
        <div class="grp-h">Movimento</div><div class="grp">${tog('reduceMotion','Reduzir movimento','Desativa animações de janelas e do Dock')}</div>`;
      else if(tab==='wall')h=`<div class="grp"><div class="walls">${Object.entries(WALLS).map(([k,v])=>`<button class="wall-o ${S.wall===k?'on':''}" data-wall="${k}"><i style="background:${wallCss(k)};background-size:cover"></i>${v.n}</button>`).join('')}
        ${S.wallImg?`<button class="wall-o ${S.wall==='custom'?'on':''}" data-wall="custom"><i style="background:center/cover url('${S.wallImg}')"></i>Minha foto</button>`:''}</div>
        <div class="row-s"><div class="lbl">Usar uma foto do iPhone<small>A imagem é reduzida e guardada só neste aparelho</small></div><button class="btn small primary" data-a="photo">${ic('image')} Escolher</button></div>
        <div class="row-s"><div class="lbl">Brilho da área de trabalho</div><input type="range" class="range" style="max-width:200px" min="35" max="100" value="${Math.round(S.brightness*100)}" data-a="bright"></div></div>`;
      else if(tab==='dock')h=`<div class="grp"><div class="row-s"><div class="lbl">Tamanho dos ícones do Dock<small>${S.dockSize}px</small></div><input type="range" class="range" style="max-width:200px" min="38" max="72" value="${S.dockSize}" data-a="dock"></div>
        ${tog('magnify','Ampliação ao passar o mouse','Efeito de lupa (apenas com mouse/trackpad)')}${tog('showDeskIcons','Mostrar ícones na Mesa')}</div>`;
      else if(tab==='editor')h=`<div class="grp-h">Editor de código</div><div class="grp"><div class="row-s"><div class="lbl">Tamanho da fonte<small>${S.edFont}px</small></div><input type="range" class="range" style="max-width:200px" min="11" max="20" value="${S.edFont}" data-a="font"></div>
        ${tog('autosave','Salvamento automático','Salva ~1 s após parar de digitar')}${tog('wrap','Quebra de linha','Útil na tela do iPhone (oculta números de linha)')}</div>
        <div class="grp-h">Terminal</div><div class="grp"><div class="row-s"><div class="lbl">Cor do prompt</div><div class="swatches">${['#30d158','#64d2ff','#ffd60a','#ff9f0a','#bf5af2','#f5f5f7'].map(c=>`<button class="sw ${S.termColor===c?'on':''}" data-term="${c}" style="background:${c};color:${c}" aria-label="${c}"></button>`).join('')}</div></div></div>`;
      else if(tab==='storage'){const used=FS.size(FS.root);
        h=`<div class="grp"><div class="row-s"><div class="lbl">Mecanismo em uso<small>${Store.backend==='IndexedDB'?'Banco de dados do navegador — recomendado':Store.backend==='localStorage'?'Armazenamento local (limite ~5 MB)':'⚠ Somente memória: os dados serão perdidos ao fechar. Exporte seus projetos!'}</small></div><b>${Store.backend}</b></div>
          <div class="row-s"><div class="lbl">Disco virtual<small>${FS.count('/')} arquivos · <span class="q">calculando cota…</span></small><div class="meter"><i class="mt" style="width:2%"></i></div></div><b>${fmtSize(used)}</b></div>
          <div class="row-s"><div class="lbl">Armazenamento persistente<small class="pers">verificando…</small></div></div></div>
          <div class="grp-h">Backup</div><div class="grp"><div class="row-s"><div class="lbl">Exportar tudo<small>Arquivos, projetos e ajustes em um único .json — salve no app Arquivos</small></div><button class="btn small primary" data-a="backup">${ic('share')} Exportar</button></div>
          <div class="row-s"><div class="lbl">Restaurar backup<small>Substitui todo o conteúdo atual</small></div><button class="btn small" data-a="restore">${ic('upload')} Restaurar</button></div></div>
          <div class="grp-h">Zona de perigo</div><div class="grp"><div class="row-s"><div class="lbl">Apagar todos os dados<small>Remove arquivos, projetos e ajustes deste navegador</small></div><button class="btn small danger" data-a="reset">Apagar</button></div></div>
          <div class="card">${ic('info')} No iPhone, o Safari pode apagar dados de sites não usados por vários dias. Para máxima segurança, adicione à Tela de Início e exporte backups periodicamente.</div>`}
      else if(tab==='about')h=honestHTML();
      main.innerHTML=head+h;
      if(tab==='storage'){(async()=>{try{const e=await navigator.storage.estimate();const q=$('.q',main);if(q)q.textContent=`${fmtSize(e.usage||0)} de ~${fmtSize(e.quota||0)} disponíveis ao site`;const m=$('.mt',main);if(m&&e.quota)m.style.width=Math.max(2,Math.min(100,(e.usage/e.quota)*100))+'%'}catch(er){const q=$('.q',main);if(q)q.textContent='cota indisponível'}
        try{const p=await navigator.storage.persisted();const el2=$('.pers',main);if(el2)el2.textContent=p?'✓ Concedido — o navegador evitará apagar os dados':'Não concedido (o navegador decide). Adicionar à Tela de Início ajuda.'}catch(er){const el2=$('.pers',main);if(el2)el2.textContent='Não suportado neste navegador'}})()}};
    main.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.a==='side'){side.classList.add('open');bg.classList.add('show');return}
      if(b.dataset.tog){setS(b.dataset.tog,!S[b.dataset.tog]);draw();return}
      if(b.dataset.theme){setS('theme',b.dataset.theme);draw();return}
      if(b.dataset.acc){setS('accent',b.dataset.acc);draw();return}
      if(b.dataset.term){setS('termColor',b.dataset.term);draw();return}
      if(b.dataset.wall){setS('wall',b.dataset.wall);draw();return}
      const a=b.dataset.a;
      if(a==='photo'){const [f]=await pickFiles({accept:'image/*',multiple:false});if(!f)return;try{const url=await shrinkImage(f,2000);setS('wallImg',url);setS('wall','custom');draw();toast('Papel de parede','Foto aplicada','settings')}catch(er){Dialog.alert('Erro',er.message,'settings')}}
      else if(a==='backup'){saveBlob(`virtual-pc-backup-${new Date().toISOString().slice(0,10)}.json`,new Blob([JSON.stringify({format:'ivpc-system',v:1,exported:new Date().toISOString(),settings:S,fs:FS.root})],{type:'application/json'}))}
      else if(a==='restore'){const [f]=await pickFiles({accept:'.json,application/json',multiple:false});if(!f)return;try{const j=JSON.parse(await f.text());if(j.format!=='ivpc-system'||!j.fs||j.fs.t!=='d')throw new Error('Este arquivo não é um backup completo do Virtual PC. Para projetos, use o app Projetos › Importar.');
        if(!(await Dialog.confirm('Restaurar backup?','Todo o conteúdo atual será substituído pelo backup de '+(j.exported?new Date(j.exported).toLocaleString('pt-BR'):'data desconhecida')+'.','Restaurar',true,'settings')))return;
        FS.init(j.fs);S={...DEFAULTS,...(j.settings||{})};await Store.set('fs',FS.root);await Store.set('settings',S);location.reload()}catch(er){Dialog.alert('Falha ao restaurar',er.message,'settings')}}
      else if(a==='reset'){if(!(await Dialog.confirm('Apagar todos os dados?','Todos os arquivos, projetos e ajustes serão apagados deste navegador. Exporte um backup antes se quiser guardá-los.','Apagar tudo',true,'trashFull')))return;
        await Store.set('fs',null);await Store.set('settings',null);try{Object.keys(localStorage).filter(k=>k.startsWith('ivpc:')).forEach(k=>localStorage.removeItem(k))}catch(er){}location.reload()}});
    main.addEventListener('input',e=>{const a=e.target.dataset.a;if(!a)return;const v=+e.target.value;
      if(a==='bright')setS('brightness',v/100);else if(a==='dock'){setS('dockSize',v);e.target.closest('.row-s').querySelector('small').textContent=v+'px'}else if(a==='font'){setS('edFont',v);e.target.closest('.row-s').querySelector('small').textContent=v+'px'}});
    w.api.reopen=o=>{if(o.tab){tab=o.tab;draw()}};
    draw();
  }};
function shrinkImage(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.86))};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não foi possível ler a imagem'))};im.src=url})}
function honestHTML(){return`<div class="honest">
  <div class="card"><span class="badge real">${ic('check')} real</span><div><b>Funciona de verdade</b><br>Editor com destaque de sintaxe; prévia HTML/CSS/JS executada pelo motor do Safari em sandbox; arquivos salvos no aparelho (${Store.backend}); importação e exportação (HTML único, ZIP, JSON) para o app Arquivos; comandos <code>js</code>, <code>run</code> e <code>fetch</code> do terminal.</div></div>
  <div class="card"><span class="badge sim">${ic('alert')} simulado</span><div><b>Simulado</b><br>O Terminal é um conjunto de comandos escritos em JavaScript que manipulam o disco virtual. Não existe kernel, processos, permissões, rede de shell nem binários. "Disco virtual" e nomes como "visitante@virtual-pc" são apenas representações.</div></div>
  <div class="card"><span class="badge off">${ic('x')} indisponível</span><div><b>Não disponível neste app</b><br>macOS, Windows ou Linux nativos; apt, npm, node, python, git, ssh; <b>Claude Code</b> e <b>Codex</b> (nenhuma IA está conectada e nenhum dado é enviado a serviços externos). Sites externos dependem de internet e podem bloquear exibição incorporada.</div></div>
  <div class="card">${ic('lock')} <b>Privacidade:</b> tudo fica no seu aparelho. Este arquivo não usa servidor, conta, rastreadores nem bibliotecas externas.</div></div>`}

        <button class="wel-c" data-o="projects">${appIcon('projects','sm')}<span><b>Projetos</b><small>Crie, importe e exporte sites</small></span></button>
        <button class="wel-c" data-o="editor">${appIcon('editor','sm')}<span><b>Editor</b><small>HTML, CSS, JS e JSON com prévia</small></span></button>

    w.body.innerHTML=`<div class="about"><div class="logo">${LOGO}</div><h1>Virtual PC</h1><div class="ver">Edição Web 1.0 · Apple-inspired · arquivo único</div>
      <dl class="specs"><dt>Aparelho</dt><dd>${ios?'iPhone/iPad'+(iosV?' (iOS '+iosV+')':''):esc(navigator.platform||'Desconhecido')}</dd>
      <dt>Navegador</dt><dd>${/CriOS/.test(ua)?'Chrome':/FxiOS/.test(ua)?'Firefox':/Safari/.test(ua)&&!/Chrome/.test(ua)?'Safari':/Chrome/.test(ua)?'Chrome':'Outro'} (motor ${/AppleWebKit/.test(ua)?'WebKit':'outro'})</dd>
      <dt>Tela</dt><dd>${screen.width}×${screen.height} pt · ${devicePixelRatio}x</dd>
      <dt>Processador</dt><dd>${navigator.hardwareConcurrency||'?'} núcleos lógicos (informado pelo navegador)</dd>
      <dt>Armazenamento</dt><dd>${Store.backend} · ${fmtSize(FS.size(FS.root))} usados</dd>
      <dt>Rede</dt><dd>${navigator.onLine?'Online':'Offline'}</dd>
      <dt>Modo</dt><dd>${matchMedia('(display-mode: standalone)').matches||navigator.standalone?'Tela de Início (app)':'Aba do navegador'}</dd></dl>
      <div style="text-align:left">${honestHTML()}</div></div>`;
  }};

Apps.trash={name:'Lixeira',hidden:true,mount(w){WM.close(w);WM.open('files',{path:'/Lixeira'})}};

/* =========================================================
   15. TECLADO, VIEWPORT, ÍCONE, INICIALIZAÇÃO
   ========================================================= */
document.addEventListener('keydown',e=>{const mod=e.metaKey||e.ctrlKey;
  if(mod&&(e.code==='Space'||e.key===' ')){e.preventDefault();Spotlight.open();return}
  if(e.key==='Escape'){Menu.close();CC.close()}
  if(mod&&e.key.toLowerCase()==='w'&&WM.focused&&!e.shiftKey){e.preventDefault();WM.close(WM.focused)}
  if(mod&&e.key.toLowerCase()==='m'&&WM.focused){e.preventDefault();WM.minimize(WM.focused)}});
function onViewport(){const vv=window.visualViewport;const h=vv?vv.height:innerHeight;const r=document.documentElement.style;
  r.setProperty('--app-h',h+'px');r.setProperty('--app-top',(vv?vv.offsetTop:0)+'px');
  const kb=!!vv&&isTouch&&(innerHeight-vv.height>140);document.body.classList.toggle('kb',kb);
  if(window.scrollY)window.scrollTo(0,0);applyDockSize();WM.relayout();Menubar.clock()}
const applyDockSize=()=>document.documentElement.style.setProperty('--dock-s',(isMobile()?Math.min(S.dockSize,48):S.dockSize)+'px');
function makeTouchIcon(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#ff375f');g.addColorStop(.5,'#bf5af2');g.addColorStop(1,'#0a84ff');x.fillStyle=g;x.fillRect(0,0,180,180);
  const img=new Image();img.onload=()=>{x.drawImage(img,40,40,100,100);const u=c.toDataURL('image/png');[['apple-touch-icon',u],['icon',u]].forEach(([rel,href])=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)})};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" style="color:#fff" ').replace('currentColor','#ffffff'))}catch(e){}}

async function boot(){
  const bar=$('#boot .bar i');const step=p=>bar.style.width=p+'%';
  document.body.classList.add(isTouch?'touch':'mouse');step(15);
  await Store.init();step(45);
  let data=null,set=null;try{[data,set]=await Promise.all([Store.get('fs'),Store.get('settings')])}catch(e){}
  if(set&&typeof set==='object')S={...DEFAULTS,...set};
  FS.init(data);if(!data)seedFS();step(75);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  applySettings();Menubar.init();Dock.render();Desktop.init();makeTouchIcon();
  addEventListener('resize',debounce(onViewport,60));if(window.visualViewport){visualViewport.addEventListener('resize',onViewport);visualViewport.addEventListener('scroll',onViewport)}
  onViewport();
  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(S.theme==='auto')applySettings()});
  const flush=()=>{FS.save.flush();saveSettings.flush()};addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
  step(100);
  setTimeout(()=>{$('#boot').classList.add('out');setTimeout(()=>$('#boot').remove(),700);
    if(!S.welcomed)WM.open('welcome');
    if(Store.backend==='memória')setTimeout(()=>toast('Armazenamento indisponível','Este navegador não permite salvar dados aqui. Exporte seus projetos antes de fechar.','alert'),800);
    else if(Store.backend==='localStorage')setTimeout(()=>toast('Usando localStorage','IndexedDB indisponível; limite de ~5 MB. Exporte backups.','disk'),800)},reduceMotion()?50:500);
}
window.addEventListener('error',e=>{console.error(e.error||e.message)});
boot().catch(e=>{console.error(e);document.body.insertAdjacentHTML('beforeend',`<div style="position:fixed;inset:0;z-index:99999;background:#000;color:#fff;padding:30px;font:14px -apple-system,sans-serif">Falha ao iniciar: ${esc(e.message)}</div>`)});
</script>
