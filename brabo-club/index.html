<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brabo Club — Corte de respeito</title>
<meta name="description" content="Tudo o que você precisa para cortar, aparar e sair daqui do jeito que merece.">
<script>
  (function(){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var d = document.documentElement;
    d.classList.add('intro');
    setTimeout(function(){ d.classList.remove('intro','intro-play'); }, 5000);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block">
<style>
  @font-face{ font-family:"InterVar"; font-style:normal; font-weight:100 900; font-display:block; src:url(assets/fonts/inter-var.woff2) format("woff2"); }

  :root{
    --u: max( min(calc(100vw / 1563), calc(100vh / 460)), 0.80px );
    --ink:#ffffff; --ink-mark:rgba(255,255,255,.98); --ink-nav:rgba(255,255,255,.91);
    --ink-sub:rgba(255,255,255,.50); --ink-pill:rgba(255,255,255,.88); --ink-dark:#000000;
    --hairline:rgba(255,255,255,.98); --glass-bg:rgba(255,255,255,.12); --glass-line:rgba(255,255,255,.15);
    --r-btn: calc(10 * var(--u));
  }
  @supports (height:100dvh){ :root{ --u: max( min(calc(100vw / 1563), calc(100dvh / 460)), 0.80px ); } }
  @supports not (width: max(1px,1vw)){ :root{ --u: calc(100vw / 1563); } }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#000; color:#fff; overflow:hidden;
    font-family:"InterVar","Inter","Helvetica Neue",Arial,system-ui,sans-serif;
    font-optical-sizing:none; font-feature-settings:"kern" 1,"calt" 1;
    -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision;
  }

  .sr{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

  a:focus-visible, button:focus-visible{ outline:2px solid #9b8cff; outline-offset:3px; border-radius:4px }

  /* ---------- Layers ---------- */
  .frame{position:fixed; inset:0; overflow:hidden; background:#000; isolation:isolate}

  .sky{
    position:absolute; top:calc(-1.5 * var(--u)); left:50%; transform:translateX(-50%);
    width:100%; height:auto; aspect-ratio:1664 / 1248;
    min-height:calc(100% + 1.5 * var(--u));
    z-index:0; pointer-events:none; user-select:none; display:block;
  }
  .veil{position:absolute; inset:0; background:rgba(0,0,0,.06); z-index:1; pointer-events:none}

  .screen{position:absolute; top:0; left:50%; transform:translateX(-50%); width:calc(1563 * var(--u)); height:calc(1006 * var(--u)); z-index:2}
  .hero{position:absolute; left:calc(0.9 * var(--u)); right:calc(-0.9 * var(--u)); top:0; text-align:center}

  /* ---------- Scene animation (barbershop artwork) ---------- */
  .pole-stripes{animation:pole 2.4s linear infinite}
  @keyframes pole{ from{transform:translateY(0)} to{transform:translateY(-72px)} }
  .float-a{animation:floatA 7s ease-in-out infinite}
  .float-b{animation:floatB 8.5s ease-in-out infinite}
  .float-c{animation:floatA 9s ease-in-out infinite -3s}
  .float-d{animation:floatB 6.5s ease-in-out infinite -2s}
  @keyframes floatA{ 0%,100%{transform:translate(0,0) rotate(0deg)} 50%{transform:translate(6px,-14px) rotate(3deg)} }
  @keyframes floatB{ 0%,100%{transform:translate(0,0) rotate(0deg)} 50%{transform:translate(-8px,-10px) rotate(-4deg)} }
  .twinkle{animation:twinkle 3s ease-in-out infinite}
  .twinkle:nth-child(3n){animation-duration:4.2s; animation-delay:-1s}
  .twinkle:nth-child(3n+1){animation-duration:2.6s; animation-delay:-2s}
  @keyframes twinkle{ 0%,100%{opacity:.25} 50%{opacity:1} }
  .smoke{animation:smoke 9s ease-in-out infinite}
  .smoke-2{animation:smoke 11s ease-in-out infinite reverse}
  @keyframes smoke{ 0%,100%{transform:translateX(0)} 50%{transform:translateX(18px)} }
  .glow{animation:glow 5s ease-in-out infinite}
  @keyframes glow{ 0%,100%{opacity:.85} 50%{opacity:1} }
  .fly{animation:fly 9s linear infinite}
  .fly-2{animation:fly2 13s linear infinite -5s}
  @keyframes fly{ from{transform:translate(-120px,40px) rotate(0deg)} to{transform:translate(1900px,-60px) rotate(720deg)} }
  @keyframes fly2{ from{transform:translate(1900px,-20px) rotate(0deg)} to{transform:translate(-160px,50px) rotate(-540deg)} }
  .float-a, .float-b, .float-c, .float-d, .glow{transform-box:fill-box; transform-origin:center}

  /* ---------- Header ---------- */
  .bar{position:absolute; left:calc(50% - 495.5 * var(--u)); top:calc(7.5 * var(--u)); width:calc(983.5 * var(--u)); height:calc(36.2 * var(--u)); z-index:3}

  .brand{
    position:absolute; left:0; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:calc(11.4 * var(--u));
    color:var(--ink-mark); text-decoration:none;
  }
  .brand svg{width:calc(26.9 * var(--u)); height:calc(16.6 * var(--u)); overflow:visible; display:block}
  .brand span{font-size:calc(17.5 * var(--u)); font-weight:550; font-variation-settings:'opsz' 22; letter-spacing:0; line-height:1}

  .links{position:absolute; left:calc(353.8 * var(--u)); top:50%; transform:translateY(-50%); display:flex; gap:calc(25.2 * var(--u))}
  .links a{
    font-size:calc(11.9 * var(--u)); font-weight:450; font-variation-settings:'opsz' 15;
    letter-spacing:calc(-0.30 * var(--u)); color:var(--ink-nav); text-decoration:none; white-space:nowrap;
    transition:color .18s ease;
  }
  .links a:hover{color:#fff}

  .actions{position:absolute; right:0; top:0; display:flex; gap:calc(7.8 * var(--u))}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    border-radius:var(--r-btn); text-decoration:none; white-space:nowrap; line-height:1; border:0;
    transition:background-color .18s ease, color .18s ease, border-color .18s ease;
  }
  .ghost{background:transparent; color:#fff; border:calc(1 * var(--u)) solid rgba(255,255,255,.98)}
  .ghost:hover{background:rgba(255,255,255,.10)}
  .solid{background:#fff; color:#000}
  .solid:hover{background:#e9e9ea}

  .bar .btn{
    height:calc(36.2 * var(--u)); line-height:calc(36.2 * var(--u));
    font-size:calc(11.9 * var(--u)); font-weight:500; font-variation-settings:'opsz' 15;
    letter-spacing:calc(-0.38 * var(--u));
  }
  .bar .ghost{width:calc(85.5 * var(--u))}
  .bar .solid{width:calc(88.2 * var(--u)); font-size:calc(12.15 * var(--u)); font-weight:550; letter-spacing:calc(-0.35 * var(--u))}

  .menu{
    display:none; width:calc(36.2 * var(--u)); height:calc(36.2 * var(--u));
    border-radius:calc(10 * var(--u)); border:calc(1 * var(--u)) solid rgba(255,255,255,.35);
    background:transparent; color:#fff; cursor:pointer; padding:0;
    align-items:center; justify-content:center;
    transition:background-color .18s ease;
  }
  .menu svg{width:55%; height:55%}
  .menu:hover{background:rgba(255,255,255,.10)}

  .sheet{
    display:none; position:absolute; top:calc(100% + 9 * var(--u)); right:0;
    min-width:calc(210 * var(--u)); padding:calc(10 * var(--u)); border-radius:calc(14 * var(--u));
    background:rgba(18,18,20,.88); border:calc(1 * var(--u)) solid rgba(255,255,255,.15);
    -webkit-backdrop-filter:blur(calc(18 * var(--u))) saturate(140%);
    backdrop-filter:blur(calc(18 * var(--u))) saturate(140%);
    box-shadow:0 calc(18 * var(--u)) calc(44 * var(--u)) rgba(0,0,0,.55);
  }
  .bar[data-open="true"] .sheet{display:block}
  .sheet a:not(.btn){
    display:block; padding:calc(9 * var(--u)) calc(10 * var(--u)); border-radius:calc(9 * var(--u));
    color:var(--ink-nav); text-decoration:none;
    font-size:calc(14 * var(--u)); font-weight:450; font-variation-settings:'opsz' 15; letter-spacing:calc(-0.30 * var(--u));
  }
  .sheet a:not(.btn):hover{background:rgba(255,255,255,.08); color:#fff}
  .sheet .btn.solid{
    display:flex; width:100%; height:calc(38 * var(--u)); margin-top:calc(8 * var(--u));
    font-size:calc(14 * var(--u)); font-weight:500; font-variation-settings:'opsz' 15;
    letter-spacing:calc(-0.30 * var(--u)); color:#000;
  }

  /* ---------- Hero ---------- */
  .pill{
    position:absolute; top:calc(129.6 * var(--u)); left:50%; transform:translateX(-50%);
    display:inline-flex; align-items:center;
    width:calc(194.5 * var(--u)); height:calc(22.4 * var(--u));
    padding-left:calc(4.0 * var(--u)); padding-right:calc(8.6 * var(--u));
    border-radius:999px; background:rgba(255,255,255,.12); border:calc(1 * var(--u)) solid rgba(255,255,255,.15);
    -webkit-backdrop-filter:blur(calc(10 * var(--u))); backdrop-filter:blur(calc(10 * var(--u)));
    white-space:nowrap; text-decoration:none; transition:background-color .18s ease;
  }
  .pill:hover{background:rgba(255,255,255,.17)}
  .chip{
    display:inline-flex; align-items:center; justify-content:center;
    width:calc(33.3 * var(--u)); height:calc(14 * var(--u)); border-radius:999px;
    background:#fff; color:#000; font-size:calc(10.2 * var(--u)); font-weight:600; font-variation-settings:'opsz' 14;
    padding-top:calc(1.7 * var(--u)); letter-spacing:calc(-0.1 * var(--u)); line-height:1;
  }
  .pill-label{
    margin-left:calc(3.4 * var(--u)); position:relative; top:calc(1 * var(--u));
    color:rgba(255,255,255,.88); font-size:calc(12.4 * var(--u)); font-weight:450; font-variation-settings:'opsz' 15;
    letter-spacing:calc(-0.48 * var(--u)); height:calc(22.4 * var(--u)); line-height:calc(22.4 * var(--u));
  }
  .pill svg{width:calc(9.5 * var(--u)); height:calc(8 * var(--u)); margin-left:auto; color:rgba(255,255,255,.95); display:block}

  .hero h1{
    position:absolute; left:calc(0.6 * var(--u)); right:calc(-0.6 * var(--u)); top:calc(168.5 * var(--u)); margin:0;
    font-size:calc(55 * var(--u)); font-weight:545; font-variation-settings:'opsz' 32;
    line-height:calc(56 * var(--u)); letter-spacing:calc(-0.76 * var(--u)); color:#fff;
  }
  .ln{display:block; overflow:hidden; padding-bottom:calc(7 * var(--u)); margin-bottom:calc(-7 * var(--u))}
  .ln-i{display:block}

  .hero p{
    position:absolute; left:50%; transform:translateX(calc(-50% + 0.25 * var(--u))); top:calc(292.6 * var(--u)); margin:0;
    width:calc(700 * var(--u));
    font-size:calc(15.7 * var(--u)); font-weight:400; font-variation-settings:'opsz' 20;
    line-height:calc(24 * var(--u)); letter-spacing:calc(-0.05 * var(--u)); color:rgba(255,255,255,.50);
  }

  .cta{position:absolute; left:50%; transform:translateX(-50%); top:calc(342.8 * var(--u)); display:flex; gap:calc(9.9 * var(--u))}
  .cta .btn{
    height:calc(36.4 * var(--u)); line-height:calc(36.4 * var(--u)); padding-top:calc(2 * var(--u));
    font-size:calc(13.3 * var(--u)); font-weight:480; font-variation-settings:'opsz' 16; letter-spacing:calc(-0.34 * var(--u));
  }
  .cta .ghost{width:calc(99.6 * var(--u))}
  .cta .solid{width:calc(96.4 * var(--u))}

  /* ---------- Responsive ---------- */
  @media (max-width:1023px){
    :root{ --u: calc(100vw/900); }
    .bar{left:4.2vw; width:91.6vw}
    .links, .bar .actions > .solid{display:none}
    .menu{display:inline-flex}
  }
  @media (max-width:640px){
    :root{ --u: calc(100vw/486); }
    .bar{left:5.2vw; width:89.6vw}
    .hero p{width:min(calc(560 * var(--u)), 88vw); line-height:calc(23 * var(--u))}
    .pill{padding-right:calc(8 * var(--u))}
  }
  @media (max-width:380px){
    :root{ --u: calc(100vw/470); }
  }
  @media (max-width:1023px) and (max-height:520px){
    :root{ --u: min(calc(100vw/900), calc(100vh/470)); }
  }
  @media (min-aspect-ratio:3/1){
    .sky{top:auto; bottom:0; height:auto; min-height:0; width:100%; min-width:100%}
    .veil{background:linear-gradient(to bottom, rgba(0,0,0,.82) 0%, rgba(0,0,0,.72) 55%, rgba(0,0,0,.18) 100%)}
  }

  /* ---------- Entrance ---------- */
  @media (prefers-reduced-motion: no-preference){
    :root{
      --e-reveal: cubic-bezier(.18,.85,.26,1);
      --e-soft:   cubic-bezier(.22,1,.36,1);
      --e-nav:    cubic-bezier(.33,1,.68,1);
      --rise:     calc(10 * var(--u));
      --rise-lg:  calc(13 * var(--u));
    }
    .intro .brand, .intro .links a, .intro .actions > .btn, .intro .actions > .menu,
    .intro .pill, .intro .hero p, .intro .cta .btn{opacity:0}
    .intro .ln-i{transform:translate3d(0,115%,0)}
    .intro .brand, .intro .pill, .intro .hero p, .intro .ln-i, .intro .cta .btn{will-change:transform,opacity}

    @keyframes i-rise{ from{opacity:0; transform:translate3d(0,var(--rise),0)} to{opacity:1; transform:none} }
    @keyframes i-rise-cy{ from{opacity:0; transform:translateY(-50%) translate3d(0,var(--rise),0)} to{opacity:1; transform:translateY(-50%)} }
    @keyframes i-pill{ from{opacity:0; transform:translateX(-50%) translate3d(0,var(--rise-lg),0) scale(.972)} to{opacity:1; transform:translateX(-50%)} }
    @keyframes i-sub{ from{opacity:0; transform:translateX(calc(-50% + 0.25 * var(--u))) translate3d(0,var(--rise-lg),0)} to{opacity:1; transform:translateX(calc(-50% + 0.25 * var(--u)))} }
    @keyframes i-btn{ from{opacity:0; transform:translate3d(0,var(--rise-lg),0) scale(.986)} to{opacity:1; transform:none} }
    @keyframes i-line{ from{transform:translate3d(0,115%,0)} to{transform:none} }

    .intro-play .brand{animation:i-rise-cy .62s var(--e-nav) 0s both}
    .intro-play .links a{animation:i-rise .55s var(--e-nav) both}
    .intro-play .links a:nth-child(1){animation-delay:.070s}
    .intro-play .links a:nth-child(2){animation-delay:.115s}
    .intro-play .links a:nth-child(3){animation-delay:.160s}
    .intro-play .links a:nth-child(4){animation-delay:.205s}
    .intro-play .links a:nth-child(5){animation-delay:.250s}
    .intro-play .actions > .btn, .intro-play .actions > .menu{animation:i-rise .55s var(--e-nav) .215s both}
    .intro-play .actions > .ghost{animation:i-rise .55s var(--e-nav) .160s both}
    .intro-play .pill{animation:i-pill .62s var(--e-soft) .26s both}
    .intro-play .ln:nth-child(1) .ln-i{animation:i-line .95s var(--e-reveal) .34s both}
    .intro-play .ln:nth-child(2) .ln-i{animation:i-line .95s var(--e-reveal) .48s both}
    .intro-play .hero p{animation:i-sub .70s var(--e-soft) .86s both}
    .intro-play .cta .btn:nth-child(1){animation:i-btn .62s var(--e-soft) 1.00s both}
    .intro-play .cta .btn:nth-child(2){animation:i-btn .62s var(--e-soft) 1.07s both}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div class="frame">

  <!-- Barbershop artwork: black upper half; below, a spinning barber pole in front of
       amber smoke, floating scissors / razor / comb / brush, and wine-red clouds at the bottom. -->
  <svg class="sky" aria-hidden="true" viewBox="0 0 1664 1248" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g-amber" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#f3b45a" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#c9772c" stop-opacity=".55"/>
        <stop offset=".7" stop-color="#6b3112" stop-opacity=".18"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="g-chrome" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#5b5e66"/>
        <stop offset=".28" stop-color="#f4f4f6"/>
        <stop offset=".55" stop-color="#9da0a8"/>
        <stop offset="1" stop-color="#2b2d33"/>
      </linearGradient>
      <linearGradient id="g-brass" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#5a3a12"/>
        <stop offset=".3" stop-color="#f1cf86"/>
        <stop offset=".6" stop-color="#b8862f"/>
        <stop offset="1" stop-color="#3b250a"/>
      </linearGradient>
      <linearGradient id="g-glass" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".55"/>
        <stop offset=".22" stop-color="#fff" stop-opacity=".28"/>
        <stop offset=".34" stop-color="#fff" stop-opacity=".05"/>
        <stop offset=".75" stop-color="#000" stop-opacity=".15"/>
        <stop offset="1" stop-color="#000" stop-opacity=".65"/>
      </linearGradient>
      <linearGradient id="g-steel" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#f6f6f8"/>
        <stop offset=".5" stop-color="#a7aab2"/>
        <stop offset="1" stop-color="#4d5058"/>
      </linearGradient>
      <linearGradient id="g-wood" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#6b3a1c"/>
        <stop offset="1" stop-color="#2a1309"/>
      </linearGradient>
      <pattern id="p-stripes" width="120" height="72" patternUnits="userSpaceOnUse" patternTransform="skewY(-28)">
        <rect width="120" height="72" fill="#f5f1ea"/>
        <rect y="0" width="120" height="22" fill="#c8102e"/>
        <rect y="36" width="120" height="22" fill="#1d3f8f"/>
      </pattern>
      <clipPath id="c-front"><polygon points="560,800 1100,800 1100,900 560,900"/></clipPath>
      <clipPath id="c-glass"><rect x="790" y="640" width="84" height="330" rx="6"/></clipPath>
      <filter id="f-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
      <filter id="f-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>

    <rect width="1664" height="1248" fill="#000"/>

    <!-- stars / dust sparkles in the black band -->
    <g fill="#fff">
      <circle class="twinkle" cx="140" cy="120" r="1.4"/><circle class="twinkle" cx="310" cy="260" r="1.1"/>
      <circle class="twinkle" cx="520" cy="80" r="1.3"/><circle class="twinkle" cx="1180" cy="140" r="1.5"/>
      <circle class="twinkle" cx="1390" cy="300" r="1.1"/><circle class="twinkle" cx="1540" cy="90" r="1.3"/>
      <circle class="twinkle" cx="90" cy="430" r="1.2"/><circle class="twinkle" cx="1600" cy="470" r="1.4"/>
      <circle class="twinkle" cx="420" cy="500" r="1.1"/><circle class="twinkle" cx="1260" cy="520" r="1.2"/>
      <circle class="twinkle" cx="230" cy="600" r="1.5"/><circle class="twinkle" cx="1460" cy="640" r="1.3"/>
      <circle class="twinkle" cx="700" cy="560" r="1"/><circle class="twinkle" cx="980" cy="590" r="1.1"/>
      <circle class="twinkle" cx="60" cy="700" r="1.2"/><circle class="twinkle" cx="1630" cy="760" r="1"/>
    </g>

    <!-- amber barbershop smoke behind the pole -->
    <g class="glow">
      <ellipse cx="832" cy="860" rx="520" ry="300" fill="url(#g-amber)"/>
    </g>
    <g class="smoke" filter="url(#f-blur)" opacity=".75">
      <path d="M640 980 C600 860 690 820 700 720 C760 800 740 880 790 900 C780 820 820 760 832 660 C860 760 880 820 870 900 C920 860 930 790 960 730 C990 840 1060 880 1020 990 Z" fill="#d68a36"/>
      <path d="M520 1010 C540 930 600 920 610 850 C660 920 650 960 700 1000 Z" fill="#b8642a"/>
      <path d="M1140 1010 C1120 930 1060 920 1050 850 C1000 920 1010 960 960 1000 Z" fill="#b8642a"/>
    </g>

    <!-- barber pole -->
    <g>
      <!-- brass ring behind -->
      <ellipse cx="832" cy="800" rx="250" ry="46" transform="rotate(-12 832 800)" fill="none" stroke="url(#g-brass)" stroke-width="5" opacity=".9"/>
      <rect x="806" y="984" width="52" height="58" fill="url(#g-chrome)"/>
      <rect x="772" y="1036" width="120" height="16" rx="6" fill="url(#g-chrome)"/>
      <rect x="780" y="612" width="104" height="30" rx="8" fill="url(#g-chrome)"/>
      <path d="M790 612 C790 570 874 570 874 612 Z" fill="url(#g-chrome)"/>
      <circle cx="832" cy="566" r="14" fill="url(#g-chrome)"/>
      <g clip-path="url(#c-glass)">
        <rect class="pole-stripes" x="790" y="630" width="84" height="430" fill="url(#p-stripes)"/>
        <rect x="790" y="640" width="84" height="330" fill="url(#g-glass)"/>
      </g>
      <rect x="780" y="964" width="104" height="26" rx="8" fill="url(#g-chrome)"/>
      <!-- brass ring front half -->
      <ellipse cx="832" cy="800" rx="250" ry="46" transform="rotate(-12 832 800)" fill="none" stroke="url(#g-brass)" stroke-width="5" clip-path="url(#c-front)"/>
    </g>

    <!-- scissors (left) -->
    <g transform="translate(470 700) rotate(-24)"><g class="float-a">
      <g>
        <path d="M70 52 L250 18 L256 24 L86 66 Z" fill="url(#g-steel)"/>

<script>
  // Entrance animation
  (function(){
    var d = document.documentElement;
    if (!d.classList.contains('intro')) return;
    var started = false;
    function finish(){ d.classList.remove('intro','intro-play'); }
    function start(){
      if (started) return; started = true;
      d.classList.add('intro-play');
      var last = document.querySelector('.cta .btn:last-child');
      if (last) last.addEventListener('animationend', function(e){ if (e.target === last) finish(); });
      setTimeout(finish, 3000);
    }
    function go(){ requestAnimationFrame(function(){ requestAnimationFrame(start); }); }
    var fallback = setTimeout(go, 700);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ clearTimeout(fallback); go(); });
  })();

  // Mobile menu
  (function(){
    var bar = document.querySelector('.bar');
    var btn = document.getElementById('menu-btn');
    function set(open){
      bar.dataset.open = open ? 'true' : 'false';
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      btn.setAttribute('aria-label', open ? 'Fechar menu' : 'Menu');
    }
    set(false);
    btn.addEventListener('click', function(e){ e.stopPropagation(); set(bar.dataset.open !== 'true'); });
    document.addEventListener('click', function(e){ if (!bar.contains(e.target)) set(false); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') set(false); });
  })();
</script>
