<!--
  JESUS Remix · André Castro — animação de marca LONGA, sobre o Corte_Jesus.wav inteiro (0 → 29,54 s).
  Irmã de marca.html (7,2 s, intacta). Determinística: window.seek(t); ?w=&h= escolhe layout dedicado.
  TODO o tempo está em batidas da grade do beatmap.json:  T(b) = 0,087 + b · 60/133,03
  Regra de sincronia: toda ação começa ou termina em batida/meia-batida; movimentos contínuos chegam no alvo na batida;
  compassos (b múltiplo de 4) = mudança maior; 'impactos' do beatmap = acentos (ripple, micro-flash, pulso no cromado).
    b0–b4    ✕ cromado acende no escuro (1 ação/compasso)
    b4–b8    flash → ✕ de vidro gira sobre a grade
    b8–b16   CENA VETORIAL 1: caneta desenha o J, 1 âncora por batida (meia-batida no fim), alças puxadas na hora
    b16–b20  2: marquee no E → caixa delimitadora → E arrastado com smart guides magenta (X/Y, espaçamento)
    b20–b24  3: zoom extremo numa âncora do S: hover acende pontos, alça girada, curva do S morfa
    b24–b28  4: kerning U–S em passos de meia-batida com valor numérico; clique no swatch magenta do painel
    b28–b30  5: preenchimento letra a letra (1 por meia-batida) cinza → cromo magenta
    b30–b32  extrusão cresce em 4 passos de meia-batida; break (13,90): câmera recua e revela a palavra
    b32      DROP 14,52 — corte seco: azul, ✕ + ANDRÉ × CASTRO; palavras recolhem no ✕ (b34, b34.5, b35)
    b36–b56  padrão ✕/globo ondulando, pulso por batida; variações a cada 2 compassos (b44 inversão, b52 escala)
    b56–b57  wipe ✕ branco gigante → corte seco b57 para o estúdio
    b60      CLÍMAX 27,15 — JESUS remix grande + contador 15.12.2026 (1 dígito por meia-batida até b64)
    b64      28,95 hold final
-->

<body>

<script>
(() => {
/* ═════════════ Tempo — grade do beatmap.json (arquivo inteiro) ═════════════ */
const BPM = 133.03, BEAT = 60 / BPM, OFFSET = 0.087;
const FPS = 30, DURATION = 886 / FPS;              // 29,533 s (áudio 29,538 s)
const T = b => OFFSET + b * BEAT;                  // batida → segundos
const IMPACTOS = [0.035, 2.612, 3.866, 4.412, 6.281, 6.734, 7.407, 8.684, 12.225, 14.791, 15.697, 17.566, 18.483, 19.412, 19.876,
  20.329, 20.793, 21.258, 21.722, 23.081, 23.545, 24.218, 24.903, 25.588, 28.642, 29.327];   // beatmap.json → impactos
const CUT = b => Math.round(T(b) * FPS) / FPS - 1e-4;   // corte no quadro mais próximo da batida
const SYNC = [];                                   // log de ações (QA de sincronia)
const ev = (name, b) => { SYNC.push({ name, b, t: +T(b).toFixed(3) }); return T(b); };
window.FPS = FPS; window.DURATION = DURATION; window.MARCA = { modo: 'longa', AUDIO_IN: 0, BPM, SYNC };

const FMT = JR.format(), W = FMT.W, H = FMT.H, KIND = FMT.kind;
const U = Math.min(W, H) / 1080, cx = W / 2, cy = H / 2;
const US = U * (KIND === 'story' ? 1.18 : 1);       // escala da interface vetorial (âncoras, alças, rótulos)
const { el, clamp, lerp, TOK } = JR, NS = JR.NS;
const ease = n => gsap.parseEase(n);
const eo = ease('expo.out'), p3i = ease('power3.in'), p3o = ease('power3.out'), p2io = ease('power2.inOut'), p3io = ease('power3.inOut'),
      p2i = ease('power2.in'), sio = ease('sine.inOut'), eio = ease('expo.inOut');
const P = (t, t0, d) => clamp((t - t0) / d);
const PB = (t, b0, b1) => clamp((t - T(b0)) / (T(b1) - T(b0)));   // progresso entre duas batidas

/* ═════════════ Layouts dedicados ═════════════ */
const LAYOUTS = {
  square: { s1: 470, s2: 330, kf: 1, panel: { x: 1080 - 262, y: 540 - 300, w: 190 }, ccxP: 430, ccy: 540,
    lock: { mark: 112, text: 58, gap: 34 }, grid: { cell: 150 },
    fin: { x: 540, y: 470, size: 400, x2: 540, y2: 262, sc2: .7,
      title: { cx: 540, top: 452, size: 196 }, remix: { cx: 610, top: 566, size: 132 }, count: { cx: 540, top: 812, size: 92, depth: 6 } } },
  story: { s1: 560, s2: 390, kf: 1.35, panel: { x: 1080 - 290, y: 1180, w: 196 }, ccxP: 430, ccy: 820,
    lock: { mark: 150, text: 70, gap: 40 }, grid: { cell: 150 },
    fin: { x: 540, y: 800, size: 520, x2: 540, y2: 560, sc2: .74,
      title: { cx: 540, top: 840, size: 214 }, remix: { cx: 615, top: 966, size: 146 }, count: { cx: 540, top: 1270, size: 100, depth: 7 } } },
  wide: { s1: 470, s2: 330, kf: 1, panel: { x: 1920 - 290, y: 540 - 300, w: 206 }, ccxP: 830, ccy: 540,
    lock: { mark: 132, text: 70, gap: 40 }, grid: { cell: 150 },
    fin: { x: 960, y: 480, size: 440, x2: 560, y2: 500, sc2: .9,
      title: { left: 920, top: 300, size: 214 }, remix: { left: 1060, top: 420, size: 140 }, count: { left: 930, top: 690, size: 96, depth: 6 } } },
};
const LY = LAYOUTS[KIND];

/* ═════════════ Geometria do ✕ (mesma proporção da marca: traço 0,27 · ponta quadrada) ═════════════ */
const XL = 122.6, XW = 27;
function xPts(inset = 0) {
  const a = XL / 2 - inset, b = XW / 2 - inset, c = Math.SQRT1_2;
  return [[a, b], [b, b], [b, a], [-b, a], [-b, b], [-a, b], [-a, -b], [-b, -b], [-b, -a], [b, -a], [b, -b], [a, -b]]
    .map(([x, y]) => [(x - y) * c, (x + y) * c]);
}
const xD = (i = 0) => 'M' + xPts(i).map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L') + 'Z';
const DEFS = document.getElementById('D');
const addDefs = html => { const g = document.createElementNS(NS, 'g'); g.innerHTML = html; while (g.firstChild) DEFS.appendChild(g.firstChild); };
const svgEl = (parent, vb, w, h, css, html) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', vb);
  s.setAttribute('width', w); s.setAttribute('height', h); Object.assign(s.style, { position: 'absolute', left: 0, top: 0 }, css || {});
  s.innerHTML = html || ''; parent.appendChild(s); return s; };
const stops = arr => arr.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ''}/>`).join('');

/* Cromado: gradiente de "ambiente refletido" (céu claro / horizonte escuro / chão azul / rebatedor magenta) */
const CHROME = [[0, '#0b1020'], [.14, '#2b3a5c'], [.27, '#aebfdc'], [.34, '#ffffff'], [.40, '#dfe8f8'], [.47, '#56698f'],
  [.51, '#0c1222'], [.56, '#123064'], [.64, '#2f86f2'], [.71, '#bfe0ff'], [.76, '#ffffff'], [.82, '#f2b6f4'],
  [.88, '#9c3aa6'], [.94, '#2a1338'], [1, '#0a0d18']];
const GLASS = [[0, '#e9f6ff', .92], [.22, '#8fcaff', .78], [.45, '#2f8ef8', .62], [.62, '#037AF4', .70], [.8, '#0a4f96', .82], [1, '#5fb0ff', .9]];

/* ═════════════ ✕ 3D: extrusão em camadas (preserve-3d) + face com chanfro, especular e borda clara ═════════════ */
let UID = 0;
function sym3D(parent, o) {
  const id = 'x' + (UID++), S = o.size * 1.4, VB = '-70 -70 140 140', glass = o.kind === 'glass';
  const N = o.layers || 30, D = o.size * (o.depth || .17), dz = D / N, bev = o.bevel || 4.2;
  addDefs(`
    <linearGradient id="${id}A" gradientUnits="userSpaceOnUse" x1="-60" y1="-60" x2="60" y2="60">${stops(glass ? GLASS : CHROME)}</linearGradient>
    <linearGradient id="${id}B" gradientUnits="userSpaceOnUse" x1="-60" y1="-60" x2="60" y2="60">${stops(glass ? GLASS : CHROME)}</linearGradient>
    <linearGradient id="${id}G" gradientUnits="userSpaceOnUse" x1="-60" y1="-60" x2="60" y2="60">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}R" gradientUnits="userSpaceOnUse" x1="-55" y1="-55" x2="55" y2="55">
      ${stops([[0, '#ffffff', 1], [.45, glass ? '#d8efff' : '#b9c8e6', .8], [.7, '#8fc4ff', .95], [1, '#ffffff', 1]])}</linearGradient>
    ${[0, 1, 2].map(k => `<linearGradient id="${id}E${k}" gradientUnits="userSpaceOnUse" x1="${-60}" y1="0" x2="60" y2="0" gradientTransform="rotate(${o.edgeAngle || 0})">
      ${stops(glass
        ? [[0, '#bfe4ff', [.55, .22, .16][k]], [.5, '#2f8ef8', [.42, .16, .12][k]], [1, '#7cc0ff', [.55, .22, .16][k]]]
        : (o.edge || [[0, '#5aa6ff'], [.22, '#20345a'], [.5, '#0b0f1a'], [.78, '#2a1636'], [1, '#c45ad2']])
            .map(([of, c]) => [of, shade(c, [1, .62, .38][k])]))}</linearGradient>`).join('')}
    <filter id="${id}S" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="${glass ? 2.6 : 2.0}" result="b"/>
      <feSpecularLighting in="b" surfaceScale="${glass ? 4 : 6}" specularConstant="${glass ? .9 : 1.25}" specularExponent="${glass ? 18 : 26}"
        lighting-color="#ffffff" result="sp"><fePointLight x="-40" y="-60" z="60"/></feSpecularLighting>
      <feComposite in="sp" in2="SourceAlpha" operator="in" result="sp2"/>
      <feComposite in="SourceGraphic" in2="sp2" operator="arithmetic" k1="0" k2="1" k3="${glass ? .75 : 1}" k4="0"/>
    </filter>`);
  const root = el(parent, 'div', 'abs', { left: '0px', top: '0px', width: S + 'px', height: S + 'px', transformStyle: 'preserve-3d', transformOrigin: '50% 50%' });
  const layers = [];
  for (let i = N - 1; i >= 0; i--) {
    const z = D / 2 - (i + 1) * dz, k = i < 2 ? 0 : (i < N * .55 ? 1 : 2);
    const fill = i < 2 ? `url(#${id}R)` : `url(#${id}E${k})`;
    const s = svgEl(root, VB, S, S, { transform: `translateZ(${z.toFixed(2)}px)` }, `<path d="${xD(0)}" fill="${fill}"/>`);
    layers.push(s);
  }
  const face = svgEl(root, VB, S, S, { transform: `translateZ(${(D / 2 + .4).toFixed(2)}px)` }, `
    <g filter="url(#${id}S)"><path d="${xD(0)}" fill="url(#${id}A)"/><path d="${xD(bev)}" fill="url(#${id}B)"/></g>
    <path d="${xD(bev)}" fill="url(#${id}G)"/>
    <path d="${xD(bev)}" fill="none" stroke="${glass ? 'rgba(255,255,255,.55)' : 'rgba(6,10,22,.55)'}" stroke-width=".5"/>
    <path d="${xD(.35)}" fill="none" stroke="url(#${id}R)" stroke-width=".8"/>`);
  const gA = document.getElementById(id + 'A'), gB = document.getElementById(id + 'B'), gG = document.getElementById(id + 'G');
  const light = DEFS.querySelector(`#${id}S fePointLight`);
  const setGrad = (g, ang, shift) => { const r = ang * Math.PI / 180, c = Math.cos(r) * 62, s = Math.sin(r) * 62, px = -Math.sin(r) * shift, py = Math.cos(r) * shift;
    g.setAttribute('x1', (-c + px).toFixed(2)); g.setAttribute('y1', (-s + py).toFixed(2)); g.setAttribute('x2', (c + px).toFixed(2)); g.setAttribute('y2', (s + py).toFixed(2)); };
  const api = { root, face, layers, S,
    /* refl: rotação do ambiente refletido (graus); glint ∈ [-0.3,1.3] posição do brilho em faixa; lx,ly: luz especular */
    set({ x, y, rx = 0, ry = 0, rz = 0, sc = 1, refl = 0, glint = null, lx = -40, ly = -60, op = 1 }) {
      root.style.left = (x - S / 2) + 'px'; root.style.top = (y - S / 2) + 'px';
      root.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale3d(${sc},${sc},${sc})`;
      root.style.opacity = op;
      setGrad(gA, 58 + refl, refl * .25); setGrad(gB, 58 + 180 + refl * 1.3, -refl * .2);
      light.setAttribute('x', lx); light.setAttribute('y', ly);
      const st = gG.children;
      if (glint == null) { for (const s of st) s.setAttribute('stop-opacity', 0); }
      else { setGrad(gG, 30, 0); const g = glint;
        st[0].setAttribute('offset', clamp(g - .09)); st[1].setAttribute('offset', clamp(g - .015)); st[1].setAttribute('stop-opacity', .0);
        st[1].setAttribute('offset', clamp(g - .012)); st[1].setAttribute('stop-opacity', .85);
        st[2].setAttribute('offset', clamp(g + .012)); st[2].setAttribute('stop-opacity', .85); st[3].setAttribute('offset', clamp(g + .09)); }
    } };
  return api;
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(clamp(v * k, 0, 255)).toString(16).padStart(2, '0'); return '#' + f(r) + f(g) + f(b); }
function mixHex(a, b, k) { const A = parseInt(a.slice(1), 16), Bn = parseInt(b.slice(1), 16);
  const ch = s => [(s >> 16) & 255, (s >> 8) & 255, s & 255]; const x = ch(A), y = ch(Bn);
  return 'rgb(' + x.map((v, i) => Math.round(lerp(v, y[i], k))).join(',') + ')'; }

/* ═════════════ Montagem ═════════════ */
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const scene = (bg) => el(stage, 'div', 'ly', { background: bg || 'none', display: 'none' });

/* — S1: escuro, luz azul lateral — */
const S1 = scene('#020308');
el(S1, 'div', 'ly', { background: `radial-gradient(ellipse 55% 90% at -6% 48%, rgba(3,122,244,.75) 0%, rgba(3,90,200,.28) 38%, rgba(0,0,0,0) 70%)` });
const s1Rim = el(S1, 'div', 'ly', { background: `radial-gradient(ellipse 40% 70% at 108% 40%, rgba(248,51,248,.28) 0%, rgba(0,0,0,0) 65%)` });
const s1Glow = el(S1, 'div', 'abs', { left: (cx - 360 * U) + 'px', top: (cy - 360 * U) + 'px', width: 720 * U + 'px', height: 720 * U + 'px',
  background: 'radial-gradient(circle, rgba(60,150,255,.45) 0%, rgba(3,122,244,.12) 40%, rgba(0,0,0,0) 70%)' });
const s1Cam = el(S1, 'div', 'ly', { perspective: 1500 * U + 'px', overflow: 'visible' });
const X1 = sym3D(s1Cam, { size: LY.s1 * U, layers: 34, depth: .2 });

/* — S2: claro, grade em perspectiva, ✕ de vidro — */
const S2 = scene('linear-gradient(#ffffff 0%, #f6f8fe 45%, #eef2fc 100%)');
const s2Floor = el(S2, 'div', 'ly', { perspective: 900 * U + 'px', perspectiveOrigin: '50% 30%' });
const GRID = 150 * U;
const floor = el(s2Floor, 'div', 'abs', { left: (-1.5 * W) + 'px', top: (H * .52) + 'px', width: 4 * W + 'px', height: 3 * H + 'px',
  transformOrigin: '50% 0', transform: 'rotateX(76deg)',
  backgroundImage: `linear-gradient(90deg, rgba(160,150,235,.55) ${2.4 * U}px, transparent ${2.4 * U}px), linear-gradient(0deg, rgba(160,150,235,.55) ${2.4 * U}px, transparent ${2.4 * U}px)`,
  backgroundSize: `${GRID}px ${GRID}px` });
el(S2, 'div', 'abs', { left: 0, top: 0, width: W + 'px', height: H * .52 + 'px',
  backgroundImage: `linear-gradient(90deg, rgba(170,160,235,.30) ${1.6 * U}px, transparent ${1.6 * U}px), linear-gradient(0deg, rgba(170,160,235,.22) ${1.6 * U}px, transparent ${1.6 * U}px)`,
  backgroundSize: `${GRID * .9}px ${GRID * .9}px`, maskImage: 'linear-gradient(to bottom, transparent 0%, #000 70%, transparent 100%)', webkitMaskImage: 'linear-gradient(to bottom, transparent 0%, #000 70%, transparent 100%)' });
el(S2, 'div', 'ly', { background: `linear-gradient(to bottom, rgba(255,255,255,0) 40%, rgba(255,255,255,.9) 52%, rgba(255,255,255,0) 62%)` });
el(S2, 'div', 'ly', { background: `radial-gradient(ellipse 70% 40% at 50% 100%, rgba(248,51,248,.07), rgba(0,0,0,0) 70%), radial-gradient(ellipse 50% 50% at 0% 50%, rgba(3,122,244,.08), rgba(0,0,0,0) 70%)` });
const s2Shadow = el(S2, 'div', 'abs', { width: LY.s2 * 1.3 * U + 'px', height: LY.s2 * .22 * U + 'px', borderRadius: '50%',
  background: 'radial-gradient(ellipse, rgba(3,122,244,.32), rgba(3,122,244,0) 70%)', filter: `blur(${10 * U}px)` });
const s2Cam = el(S2, 'div', 'ly', { perspective: 1300 * U + 'px', overflow: 'visible' });
const X2 = sym3D(s2Cam, { size: LY.s2 * U, kind: 'glass', layers: 30, depth: .16, bevel: 6 });

/* ═════════════ S3 — cena vetorial (edição do nome) ═════════════ */
const S3 = scene('#05060b');
el(S3, 'div', 'ly', { background: 'radial-gradient(ellipse 60% 80% at 10% 20%, rgba(3,122,244,.20), rgba(0,0,0,0) 65%), radial-gradient(ellipse 50% 60% at 95% 90%, rgba(248,51,248,.09), rgba(0,0,0,0) 65%)' });
// grade de prancheta (pixel grid discreta) — dá escala ao zoom
const artGrid = el(S3, 'div', 'ly', {});
const s3Root = el(S3, 'div', 'ly', { perspective: 1700 * U + 'px' });
const ov = svgEl(S3, `0 0 ${W} ${H}`, W, H, {});          // interface em espaço de tela (espessura constante)

// geometria da palavra (unidades de palavra = px a 1000 px de corpo, comprimido 0.8 × 1.16)
const GL = window.GLIFOS, FS = 1000, SCF = FS / GL.upm, SX = .8 * SCF, SY = 1.16 * SCF;
const CAP = 760 * SY, PAD = 160, BASE = PAD + CAP;
const LET = []; { let xx = PAD; for (const ch of 'JESUS') { const g = GL.g[ch]; LET.push({ ch, x0: xx, g }); xx += g.adv * SX - .01 * FS * .8; } var WW = xx + PAD; }
const WH = BASE + 60 * SY + PAD;
LET.forEach(L => { L.cont = L.g.contours.map(c => c.map(s => ({ t: s.t, p: s.p.map(p => [L.x0 + p[0] * SX, BASE - p[1] * SY]) }))); });
const fmt = p => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
const contD = (c, f = (p => p)) => 'M' + fmt(f(c[0].p[0])) + c.map(s => s.t === 'L' ? 'L' + fmt(f(s.p[1])) : 'C' + fmt(f(s.p[1])) + ' ' + fmt(f(s.p[2])) + ' ' + fmt(f(s.p[3]))).join('') + 'Z';
const cub = (s, u) => { if (s.t === 'L') return [lerp(s.p[0][0], s.p[1][0], u), lerp(s.p[0][1], s.p[1][1], u)];
  const [a, b, c, d] = s.p, v = 1 - u; return [v * v * v * a[0] + 3 * v * v * u * b[0] + 3 * v * u * u * c[0] + u * u * u * d[0], v * v * v * a[1] + 3 * v * v * u * b[1] + 3 * v * u * u * c[1] + u * u * u * d[1]]; };
function bbox(conts) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const c of conts) for (const s of c) for (let i = 0; i <= 12; i++) { const p = cub(s, i / 12); x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 }; }
const rotP = (p, o, a) => { const c = Math.cos(a), s = Math.sin(a), dx = p[0] - o[0], dy = p[1] - o[1]; return [o[0] + dx * c - dy * s, o[1] + dx * s + dy * c]; };
const BB = LET.map(L => bbox(L.cont));

// ── estados de edição (todos terminam na geometria aprovada) ──
const E_OFF0 = [230, -170];

        o += `<g opacity="${gOp.toFixed(3)}"><path d="M${A[0] + r * Math.cos(a0)} ${A[1] + r * Math.sin(a0)} A${r} ${r} 0 0 1 ${A[0] + r * Math.cos(a1)} ${A[1] + r * Math.sin(a1)}" fill="none" stroke="${C_MAG}" stroke-width="${(2 * US).toFixed(2)}"/>`
          + tag(cpt[0] + 26 * US, cpt[1] + 46 * US, `∠ ${(morphTh(t) * 180 / Math.PI).toFixed(1)}°`) + '</g>'; } }

  // kerning U–S
  if (t >= T(24) && t < T(28)) {
    const g = geom(4, t), sel = t >= T(24.5);
    if (sel) { o += `<path d="${g.map(c => contD(c, proj)).join('')}" fill="none" stroke="${C_BLUE}" stroke-width="${(sw0 * 1.3).toFixed(2)}"/>`;
      for (const c of g) for (const s of c) o += sq(proj(s.p[0]), { fill: C_BLUE, stroke: '#cfe6ff', sc: .8 }); }
    const xu = proj([BB[3].x1, 0])[0], xs = proj([BB[4].x0 + kernVal(t) * .8, 0])[0], ym = proj([0, BASE - CAP * .5])[1];
    const kOp = sel ? 1 - P(t, T(27), BEAT * .5) : 0;
    if (kOp > .01) { const ah = 10 * US;
      o += `<g opacity="${kOp.toFixed(3)}" stroke="${C_MAG}" fill="${C_MAG}" stroke-width="${(2 * US).toFixed(2)}"><line x1="${xu + ah}" y1="${ym}" x2="${xs - ah}" y2="${ym}"/>`
        + `<path d="M${xu} ${ym} l${ah * 1.4} ${-ah * .8} v${ah * 1.6}Z"/><path d="M${xs} ${ym} l${-ah * 1.4} ${-ah * .8} v${ah * 1.6}Z"/>`
        + `<line x1="${xu}" y1="${ym - 40 * US}" x2="${xu}" y2="${ym + 40 * US}" stroke-dasharray="${4 * US} ${4 * US}"/><line x1="${xs}" y1="${ym - 40 * US}" x2="${xs}" y2="${ym + 40 * US}" stroke-dasharray="${4 * US} ${4 * US}"/></g>`;
      let kp = 0; for (const b of KB) { const d = t - T(b); if (d >= 0 && d < .2) kp = Math.max(kp, 1 - d / .2); }
      o += `<g opacity="${kOp.toFixed(3)}">${tag((xu + xs) / 2 - 70 * US, ym + 52 * US, `KERNING ${Math.round(kernVal(t)) > 0 ? '+' : ''}${Math.round(kernVal(t))}`, { bg: kp > .05 ? '#ffffff' : C_MAG, fg: kp > .05 ? C_MAG : '#fff', fz: 16 })}</g>`; }
  }
  // flash de contorno no preenchimento de cada letra
  FILLB.forEach((b, i) => { const f = (t - CUT(b)) * FPS; if (f >= 0 && f < 3) { const g = i === 0 ? LET[0].cont : geom(i, t);
    o += `<path d="${g.map(c => contD(c, proj)).join('')}" fill="none" stroke="#fff" stroke-opacity="${(1 - f / 3).toFixed(2)}" stroke-width="${(sw0 * 2.4).toFixed(2)}"/>`; } });
  // ripples de clique e de impacto (acentos)
  for (const k of CLICKS) { const d = t - k.t; if (d >= 0 && d < .38) { const p = k.f(t), e = eo(d / .38);
    o += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(6 + 40 * e) * US}" fill="none" stroke="#ffffff" stroke-opacity="${(1 - e).toFixed(3)}" stroke-width="${(2.4 * US).toFixed(2)}"/>`; } }
  for (const x of IMPACTOS) { const d = t - x; if (x > T(8) && x < T(28) && d >= 0 && d < .45) { const c = cursorAt(x + .001); if (!c) continue; const e = eo(d / .45), p = cursorAt(t)?.pt || c.pt;
    o += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(10 + 70 * e) * US}" fill="none" stroke="${C_MAG}" stroke-opacity="${(.8 * (1 - e)).toFixed(3)}" stroke-width="${(2 * US).toFixed(2)}"/>`; } }
  return o;
}

/* S4 — DROP: ✕ + ANDRÉ × CASTRO → recolhe por palavra (b34, b34.5, b35) → ✕ gira/encolhe (b35.5→b36) → grade */
let lockW = null;
function s4(t) {
  const tl = t - T(32);
  if (!lockW) lockW = lockG.map(c => c.getBoundingClientRect().width);
  const mk = lk.mark * U, gap = lk.gap * U;
  const imp = 1 - eo(P(tl, 0, .35)), sh = Math.max(0, 1 - tl * FPS / 6);
  const shx = 6 * U * sh * Math.sin(tl * 97), shy = 4 * U * sh * Math.cos(tl * 83);
  const textW = lockW.reduce((a, b) => a + b, 0);
  let off = 0, gulp = 0;
  LOCKB.forEach((b, i) => { const d = lockW[i] + (i === 0 ? gap : 0); off += d * eio(PB(t, b, b + .5));
    const a = t - T(b + .5); if (a >= 0 && a < .16) gulp = Math.max(gulp, 1 - a / .16); });
  const allIn = t >= T(35.5) - 1e-3;
  const totalW = mk + gap + textW - Math.min(off, textW + gap);
  const kr = p3io(PB(t, 35.5, 36));
  const mScale = lerp(1, ICON * 1.22 / mk, kr);
  const left = cx - totalW / 2, mx = left + mk / 2, my = cy;
  const ia = impactAmt(t, T(32), T(36), 8);
  const sMark = (1 + .04 * imp) * mScale * (1 + .07 * gulp + .05 * ia);
  const rot = 83 * p3io(PB(t, 35.5, 36));
  const S = lk.mark * U * 1.2;
  lockMark.style.left = (mx - S / 2) + 'px'; lockMark.style.top = (my - S / 2) + 'px';
  lockMark.style.transform = `scale(${sMark.toFixed(4)}) rotate(${rot.toFixed(2)}deg)`;
  lockMark.style.display = t < CUT(36) ? 'block' : 'none';
  lockWrap.style.transform = `translate(${shx.toFixed(2)}px, ${shy.toFixed(2)}px) scale(${1 + .04 * imp})`; lockWrap.style.transformOrigin = `${cx}px ${cy}px`;
  const tl0 = left + mk + gap - off;
  lockText.style.left = tl0.toFixed(2) + 'px';
  // recorte na borda direita do ✕: o texto entra no símbolo sem sobrar resto no vão
  lockText.style.clipPath = `inset(-50% -50% -50% ${(mx + mk * .36 - tl0).toFixed(2)}px)`;
  lockText.style.display = allIn ? 'none' : 'block';
  const g0 = CUT(36);
  gridSvg.style.display = t >= g0 ? 'block' : 'none';
  // variação B (b44–b52): inversão
  const inv = t >= CUT(44) && t < CUT(52);
  S4.style.background = inv ? TOK.branco : TOK.azul; s4Tint.style.opacity = inv ? 0 : 1;
  if (t >= g0) grid(t);
}
function grid(t) {
  const v = t < CUT(44) ? 0 : t < CUT(52) ? 1 : 2;
  const vb = [36, 44, 52][v];
  const punch = 1 + .04 * (1 - eo(P(t, T(vb), .35)));
  let zoom, rot;
  if (v === 0) { zoom = lerp(1.22, .92, p3io(PB(t, 36, 40))); rot = lerp(-7, 0, p3io(PB(t, 36, 40))); }
  else if (v === 1) { zoom = lerp(1.05, .82, p3io(PB(t, 44, 52))); rot = lerp(4, -3, p3io(PB(t, 44, 52))); }
  else { zoom = lerp(1.75, 1.45, p3io(PB(t, 52, 56))); rot = lerp(-5, 0, p3io(PB(t, 52, 56))); }
  gridG.setAttribute('transform', `translate(${cx} ${cy}) rotate(${rot.toFixed(2)}) scale(${(zoom * punch).toFixed(4)})`);
  const ph = 2 * Math.PI * ((t - OFFSET) * BPM / 60) / 4, A = CELL * .16, Bv = CELL * .10;
  const amp = v === 0 ? eo(P(t - T(36), .1, BEAT * 1.5)) : 1;
  const base = v === 1 ? TOK.azul : TOK.branco;
  const ia = impactAmt(t, T(36), T(56), 10);
  for (const ic of icons) {
    const { i, j } = ic;
    const k = v > 0 || ic.ring === 0 ? 1 : eo(P(t - T(36), ic.ring * .028 + (ic.isX ? 0 : .02), .32));
    if (k <= 0) { ic.u.setAttribute('display', 'none'); continue; }
    ic.u.setAttribute('display', 'inline');
    const dx = amp * A * Math.sin(2 * Math.PI * j / 3.4 + ph + i * .55), dy = amp * Bv * Math.sin(2 * Math.PI * i / 2.2 + ph * 1.3 + j * .35);
    let pulse = 0, pb = 36;
    for (let b = 36; b < 56; b++) { const tb = t - T(b); if (tb < 0) break; const front = tb * 9; const d = ic.dist - front;
      const a = (b % 4 === 0 ? 1 : .65) * Math.exp(-d * d / .7) * Math.exp(-tb * 2.2); if (a > pulse) { pulse = a; pb = b; } }
    const s = (ICON / 100) * k * (1 + .22 * pulse + .06 * ia) * (ic.isX ? 1 : .95);
    const r = (ic.isX ? 90 * (1 - k) : 0) + 12 * amp * Math.sin(ph + i * .7 - j * .4);
    ic.u.setAttribute('transform', `translate(${(i * CELL + dx).toFixed(1)} ${(j * CELL + dy).toFixed(1)}) rotate(${r.toFixed(1)}) scale(${s.toFixed(4)})`);
    const pc = v === 0 ? TOK.amarelo : v === 1 ? TOK.magenta : (pb % 2 ? TOK.amarelo : TOK.magenta);
    const col = pulse > .25 ? mixHex(base === TOK.azul ? '#037AF4' : '#F9F9F9', pc, clamp((pulse - .25) * 2)) : base;

}
/* S6 — wipe ✕ branco (b56 → b57) */
function s6(t) {
  const k = PB(t, 56, 57), e = p2i(k);

  wpG.setAttribute('transform', `translate(${cx} ${cy}) rotate(${lerp(-38, 0, eo(k)).toFixed(2)}) scale(${lerp(.9 * U, sMax, e).toFixed(4)})`);
}
/* S7 — estúdio (corte seco b57) → clímax b60 */
function s7(t) {
  const k = eo(P(t, T(57), .9)), drift = sio(PB(t, 57, 60));
  const km = p3io(PB(t, 60, 61));                         // ✕ chega na posição final exatamente em b61
  const ia = impactAmt(t, T(57), DURATION, 6);
  const x = lerp(F.x, F.x2, km), y = lerp(F.y, F.y2, km), sc = lerp(1.22, 1, k) * lerp(1, F.sc2, km);
  const ry = lerp(34, 0, k) + lerp(0, -10, drift) + lerp(0, 10, km) + 6 * sio(PB(t, 61, 65));
  const st = { x, y, rx: lerp(12, 3, k), ry, sc, refl: lerp(-60, 10, k) + 20 * drift + 25 * km, lx: lerp(-60, 20, k) + 50 * ia, ly: -95,
    glint: t < T(60) ? lerp(-.25, 1.25, p2io(PB(t, 58, 59))) : lerp(-.25, 1.25, p2io(PB(t, 64, 65))) };
  s7Cam.style.perspectiveOrigin = `${x}px ${y}px`;
  X7.set(st); X7r.set(Object.assign({}, st, { glint: null }));
  X7.root.style.filter = ia > .02 ? `brightness(${(1 + .3 * ia).toFixed(3)})` : 'none';
  reflWrap.style.opacity = (.26 * (1 - km)).toFixed(3); floorLine.style.opacity = floorEl.style.opacity = (1 - .7 * km).toFixed(3);
  soft.style.opacity = (.55 + .45 * k).toFixed(3);
  soft.style.transform = `translate(${(x - F.x).toFixed(1)}px, ${(y - F.y).toFixed(1)}px)`;
  const kt = p3o(PB(t, 60, 60.5));
  title.style.transform = `${tAlign === 'center' ? 'translateX(-50%) ' : ''}translateY(${((1 - kt) * tt.size * U * 1.3).toFixed(1)}px) scale(.8,1.16)`;
  titleClip.style.display = t >= CUT(60) ? 'block' : 'none';
  const kr = p2io(PB(t, 60.5, 61));
  remix.inner.style.clipPath = `inset(0 ${((1 - kr) * 100).toFixed(1)}% 0 0)`;
  remix.wrap.style.opacity = kr > 0 ? 1 : 0;
  odo.wrap.style.opacity = t >= T(60) ? 1 : 0;
  digIdx.forEach((ci, n) => { const b1 = DIGB[n], dur = T(b1) - T(60);
    const u = P(t, T(60), dur), kk = 1 - Math.pow(1 - u, 3);
    const vel = 3 * Math.pow(1 - u, 2) / Math.max(dur, .01) * odo.cols[ci].steps;   // dígitos/s
    odo.setCol(ci, kk, u > 0 && u < 1 ? Math.min(14, vel * .25) * U : 0); });
}

window.SYNC = SYNC;
window.seek = t => render(t);
window.ready = (async () => {
  await JR.fontsReady();
  await document.fonts.load(`700 40px "Dela Gothic One"`, '0123456789.');
  render(T(24)); render(T(33)); render(0);
})();
if (!FMT.q.get('render')) window.ready.then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); });
})();
</script>
