name: SKYLINE 40

# Verifica o projeto da maquete 3D (pasta skyline-40/) sem interferir na publicação do site principal.
on:
  push:
    paths: ['skyline-40/**', '.github/workflows/skyline-40.yml']
  pull_request:
    paths: ['skyline-40/**', '.github/workflows/skyline-40.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyline-40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skyline-40/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: skyline-40-dist
          path: skyline-40/dist
