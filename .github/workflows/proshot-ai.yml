name: ProShot AI (iOS)

on:
  push:
    paths: ["ProShotAI/**", ".github/workflows/proshot-ai.yml"]
  pull_request:
    paths: ["ProShotAI/**", ".github/workflows/proshot-ai.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ProShotAI
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for iPhone (device, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild -project ProShotAI.xcodeproj -scheme ProShotAI -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ " | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "Simulator: $SIM"
          xcodebuild -project ProShotAI.xcodeproj -scheme ProShotAI \
            -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log \
            | grep -E "error:|Test Case.*(passed|failed)|TEST (SUCCEEDED|FAILED)|XCTAssert" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proshot-logs
          path: ProShotAI/*.log
