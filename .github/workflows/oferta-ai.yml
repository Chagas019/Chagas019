name: OFERTA AI — CI
on:
  push:
    paths: ["oferta-ai/**", ".github/workflows/oferta-ai.yml"]
  pull_request:
    paths: ["oferta-ai/**", ".github/workflows/oferta-ai.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oferta-ai
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: oferta, POSTGRES_PASSWORD: oferta, POSTGRES_DB: oferta_ai_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U oferta" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: oferta-ai/package-lock.json }
      - run: npm ci
      - run: cd apps/api && npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
