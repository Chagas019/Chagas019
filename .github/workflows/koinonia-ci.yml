name: KOINONIA CI

on:
  pull_request:
    paths: ["koinonia/**", ".github/workflows/koinonia-ci.yml"]
  push:
    branches: [main]
    paths: ["koinonia/**", ".github/workflows/koinonia-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koinonia-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: koinonia

jobs:
  qualidade:
    name: Lint, tipos, testes, banco e build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: koinonia/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations + RLS (PostgreSQL 16 local)
        run: npm run test:db
      - run: npm run build
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (desktop, tablet, mobile + axe)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: koinonia/test-results
          retention-days: 7
