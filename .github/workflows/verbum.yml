name: VERBUM — testes

on:
  push:
    paths: ['verbum/**', '.github/workflows/verbum.yml']
  pull_request:
    paths: ['verbum/**', '.github/workflows/verbum.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verbum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verbum/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Testes de ponta a ponta
        run: |
          npx playwright install --with-deps chromium
          (npm start -- -p 3000 &) && npx wait-on -t 60000 http://localhost:3000/api/status
          BASE_URL=http://localhost:3000 npm run test:e2e

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migração, seed e testes de RLS
        env: { PGPASSWORD: postgres }
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P -f verbum/supabase/tests/auth-stub.sql
          $P -f verbum/supabase/migrations/20261126000000_verbum_init.sql
          $P -f verbum/supabase/seed.sql
          $P -f verbum/supabase/tests/rls.sql
