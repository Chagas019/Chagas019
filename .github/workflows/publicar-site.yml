name: Publicar site

# Publicação no GitHub Pages desativada por enquanto: o site é testado pelo link do Claude.
# Para publicar aqui, ative Settings → Pages → GitHub Actions e rode este workflow manualmente.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar arquivos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verificar-site.sh

  publicar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Montar pasta do site (sem .claude/ e scripts/)
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site/fotos
          bash scripts/montar-site.sh _site
          cp -r icones social _site/
          find fotos -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -exec cp {} _site/fotos/ \;
          touch _site/.nojekyll
          echo "Arquivos publicados:" && find _site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  conferir:
    name: Conferir no ar
    needs: publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/conferir-publicacao.sh "${{ needs.publicar.outputs.url }}"
