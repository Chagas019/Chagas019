version: 2
updates:
  # Atualizações de segurança e versões das bibliotecas do MídiaFlow
  - package-ecosystem: npm
    directory: /midiaflow
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
