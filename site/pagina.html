<title>Pascom</title>
<meta name="description" content="Pastoral da Comunicação: liturgia do dia, agenda da paróquia, frase do dia e os santos padroeiros da comunicação, como São Carlo Acutis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: painel branco flutuando sobre um céu de entardecer; grade tipo "streaming":
     barra lateral | destaque (2 col) | explorar  /  missa | santo para você | frase do dia */
  :root {
    color-scheme: light;
    --sky-1: #0d4a5a;
    --sky-2: #2b6f78;
    --sand: #a8643a;
    --sand-2: #5a2f17;
    --panel: #ffffff;
    --soft: #efefef;
    --ink: #121212;
    --ink-2: #1c1c1e;
    --muted: #6d6d72;
    --on-dark: #ffffff;
    --on-dark-muted: rgba(255, 255, 255, 0.7);
    --red: #c8102e;
    --red-deep: #5e0614;
    --glass: rgba(255, 255, 255, 0.16);
    --glass-line: rgba(255, 255, 255, 0.35);
    --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
    --font-body: "Urbanist", "Segoe UI", system-ui, sans-serif;
    --r-xl: 28px;
    --r-lg: 22px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  * { box-sizing: border-box; }
  html { background: var(--sand-2); }
  body { min-height: 100vh; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    background:
      radial-gradient(120% 60% at 50% 100%, var(--sand-2), transparent 70%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 34%, #6f8a86 46%, var(--sand) 60%, var(--sand-2) 100%);
    padding-block: 40px 32px;
    padding-inline: 16px;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Frame ---------- */
  .frame {
    max-width: 1180px; margin-inline: auto;
    padding: 10px;
    border-radius: 38px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(10px);
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.55);
  }
  .app {
    background: var(--panel);
    border-radius: var(--r-xl);
    padding: 12px;
    display: grid;
    grid-template-columns: 64px 1.15fr 1fr 0.85fr;
    grid-template-rows: minmax(340px, auto) minmax(280px, auto) auto;
    grid-template-areas:
      "side hero hero browse"
      "side cont pick play"
      "side litu agen fras";
    gap: 12px;
  }

  /* ---------- Ícones 3D ---------- */
  .i3d { display: inline-grid; place-items: center; flex-shrink: 0; width: var(--s, 56px); height: var(--s, 56px); border-radius: calc(var(--s, 56px) * .28); background: #101010; overflow: hidden; }
  .i3d img { width: 112%; height: 112%; object-fit: cover; display: block; }

  /* ---------- Faixa da equipe (liturgia, agenda, frases) ---------- */
  .litu { grid-area: litu; background: var(--soft); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .agen { grid-area: agen; }
  .fras { grid-area: fras; }
  .panel-dark { background: var(--ink-2); color: var(--on-dark); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .p-head { display: flex; align-items: center; gap: 12px; }
  .p-head h2 { font-size: 17px; font-weight: 500; margin: 0; }
  .p-head .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .panel-dark .p-head .sub { color: var(--on-dark-muted); }
  .p-head .add { margin-left: auto; }
  .add {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
    background: var(--red); color: #fff; transition: transform .2s var(--ease), box-shadow .2s;
  }
  .add:hover { transform: rotate(90deg); box-shadow: 0 6px 18px -6px var(--red); }
  .add[hidden] { display: none; }
  .season { display: flex; flex-wrap: wrap; gap: 6px; }
  .season span { font-size: 12px; padding: 6px 10px; border-radius: 999px; background: #fff; display: inline-flex; align-items: center; gap: 6px; }
  .season .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
  .readings { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .readings li { display: grid; grid-template-columns: 124px 1fr; gap: 10px; font-size: 13px; padding: 8px 10px; background: #fff; border-radius: 10px; }
  .readings li b { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; align-self: center; }
  .readings li span { min-width: 0; overflow-wrap: anywhere; }
  .p-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .btn-sm { min-height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .btn-sm.dark { background: var(--ink); color: #fff; }
  .btn-sm.light { background: #fff; color: var(--ink); }
  .btn-sm.ghost { border: 1px solid #cfcfcf; }
  .panel-dark .btn-sm.ghost { border-color: rgba(255,255,255,.25); color: #fff; }
  .ev-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .ev { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: rgba(255,255,255,.05); min-width: 0; }
  .ev .when { text-align: center; min-width: 44px; font-variant-numeric: tabular-nums; }
  .ev .when b { display: block; font-size: 18px; font-weight: 600; line-height: 1; }
  .ev .when small { font-size: 10px; text-transform: uppercase; color: #ff8a9b; letter-spacing: .1em; }
  .ev .what { min-width: 0; flex: 1; }
  .ev .what b { display: block; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .what small { color: var(--on-dark-muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-state { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.05); font-size: 13px; color: var(--on-dark-muted); }
  .litu .empty-state { background: #fff; color: var(--muted); }
  .team-q { margin: 0; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.05); font-size: 14px; line-height: 1.45; }
  .team-q cite { display: block; font-style: normal; font-size: 12px; color: var(--on-dark-muted); margin-top: 6px; }
  .team-q .today { display: inline-block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--red); padding: 3px 8px; border-radius: 999px; margin-bottom: 6px; }
  .mode { font-size: 11px; color: var(--on-dark-muted); }
  .litu .mode { color: var(--muted); }

  /* listas em modais */
  .m-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .m-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: var(--soft); min-width: 0; }
  .m-item .what { flex: 1; min-width: 0; }
  .m-item .what b { display: block; font-weight: 600; }
  .m-item .what p, .m-item .what small { margin: 2px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .del { min-height: 36px; padding: 0 10px 0 4px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .del:hover { background: #e2e2e2; color: var(--ink); }
  .del.confirm { background: var(--red); color: #fff; padding: 0 12px; }
  .field textarea { min-height: 90px; border-radius: 12px; border: 1px solid #d6d6d6; padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical; color: var(--ink); background: #fff; }
  .field textarea:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(200, 16, 46, .15); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .area-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; border: 0; padding: 0; margin: 0; }
  .area-pick label { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 12px; border: 1px solid #dadada; cursor: pointer; font-size: 13px; }
  .area-pick input { position: absolute; opacity: 0; pointer-events: none; }
  .area-pick label:has(input:checked) { border-color: var(--red); background: rgba(200,16,46,.06); }
  .area-pick label:has(input:focus-visible) { outline: 2px solid var(--red); outline-offset: 2px; }
  .ext-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .ext-links a { font-size: 13px; color: var(--ink); background: var(--soft); padding: 8px 12px; border-radius: 999px; text-decoration: none; }
  .ext-links a:hover { background: #e4e4e4; }
  .read-block h4 { margin: 0 0 4px; font-size: 13px; color: var(--red); }
  .read-block p { white-space: pre-wrap; }
  .import { display: grid; gap: 10px; padding: 14px; border-radius: 16px; background: var(--soft); }
  .import h3 { margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
  .import ol { margin: 0; padding-left: 18px; font-size: 13px; color: #444; display: grid; gap: 2px; }
  .import .row { gap: 8px; flex-wrap: wrap; justify-content: flex-start; }
  .import textarea { min-height: 70px; }
  .import-status { font-size: 13px; margin: 0; color: #444; min-height: 1.2em; }
  .import-status.ok { color: #1f7a4a; }
  .import-status.err { color: var(--red); }
  .src { font-size: 12px; color: var(--muted); }
  .src a { color: inherit; }
  .share { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .share .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .share a, .share button { min-height: 36px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; background: var(--soft); color: var(--ink); }
  .share a:hover, .share button:hover { background: #e2e2e2; }
  .share .wa { background: #1f9d55; color: #fff; }
  .share .wa:hover { background: #188046; }
  .panel-dark .share a, .panel-dark .share button { background: rgba(255,255,255,.1); color: #fff; }
  .panel-dark .share .wa { background: #1f9d55; }
  .panel-dark .share .lbl { color: var(--on-dark-muted); }
  .copy-fallback { width: 100%; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px solid #d6d6d6; }
  .panel-dark .src { color: var(--on-dark-muted); }

  /* ---------- Sidebar ---------- */
  .side {
    grid-area: side;
    background: var(--ink);
    border-radius: 20px;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 0;
    gap: 6px;
    color: var(--on-dark);
  }
  .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--red); display: grid; place-items: center;
    box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.25);
    margin-bottom: 10px;
  }
  .side hr { width: 28px; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.35); margin: 8px 0; }
  .side .lbl { font-size: 9px; letter-spacing: 0.14em; color: var(--on-dark-muted); text-transform: uppercase; margin: 4px 0; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    color: var(--on-dark-muted);
    transition: background .2s, color .2s;
    position: relative;
  }
  .nav-btn:hover { color: var(--on-dark); background: rgba(255, 255, 255, 0.08); }
  .nav-btn[aria-current="true"] { background: rgba(255, 255, 255, 0.14); color: var(--on-dark); }
  .nav-btn .tip {
    position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
    background: var(--ink); color: var(--on-dark); font-size: 12px; white-space: nowrap;
    padding: 6px 10px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s;
    z-index: 5;
  }
  .nav-btn:hover .tip, .nav-btn:focus-visible .tip { opacity: 1; }
  .side .spacer { flex: 1; }
  .avatar[aria-current="true"] { border-color: var(--red); box-shadow: 0 0 0 3px rgba(200, 16, 46, .45); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #f1f1f1, #9a9a9a);
    color: var(--ink); font-weight: 700; font-size: 12px;
    display: grid; place-items: center;
    border: 2px solid rgba(255, 255, 255, 0.6);
  }

  /* ---------- Portrait (foto + retrato estilizado de reserva) ---------- */
  .portrait { position: absolute; inset: 0; overflow: hidden; background: var(--p-bg, #333); }
  .portrait::before {
    content: ""; position: absolute; left: 50%; top: 40%;
    width: 70%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 230, 190, 0.55), rgba(255, 210, 150, 0.12) 45%, transparent 70%);
  }
  .portrait::after {
    content: ""; position: absolute; left: 50%; top: 40%;
    width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; border: 1.5px solid rgba(255, 225, 170, 0.55);
  }
  .portrait .mono {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    font-family: var(--font-display); font-weight: 800; color: rgba(255, 255, 255, 0.9);
    font-size: var(--mono, 64px); letter-spacing: 0.04em; z-index: 1;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
  }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; z-index: 2; }

  /* ---------- Shared card ---------- */
  .tile { position: relative; border-radius: var(--r-lg); overflow: hidden; color: var(--on-dark); background: var(--ink-2); isolation: isolate; }
  .tile .shade { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .tile .content { position: relative; z-index: 4; height: 100%; display: flex; flex-direction: column; padding: 16px 18px; }
  .tile h2 { font-size: 17px; font-weight: 500; margin: 0; }
  .tile .sub { font-size: 12px; color: var(--on-dark-muted); margin-top: 2px; }

  .chip {
    font-size: 11px; padding: 6px 11px; border-radius: 999px;
    background: rgba(0, 0, 0, 0.32); border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px); white-space: nowrap;
  }
  .chip.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3ddc84; margin-right: 6px; vertical-align: 1px; }

  .play-link { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; min-height: 40px; }
  .play-link:hover { opacity: .85; }

  .switch {
    width: 38px; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.3);
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .2s var(--ease);
  }
  .switch[aria-checked="true"] { background: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
  .switch[aria-checked="true"]::after { transform: translateX(16px); }
  .switch-wrap { display: grid; justify-items: end; gap: 3px; font-size: 10px; color: var(--on-dark-muted); }

  /* ---------- Hero ---------- */
  .hero { grid-area: hero; min-height: 340px; }
  .hero .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s var(--ease); }
  .hero .slide.on { opacity: 1; }
  .hero .portrait { --mono: 140px; }
  .hero .portrait .mono { top: 36%; opacity: .35; }
  .hero .shade { background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, transparent 35%, rgba(20,0,4,.55) 70%, rgba(0,0,0,.9) 100%), linear-gradient(90deg, rgba(200,16,46,.35), transparent 60%); }
  .hero-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .hero-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .hero-title { margin: auto 0 0; text-align: center; }
  .hero-title .kicker { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--on-dark-muted); }
  .hero-title h2 {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(30px, 4.6vw, 54px); line-height: 1.02; margin: 6px 0 0;
    letter-spacing: 0.02em; text-wrap: balance;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  }
  .hero-title .rule { width: min(360px, 70%); height: 2px; margin: 10px auto; background: linear-gradient(90deg, transparent, #fff, transparent); }
  .hero-quote { font-size: 14px; color: var(--on-dark-muted); max-width: 46ch; margin: 0 auto; font-style: italic; text-wrap: balance; }
  .hero-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dots button { width: 10px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.4); transition: width .3s var(--ease), background .3s; }
  .dots button[aria-current="true"] { width: 28px; background: #fff; }
  .dots button { position: relative; }
  .dots button::before { content: ""; position: absolute; inset: -10px -3px; }

  /* ---------- Browse ---------- */
  .browse { grid-area: browse; background: var(--soft); border-radius: var(--r-lg); padding: 16px 12px 14px; display: flex; flex-direction: column; }
  .browse h2 { font-size: 17px; font-weight: 500; margin: 0 6px 10px; padding-bottom: 10px; border-bottom: 1px solid #dcdcdc; }
  .cats { display: grid; gap: 4px; flex: 1; align-content: start; }
  .cat {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; border-radius: 999px; text-align: left; width: 100%;
    transition: background .2s, box-shadow .2s;
  }
  .cat:hover { background: rgba(255, 255, 255, 0.6); }
  .cat[aria-pressed="true"] { background: #fff; box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.25); }
  .cat .thumb { position: relative; width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex-shrink: 0; --mono: 13px; }
  .cat .thumb .portrait::after, .cat .thumb .portrait::before { display: none; }
  .cat .thumb .portrait .mono { top: 50%; }
  .cat b { display: block; font-weight: 600; font-size: 13px; }
  .cat small { color: var(--muted); font-size: 11px; }
  .cat svg { margin-left: auto; color: var(--muted); }
  .btn-dark {
    margin-top: 10px; min-height: 40px; border-radius: 999px; background: var(--ink); color: #fff;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    transition: transform .2s var(--ease);
  }
  .btn-dark:hover { transform: translateY(-1px); }

  /* ---------- Continue (missa) ---------- */
  .cont { grid-area: cont; min-height: 280px; background: radial-gradient(80% 70% at 70% 30%, #6b4a2a 0%, #2a1a10 45%, #0e0a08 100%); }
  .cont .candles { position: absolute; inset: 0; z-index: 1; }
  .cont .candles i {
    position: absolute; bottom: 22%; width: 10px; border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, #f6ead2, #c9b48d);
  }
  .cont .candles i::before {
    content: ""; position: absolute; left: 50%; top: -20px; width: 10px; height: 18px; transform: translateX(-50%);
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff6c8, #ffb347 55%, rgba(255, 120, 30, 0) 75%);
    filter: drop-shadow(0 0 12px #ffb347);
    animation: flick 2.4s infinite ease-in-out;
  }
  @keyframes flick { 50% { transform: translateX(-50%) scaleY(1.12) skewX(3deg); } }
  .cont .shade { background: linear-gradient(180deg, rgba(0,0,0,.55), transparent 40%, rgba(0,0,0,.75)); }
  .cont .vert { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-family: var(--font-display); letter-spacing: 0.6em; font-size: 12px; color: rgba(255,255,255,.35); z-index: 4; writing-mode: vertical-rl; }
  .cont .bottom { margin-top: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .time { font-size: 10px; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); margin-top: 8px; position: relative; cursor: pointer; }
  .bar::before { content: ""; position: absolute; inset: -8px 0; }
  .bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #fff; width: 0; }

  /* ---------- Pick ---------- */
  .pick { grid-area: pick; min-height: 280px; background: var(--ink-2); }
  .pick .stage { position: relative; height: 150px; margin: 6px 0 0; }
  .pick .stage .card-img { position: absolute; left: 50%; top: 0; width: 120px; height: 150px; transform: translateX(-50%); border-radius: 16px; overflow: hidden; --mono: 38px; box-shadow: 0 20px 40px -12px rgba(200, 16, 46, 0.6); transition: opacity .25s; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center; color: var(--on-dark-muted); border-radius: 50%; }
  .arrow:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .arrow.prev { left: -6px; } .arrow.next { right: -6px; }
  .pick .info {

/* ---------- Missa ao vivo (progresso) ---------- */
const MASS_TOTAL = 75 * 60;
let massPos = store.get("mass", 41 * 60), massTimer = null;
const fmt = t => `${String(Math.floor(t / 3600)).padStart(1, "0")}:${String(Math.floor(t / 60) % 60).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
function renderMass() {
  const pct = massPos / MASS_TOTAL * 100;
  $("mass-fill").style.width = pct + "%";
  $("mass-bar").setAttribute("aria-valuenow", Math.round(pct));
  $("mass-time").textContent = `${fmt(massPos)} / ${fmt(MASS_TOTAL)} · faltam ${Math.ceil((MASS_TOTAL - massPos) / 60)} min`;
}
function setMassUI(on) {
  $("mass-btn").setAttribute("aria-pressed", on);
  $("mass-lbl").textContent = on ? "Pausar" : massPos >= MASS_TOTAL ? "Assistir de novo" : massPos ? "Retomar" : "Assistir";
  $("mass-ico").innerHTML = on ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M6 4l14 8-14 8z"/>';
}
function stopMass() { clearInterval(massTimer); massTimer = null; store.set("mass", massPos); setMassUI(false); }
$("mass-btn").onclick = () => {
  if (massTimer) return stopMass();
  if (massPos >= MASS_TOTAL) { massPos = 0; renderMass(); }
  massTimer = setInterval(() => {
    massPos = Math.min(MASS_TOTAL, massPos + 1); renderMass();
    if (massPos >= MASS_TOTAL) { stopMass(); toast("A missa terminou"); }
    else if (massPos % 10 === 0) store.set("mass", massPos);
  }, 1000);
  setMassUI(true);
};
function seekMass(e) { const r = $("mass-bar").getBoundingClientRect(); massPos = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * MASS_TOTAL); store.set("mass", massPos); renderMass(); if (!massTimer) setMassUI(false); }
$("mass-bar").addEventListener("click", seekMass);
$("mass-bar").addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { massPos = Math.max(0, Math.min(MASS_TOTAL, massPos + (e.key === "ArrowRight" ? 60 : -60))); renderMass(); if (!massTimer) setMassUI(false); e.preventDefault(); } });

let autoplay = store.get("autoplay", true);
const synth = window.speechSynthesis;
function renderQuote() {
  const { s, f } = QUOTES[qI];
  fill($("play-img"), s);
  $("play-sub").textContent = `${s.curto} · ${qI + 1} de ${QUOTES.length}`;
  $("play-quote").innerHTML = `“${f}”<cite>— ${s.nome}</cite>`;
  $("q-fill").style.width = "0%";
  $("autoplay").setAttribute("aria-checked", autoplay);
}
function setPlayIcon() {
  $("q-ico").innerHTML = qPlaying ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>';
  $("q-play").setAttribute("aria-label", qPlaying ? "Pausar" : "Ouvir frase");
}
function stopQuote() { qPlaying = false; clearInterval(qTimer); try { synth && synth.cancel(); } catch {} setPlayIcon(); }
function playQuote() {
  stopQuote();
  const { s, f } = QUOTES[qI];
  qPlaying = true; setPlayIcon();
  qDur = Math.max(4000, f.length * 85); qStart = performance.now();
  try {
    if (synth) { const u = new SpeechSynthesisUtterance(`${f}. ${s.nome}.`); u.lang = "pt-BR"; u.rate = 0.95; synth.speak(u); }
  } catch {}
  qTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - qStart) / qDur);
    $("q-fill").style.width = p * 100 + "%";
    if (p >= 1) { stopQuote(); if (autoplay) { qI = (qI + 1) % QUOTES.length; renderQuote(); setTimeout(playQuote, 600); } }
  }, 100);
}
$("q-play").onclick = () => qPlaying ? stopQuote() : playQuote();
$("q-next").onclick = () => { const was = qPlaying; stopQuote(); qI = (qI + 1) % QUOTES.length; renderQuote(); if (was) playQuote(); };
$("q-prev").onclick = () => { const was = qPlaying; stopQuote(); qI = (qI - 1 + QUOTES.length) % QUOTES.length; renderQuote(); if (was) playQuote(); };
$("q-cc").onclick = e => { const on = $("play-quote").hidden; $("play-quote").hidden = !on; e.currentTarget.setAttribute("aria-pressed", on); };

const slug = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const CLAUDE_URL = "https://claude.ai/artifact/UchkS7oWPJt5ATvTpoVzKn";
const canonical = document.querySelector('link[rel="canonical"]');
const BASE_URL = canonical ? canonical.href.replace(/#.*$/, "")
  : (/^https?:$/.test(location.protocol) && !/claude(usercontent)?\.(ai|com)$/.test(location.hostname) ? location.origin + location.pathname : CLAUDE_URL);
const linkTo = hash => BASE_URL + (hash ? "#" + hash : "");
function shareRow(texto, hash) {
  const url = linkTo(hash), enc = encodeURIComponent;
  return `<div class="share"><span class="lbl">Compartilhar</span>
    <a class="wa" href="https://wa.me/?text=${enc(texto + "\n" + url)}" target="_blank" rel="noopener">WhatsApp</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}" target="_blank" rel="noopener">Facebook</a>
    <button type="button" data-copy="${esc(url)}">Copiar link</button></div>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const url = b.dataset.copy;
  try { await navigator.clipboard.writeText(url); toast(/^https?:/.test(url) ? "Link copiado" : "Mensagem copiada"); }
  catch {
    if (b.nextElementSibling?.classList.contains("copy-fallback")) return;
    const i = document.createElement("input"); i.className = "copy-fallback"; i.readOnly = true; i.value = url;
    b.after(i); i.focus(); i.select(); toast("Selecione e copie o link");
  }
});

const fonteHTML = k => { const f = FONTES[k]; if (!f || k === "outra") return ""; return `Fonte: <a href="${f.url}" target="_blank" rel="noopener">${f.nome}</a>`; };

async function runImport(kind, onFill) {

  st.className = "import-status";
  if (src.length < 40) { st.className = "import-status err"; st.textContent = "Cole o texto da página antes de preencher."; return; }
  const prompt = kind === "lit"
    ? `Abaixo está o texto copiado de uma página de liturgia diária católica, em português. Extraia somente as referências bíblicas e o refrão do salmo, copiando os caracteres EXATAMENTE como aparecem no texto. Não invente nem complete nada: use "" quando a informação não estiver no texto. Responda só com JSON neste formato:
{"data":"sexta-feira, 9 de outubro de 2026","primeira":"Gl 3,7-14","salmo":"Sl 110(111),1-2.3-4.5-6 (R. 5b)","refrao":"O Senhor se lembra sempre da Aliança.","segunda":"","evangelho":"Lc 11,15-26"}

TEXTO:
${src.slice(0, 30000)}`
    : `Abaixo está um texto copiado de um site católico, em português. Escolha UMA frase curta e inspiradora (até 200 caracteres) para "frase do dia", copiada EXATAMENTE como está no texto, e diga quem é o autor da frase segundo o próprio texto ("" se o texto não disser). Não invente nem edite a frase. Responda só com JSON: {"texto":"...","autor":"..."}

TEXTO:
${src.slice(0, 30000)}`;
  btn.disabled = true; st.textContent = "Lendo o texto…";

    const r = await sampleFn.json(prompt, { modelTier: "quick" });
    const out = {}, missing = [];

      if (k === "data" || k === "autor") { out[k] = typeof v === "string" ? v : ""; continue; }
      if (typeof v === "string" && v.trim()) { if (inSource(v, src)) out[k] = v.trim(); else missing.push(k); }
    }
    onFill(out);
    const filled = Object.keys(out).filter(k => out[k] && k !== "data" && k !== "autor").length;
    st.className = "import-status " + (filled ? "ok" : "err");
    st.textContent = filled
      ? `Preenchido. Confira antes de publicar.${out.data ? " Data no texto: " + out.data + "." : ""}${missing.length ? " Alguns itens não foram confirmados no texto e ficaram de fora." : ""}`
      : "Não encontrei essas informações no texto colado. Confira se copiou a página certa.";
  } catch (e) {
    st.className = "import-status err";
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { sampleFn = null; btn.remove(); st.textContent = "O preenchimento automático não está disponível. Copie as informações para os campos."; }
    else if (e.code === "rate_limited") st.textContent = "Muitas tentativas seguidas. Espere um pouco e tente de novo.";
    else st.textContent = "Não consegui ler o texto agora. Tente de novo.";
  } finally { if (btn.isConnected) btn.disabled = false; }
}
let agenda = [], teamFrases = [], liturgias = {};
const LOCAL_KEY = c => "pascom:db:" + c;
const localRead = c => store.get("db:" + c, {});
const local = {
  listeners: {},
  watch(c, cb) { (this.listeners[c] ||= []).push(cb); cb(Object.entries(localRead(c)).map(([id, d]) => ({ id, ...d }))); },
  emit(c) { const rows = Object.entries(localRead(c)).map(([id, d]) => ({ id, ...d })); (this.listeners[c] || []).forEach(cb => cb(rows)); },
  async set(c, id, d) { const all = localRead(c); all[id] = d; store.set("db:" + c, all); this.emit(c); },
  async del(c, id) { const all = localRead(c); delete all[id]; store.set("db:" + c, all); this.emit(c); },

let db = null;
const data = {

    if (!db) return local.watch(c, cb);
    db.collection(c).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn(c, e.code); });
  },
  async set(c, id, d) { if (!db) return local.set(c, id, d); await db.collection(c).doc(id).set(d); },
  async add(c, d) { const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7); return this.set(c, id, d); },
  async del(c, id) { if (!db) return local.del(c, id); await db.collection(c).doc(id).delete(); },

/* ---------- Calendário litúrgico (calculado) ---------- */
const DAY = 864e5;
const mk = (y, m, d) => new Date(y, m - 1, d);
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffD = (a, b) => Math.round((a - b) / DAY);
function easter(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31);
  return mk(y, mo, ((h + l - 7 * m + 114) % 31) + 1);
}
const advent1 = y => { const x = mk(y, 12, 25); return addD(x, -(x.getDay() || 7) - 21); };
function baptism(y) { // Brasil: Epifania no domingo entre 2 e 8 de janeiro
  let ep = mk(y, 1, 2); while (ep.getDay() !== 0) ep = addD(ep, 1);
  return ep.getDate() >= 7 ? addD(ep, 1) : addD(ep, 7);
}
const COR = { verde: ["Verde", "#2e8b57"], roxo: ["Roxo", "#6b2c91"], branco: ["Branco", "#ffffff"], vermelho: ["Vermelho", "#c8102e"], rosa: ["Rosa", "#e58fb1"] };
const ORD = n => n + "ª";
const FESTAS = { // celebrações fixas exibidas no calendário
  "01-01": ["Santa Maria, Mãe de Deus", "branco"], "01-24": ["São Francisco de Sales", "branco"], "03-19": ["São José", "branco"],
  "06-29": ["São Pedro e São Paulo", "vermelho"], "08-11": ["Santa Clara de Assis", "branco"], "08-14": ["São Maximiliano Kolbe", "vermelho"],
  "09-29": ["Santos Arcanjos Miguel, Gabriel e Rafael", "branco"], "10-12": ["Nossa Senhora Aparecida", "branco"],
  "10-22": ["São João Paulo II", "branco"], "11-02": ["Fiéis Defuntos", "roxo"], "12-08": ["Imaculada Conceição", "branco"], "12-25": ["Natal do Senhor", "branco"],
};
function liturgicalDay(d) {
  const y = d.getFullYear(), E = easter(y), adv = advent1(y), bap = baptism(y);
  const litYearEnd = d >= adv ? y + 1 : y;
  const ciclo = ["C", "A", "B"][litYearEnd % 3];
  const par = litYearEnd % 2 === 0 ? "II" : "I";
  const sunBefore = x => addD(x, -x.getDay());
  let tempo, cor, semana = "";
  const ash = addD(E, -46), palm = addD(E, -7), pent = addD(E, 49);
  if (d >= adv) {
    tempo = "Advento"; cor = "roxo";
    const w = Math.floor(diffD(d, adv) / 7) + 1; semana = `semana ${w}`;
    if (w === 3 && d.getDay() === 0) cor = "rosa";
    if (d >= mk(y, 12, 25)) { tempo = "Tempo do Natal"; cor = "branco"; semana = ""; }
  } else if (d <= bap) { tempo = "Tempo do Natal"; cor = "branco"; if (d.getTime() === bap.getTime()) semana = "Batismo do Senhor"; }
  else if (d < ash) { tempo = "Tempo Comum"; cor = "verde"; let n = 1; for (let x = addD(bap, 1); x <= d; x = addD(x, 1)) if (x.getDay() === 0) n++; semana = `semana ${n}`; }
  else if (d < palm) {
    tempo = "Quaresma"; cor = "roxo";
    const w = d < addD(ash, 4) ? 0 : Math.floor(diffD(d, addD(ash, 4)) / 7) + 1;
    semana = w ? `semana ${w}` : (diffD(d, ash) === 0 ? "Quarta-feira de Cinzas" : "Depois das Cinzas");
    if (w === 4 && d.getDay() === 0) cor = "rosa";
  } else if (d < addD(E, -3)) { tempo = "Semana Santa"; cor = d.getTime() === palm.getTime() ? "vermelho" : "roxo"; }
  else if (d < E) { tempo = "Tríduo Pascal"; cor = diffD(E, d) === 2 ? "vermelho" : "branco"; }
  else if (d <= pent) { tempo = "Tempo Pascal"; cor = d.getTime() === pent.getTime() ? "vermelho" : "branco"; const w = Math.floor(diffD(d, E) / 7) + 1; semana = d.getTime() === pent.getTime() ? "Pentecostes" : `semana ${w}`; }
  else { tempo = "Tempo Comum"; cor = "verde"; const ck = addD(adv, -7); semana = `semana ${34 - Math.floor(diffD(ck, sunBefore(d)) / 7)}`; }
  const key = `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const festa = FESTAS[key] && !["Quaresma", "Semana Santa", "Tríduo Pascal"].includes(tempo) ? FESTAS[key] : null;
  if (festa) cor = festa[1];

}

  $("fr-box").innerHTML = f
    ? `<blockquote class="team-q">${f.dia === TODAY ? `<span class="today">Hoje</span><br>` : ""}“${esc(f.texto)}”<cite>— ${esc(f.autor || "Pascom")}${f.dia !== TODAY ? " · " + esc(weekday(f.dia)) : ""}</cite>${f.fonte && f.fonte !== "outra" ? `<div class="src" style="margin-top:6px">${fonteHTML(f.fonte)}</div>` : ""}</blockquote>${shareRow(`Frase do dia: “${f.texto}” (${f.autor || "Pascom"})`, "frases")}`
    : `<div class="empty-state">${ico("ampulheta", 40)}<span>${canWrite ? "Nenhuma frase publicada. Toque em + para publicar a frase de hoje." : "A equipe ainda não publicou a frase de hoje."}</span></div>`;
  // frases da equipe também entram no player
  const team = sortedFrases().filter(x => x.dia <= TODAY).map(x => ({ s: { nome: x.autor || "Pascom", curto: x.autor || "Pascom", ini: (x.autor || "Pascom").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(), cor: "linear-gradient(160deg,#c8102e,#2b0606)", foto: "" }, f: x.texto, team: true }));
  const cur = QUOTES[qI];
  QUOTES = [...team, ...SAINT_QUOTES];
  if (!qPlaying) { qI = todaysFrase() ? 0 : Math.max(0, QUOTES.findIndex(q => q.f === (cur && cur.f))); renderQuote(); }
}
function openFraseForm() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Publicar frase</h2>
    ${importBox("frase")}
    <form class="join" id="fr-form" novalidate>
      <div class="field"><label for="f-t">Frase</label><textarea id="f-t" maxlength="400" placeholder="Escreva a frase exatamente como foi dita ou escrita"></textarea></div>
      <div class="two">
        <div class="field"><label for="f-a">Autor</label><input id="f-a" list="f-autores" placeholder="Ex.: São Carlo Acutis"><datalist id="f-autores">${SAINTS.map(s => `<option value="${esc(s.nome)}">`).join("")}</datalist></div>
        <div class="field"><label for="f-d">Dia</label><input id="f-d" type="date" value="${TODAY}"></div>
      </div>
      <p class="note" id="f-note" role="status"></p>
      <button class="btn-red" type="submit">Publicar frase</button>
    </form></div>`, () => {
    $("imp-go") && ($("imp-go").onclick = () => runImport("frase", o => { if (o.texto) $("f-t").value = o.texto; if (o.autor) $("f-a").value = o.autor; }));
    $("fr-form").onsubmit = async e => {
      e.preventDefault();
      const d = { texto: $("f-t").value.trim().replace(/^["“]|["”]$/g, ""), autor: $("f-a").value.trim(), dia: $("f-d").value || TODAY, fonte: $("imp-src").value.trim() ? $("imp-fonte").value : "", criadoPor: myId, criadoEm: Date.now() };
      if (!d.texto) { $("f-note").textContent = "Escreva a frase antes de publicar."; return; }
      if (await writeOr(() => data.add("frases", d), "Frase publicada")) modal.close();
    };
  });
}
function openFrasesEquipe() {
  const all = sortedFrases();
  openModal(`<div class="m-plain">${closeBtn()}<h2>Frases da equipe</h2>
    ${canWrite ? `<button class="btn-red" id="m-fr-add">Publicar frase</button>` : ""}
    ${all.length ? `<ul class="m-list">${all.map(f => `<li class="m-item">${ico("megafone", 40)}<div class="what"><b>“${esc(f.texto)}”</b><small>${esc(f.autor || "Pascom")} · ${esc(weekday(f.dia))}</small></div>${canWrite ? delBtn("frases", f.id) : ""}</li>`).join("")}</ul>`
      : `<div class="m-item">${ico("ampulheta", 40)}<div class="what"><b>Nenhuma frase ainda</b><small>As frases publicadas pela equipe aparecem aqui e no player.</small></div></div>`}</div>`, () => {
    $("m-fr-add") && ($("m-fr-add").onclick = openFraseForm);
    wireDeletes(openFrasesEquipe);
  });
}
$("litu-add").onclick = openLiturgiaForm;
$("litu-read").onclick = openLiturgia;
$("ev-add").onclick = openEventForm;
$("fr-add").onclick = openFraseForm;
$("fr-all").onclick = openFrasesEquipe;

async function startData() {
  const timeout = new Promise(r => setTimeout(() => r(null), 4000));
  const hasClaude = !!(window.claude && window.claude.use);
  db = hasClaude ? await Promise.race([window.claude.use("db"), timeout]).catch(() => null) : null;
  if (db) {
    backend = "db";
    const user = await window.claude.use("user").catch(() => null);
    myId = user ? await user.id() : null;
    const can = user ? await user.can("data.write") : null;
    canWrite = can === true || (can === null && !!myId);
    sampleFn = await Promise.race([window.claude.use("sample"), new Promise(r => setTimeout(() => r(null), 4000))]).catch(() => null);
  } else canWrite = true;
  applyTeam();
  data.watch("agenda", rows => { agenda = rows; renderAgenda(); updateEventsJsonLd(); });
  data.watch("frases", rows => { teamFrases = rows; renderFrases(); });
  data.watch("liturgia", rows => { liturgias = Object.fromEntries(rows.map(r => [r.id, r])); renderLiturgia(); });
}
function openQuotes() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Todas as frases</h2>
    <ul class="quotes">${QUOTES.map((q, i) => `<li><button style="text-align:left;width:100%" data-q="${i}">“${q.f}”<small>${q.s.nome}</small></button></li>`).join("")}</ul></div>`, () => {
    mBody.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { qI = +b.dataset.q; renderQuote(); modal.close(); playQuote(); });
  });
}
function openSettings() {
  const row = (id, label, on) => `<div class="set-row"><span>${label}</span><button class="switch" id="${id}" role="switch" aria-checked="${on}" aria-label="${label}"></button></div>`;
  openModal(`<div class="m-plain">${closeBtn()}<h2>Configurações</h2>
    <div>${row("set-carousel", "Passar os destaques sozinho", settings.carousel)}${row("set-auto", "Avançar frases automaticamente", autoplay)}</div>
    <button class="btn-dark" id="set-reset">Limpar favoritos e progresso</button></div>`, () => {
    $("set-carousel").onclick = e => { settings.carousel = !settings.carousel; store.set("settings", settings); e.target.setAttribute("aria-checked", settings.carousel); restartHero(); };
    $("set-auto").onclick = e => { autoplay = !autoplay; store.set("autoplay", autoplay); e.target.setAttribute("aria-checked", autoplay); $("autoplay").setAttribute("aria-checked", autoplay); };
    $("set-reset").onclick = () => { favs = []; massPos = 41 * 60; store.set("favs", favs); store.set("mass", massPos); renderPick(); renderMass(); toast("Favoritos e progresso limpos"); };
  });
}
function openJoin() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Venha servir na Pascom</h2>
    <p class="empty" style="margin:0">Não precisa ter experiência. A gente ensina o resto.</p>
    <form class="join" id="join" novalidate>
      <div class="field"><label for="j-nome">Seu nome</label><input id="j-nome" autocomplete="name"></div>
      <div class="field"><label for="j-tel">WhatsApp</label><input id="j-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></div>
      <div class="field"><label for="j-area">Área de interesse</label><select id="j-area"><option>Fotografia</option><option>Vídeo e transmissão</option><option>Redes sociais</option><option>Rádio e podcast</option></select></div>
      <p class="note" id="j-note" role="status"></p>
      <button class="btn-red" type="submit">Quero participar</button>
    </form></div>`, () => {
    $("join").onsubmit = e => {
      e.preventDefault();
      const nome = $("j-nome").value.trim().replace(/\s+/g, " "), tel = $("j-tel").value.trim(), area = $("j-area").value;
      const digitos = tel.replace(/\D/g, "").replace(/^55(?=\d{10,11}$)/, "");
      if (!nome || !tel) { $("j-note").textContent = "Preencha seu nome e WhatsApp para continuar."; return; }
      if (nome.replace(/[^\p{L}]/gu, "").length < 2) { $("j-note").textContent = "Escreva seu nome."; $("j-nome").focus(); return; }
      if (!/^\d{10,11}$/.test(digitos)) { $("j-note").textContent = "Confira o número de WhatsApp: use o DDD e o número, por exemplo (11) 98765-4321."; $("j-tel").focus(); return; }
      const fone = digitos.replace(/^(\d{2})(\d{4,5})(\d{4})$/, "($1) $2-$3");
      const msg = `Olá! Quero participar da Pascom.\nNome: ${nome}\nWhatsApp: ${fone}\nÁrea de interesse: ${area}`;
      const wa = PASCOM_WHATSAPP ? `https://wa.me/${PASCOM_WHATSAPP}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
      $("join").innerHTML = `<p style="margin:0;font-size:16px">Quase lá, ${esc(nome.split(" ")[0])}! Falta enviar sua mensagem para a equipe da Pascom.</p>
        <div class="share"><a class="wa" href="${wa}" target="_blank" rel="noopener">Enviar pelo WhatsApp</a><button type="button" data-copy="${esc(msg)}">Copiar mensagem</button></div>
        <p class="empty" style="margin:0;font-size:13px">${PASCOM_WHATSAPP ? "A mensagem já vai para o WhatsApp da Pascom." : "Escolha o contato da equipe da Pascom no WhatsApp e envie."}</p>`;
    };
  });
}

/* ---------- Navegação ---------- */
function setNav(a) { document.querySelectorAll(".side .nav-btn, .side .avatar").forEach(b => b.setAttribute("aria-current", b.dataset.action === a)); }
const ACTIONS = { home: () => { window.scrollTo({ top: 0, behavior: "smooth" }); }, search: openSearch, agenda: openAgenda, gallery: openGallery, settings: openSettings, join: openJoin, quotes: openQuotes, liturgia: openLiturgia };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  setNav(b.dataset.action); ACTIONS[b.dataset.action]();
});

/* ---------- Início ---------- */
renderCats(); renderHero(); renderPick(); renderMass(); setMassUI(false); renderQuote(); restartHero();
renderLiturgia(); renderAgenda(); renderFrases(); applyTeam();
startData().then(openFromHash);
</script>
