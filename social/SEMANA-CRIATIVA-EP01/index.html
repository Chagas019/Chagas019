<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semana Criativa — EP. 01</title>
<link rel="stylesheet" href="css/system.css">
<style>
  html, body { width: auto; height: auto; overflow: auto; background: #161613; color: #FBF4E4; font-family: var(--sans); }
  header { padding: 40px 16px 24px; max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: clamp(36px, 6vw, 72px); font-weight: 800; letter-spacing: -.04em; text-transform: uppercase; line-height: .9; }
  header h1 em { font-family: var(--serif); font-weight: 400; text-transform: none; }
  header p { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .rail { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 16px 40px; max-width: 1200px; margin: 0 auto; }
  .card { flex: 0 0 min(86vw, 432px); scroll-snap-align: center; }
  .frame { position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 4px; }
  .frame iframe { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; border: 0; transform-origin: 0 0; }
  .card a { display: inline-block; margin-top: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: inherit; opacity: .75; }
</style>
</head>
<body>
<header>
  <h1>Semana <em>Criativa</em><br>EP. 01</h1>
  <p>Chagas Criatividade · Inspirar. Experimentar. Criar.</p>
</header>
<main class="rail" id="rail"></main>
<script>
  const slides = ['01-capa','02-introducao','03-leica-lux','04-evoto','05-luminar','06-qual-voce-vai-testar','07-encerramento'];
  const rail = document.getElementById('rail');
  rail.innerHTML = slides.map(s => `<div class="card"><div class="frame"><iframe src="slides/${s}.html" loading="lazy" title="${s}"></iframe></div><a href="export/png-2x/${s}.png" download>Baixar PNG ↓</a></div>`).join('');
  const fit = () => document.querySelectorAll('.frame').forEach(f => f.querySelector('iframe').style.transform = `scale(${f.clientWidth / 1080})`);
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
