<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>06 — Qual deles você vai testar? · Semana Criativa EP.01</title>
<link rel="stylesheet" href="../css/system.css">
<style>
  .slide { color: var(--cream); }
  .kicker-q { position: absolute; left: var(--m); top: 132px; }
  .kicker-q .tape { font-size: 30px; background: var(--ink); color: var(--cream); }
  .title { position: absolute; left: var(--m); top: 220px; right: 40px; }
  .title .display { display: block; font-size: 112px; white-space: nowrap; color: var(--cream); }
  .title .serif-it { display: block; font-size: 150px; color: var(--ink); margin-top: 34px; margin-left: -4px; }

  .lineup { position: absolute; left: var(--m); right: var(--m); top: 770px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .lineup figure { position: relative; padding: 22px 0 0; border-top: 2px solid var(--cream); }
  .lineup figure + figure { padding-left: 22px; border-left: 2px solid rgba(251,244,228,.0); }
  .lineup img { width: 150px; }
  .lineup .n { position: absolute; right: 18px; top: 18px; font-family: var(--mono); font-size: 16px; letter-spacing: .12em; }
  .lineup figcaption { margin-top: 18px; font-weight: 700; font-size: 30px; letter-spacing: -.02em; line-height: 1; }
  .lineup figcaption small { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 27px; margin-top: 6px; letter-spacing: 0; opacity: .9; }
  .lineup figure:nth-child(1) img { transform: rotate(-6deg); }
  .lineup figure:nth-child(2) img { transform: rotate(4deg); }
  .lineup figure:nth-child(3) img { transform: rotate(-2deg); }

  .copy { position: absolute; left: var(--m); right: 360px; top: 1112px; }
  .copy .body { font-size: 28px; color: var(--cream); }
  .copy .body strong { font-weight: 700; }
  .cta { position: absolute; right: var(--m); top: 1118px; width: 270px; text-align: right; font-family: var(--mono); font-size: 15px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.6; }
  .cta b { display: block; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 46px; letter-spacing: -.01em; text-transform: none; white-space: nowrap; line-height: 1; margin-top: 6px; }
  .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,40,80,.05), rgba(20,40,80,.0) 40%, rgba(20,40,80,.35)); }
</style>
</head>
<body>
<div class="slide">
  <div class="bg bg-sky2"></div>
  <div class="tint"></div>
  <div class="chrome top on-dark"><b>Semana Criativa</b><span class="rule"></span><span>EP. 01 — Escolha</span></div>

  <div class="kicker-q"><span class="tape">Qual deles você vai testar?</span></div>
  <h2 class="title"><span class="display">Três apps.</span><span class="serif-it">Novas possibilidades.</span></h2>

  <div class="lineup">
    <figure><span class="n">01</span><img class="app-icon" src="../assets/logos/leica.png" alt="Leica LUX"><figcaption>Leica LUX<small>para fotografar</small></figcaption></figure>
    <figure><span class="n">02</span><img class="app-icon" src="../assets/logos/evoto.png" alt="Evoto"><figcaption>Evoto<small>para retratos</small></figcaption></figure>
    <figure><span class="n">03</span><img class="app-icon" src="../assets/logos/luminar.png" alt="Luminar"><figcaption>Luminar<small>para editar</small></figcaption></figure>
  </div>

  <div class="copy"><p class="body">Não é sobre ter todas as ferramentas do mundo. <strong>É sobre aprender a usar bem aquelas que ajudam suas ideias a saírem do papel.</strong></p></div>
  <div class="cta">Comente<b>01, 02 ou 03</b></div>

  <div class="chrome bottom on-dark"><span>Chagas Criatividade</span><span>06 / 07</span></div>
  <div class="grain strong"></div>
</div>
<script src="../js/system.js"></script>
</body>
</html>
