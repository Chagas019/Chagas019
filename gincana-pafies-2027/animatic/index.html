<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Animatic PAFIES 2027</title>
<style>
  :root { --azul:#0b3dbd; --azul-esc:#020b2e; --ouro1:#fff3b0; --ouro2:#f5c542; --ouro3:#b07a10; }
  html,body { margin:0; background:#000; }
  #stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:var(--azul-esc);
           font-family:"Inter Display","Inter",sans-serif; perspective:1400px; }
  #cam { position:absolute; inset:0; transform-style:preserve-3d; }
  #bg { position:absolute; inset:0; background:url(mascote.jpg) center/cover; transform-origin:50% 55%; }
  canvas { position:absolute; inset:0; }
  #veil { position:absolute; inset:0; background:var(--azul-esc); }
  #flash { position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, #fff, rgba(120,180,255,.6) 35%, transparent 70%); opacity:0; mix-blend-mode:screen; }
  #vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,5,30,.75) 100%); }
  .t3d { position:absolute; left:0; right:0; text-align:center; font-weight:900; letter-spacing:-1px;
         transform-style:preserve-3d; opacity:0; will-change:transform; }
  .ouro { background:linear-gradient(180deg,var(--ouro1) 0%,var(--ouro2) 45%,var(--ouro3) 100%);
          -webkit-background-clip:text; background-clip:text; color:transparent;
          filter:drop-shadow(0 2px 0 #8a5a00) drop-shadow(0 4px 0 #6b4500) drop-shadow(0 6px 0 #4d3200) drop-shadow(0 18px 24px rgba(0,0,0,.6)); }
  .branco { color:#fff; text-shadow:0 2px 0 #9fb8ff,0 4px 0 #6e8ef0,0 6px 0 #3d5fd6,0 8px 0 #1f3ea8,0 22px 30px rgba(0,0,0,.6),0 0 40px rgba(120,170,255,.7); }
  #ei { top:240px; font-size:170px; }
  #dez { top:150px; font-size:520px; line-height:1; }
  #dez sup { font-size:180px; vertical-align:top; position:relative; top:40px; }
  #gincana { top:690px; font-size:66px; letter-spacing:6px; }
  #provas { top:260px; font-size:60px; letter-spacing:3px; }
  #data { position:absolute; left:90px; right:90px; top:230px; padding:46px 30px 52px; border-radius:40px; opacity:0;
          background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.06)); border:2px solid rgba(255,220,120,.7);
          box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 0 40px rgba(255,255,255,.12); backdrop-filter:blur(14px);
          text-align:center; transform-style:preserve-3d; }
  #data .dias { font-size:92px; font-weight:900; line-height:1.05; }
  #data .mes { font-size:58px; font-weight:800; color:#fff; letter-spacing:4px; margin-top:16px; text-shadow:0 4px 14px rgba(0,0,0,.5); }
  #data .tag { font-size:34px; color:#ffe9a6; letter-spacing:8px; font-weight:700; margin-bottom:14px; }
  #titulo { top:170px; font-size:92px; line-height:1.02; }
  #titulo .l2 { font-size:150px; }
  #slogan { position:absolute; left:60px; right:60px; bottom:150px; padding:34px 26px; border-radius:30px; opacity:0;
            background:linear-gradient(90deg,#0a2a8f,#1b5cff,#0a2a8f); border:3px solid var(--ouro2);
            color:#fff; font-size:50px; font-weight:900; text-align:center; line-height:1.15;
            box-shadow:0 0 60px rgba(245,197,66,.45),0 20px 50px rgba(0,0,0,.5); }
  #slogan b { color:var(--ouro1); }
</style>
</head>
<body>
<div id="stage">
  <div id="cam"><div id="bg"></div></div>
  <canvas id="fxBack" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="veil"></div>
  <div id="ei" class="t3d branco">EI, VOCÊ!</div>
  <div id="dez" class="t3d ouro">10<sup>ª</sup></div>
  <div id="gincana" class="t3d branco">GINCANA SOLIDÁRIA</div>
  <div id="provas" class="t3d branco">DESAFIOS • PROVAS • UNIÃO</div>
  <div id="data"><div class="tag">ANOTA AÍ</div><div class="dias ouro">22, 23, 24,<br>30 E 31</div><div class="mes">DE JANEIRO DE 2027</div></div>
  <div id="titulo" class="t3d"><div class="ouro">10ª GINCANA<br>SOLIDÁRIA</div><div class="l2 branco">PAFIES 2027</div></div>
  <div id="slogan">MAIS QUE UMA GINCANA,<br><b>UMA MISSÃO DE SOLIDARIEDADE!</b></div>
  <canvas id="fxFront" width="1080" height="1920"></canvas>
  <div id="flash"></div>
</div>
<script>
const DUR = 30;
const $ = id => document.getElementById(id);
const clamp = (v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const prog = (t,a,b)=>clamp((t-a)/(b-a));
const easeOut = x=>1-Math.pow(1-x,3);
const easeInOut = x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const backOut = x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
// gerador pseudoaleatório determinístico (mesmo resultado a cada render)
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

const dust = Array.from({length:140},()=>({x:rnd()*1080,y:rnd()*1920,r:1+rnd()*4,s:10+rnd()*40,p:rnd()*6.28,z:rnd()}));
const ring = Array.from({length:90},()=>({a:rnd()*6.28,v:500+rnd()*900,r:3+rnd()*6,g:rnd()<.5}));
const confColors=['#f5c542','#ffe38a','#1b5cff','#5aa0ff','#ffffff','#0b3dbd'];
const confetti = Array.from({length:260},()=>({x:540+(rnd()-.5)*120,y:1150,vx:(rnd()-.5)*2600,vy:-900-rnd()*2200,w:12+rnd()*16,h:6+rnd()*10,rot:rnd()*6.28,vr:(rnd()-.5)*20,c:confColors[Math.floor(rnd()*6)],d:rnd()*.35}));
const objetos = [
  {k:'trofeu', x:180, y:1060, t0:12.0, s:1.15},
  {k:'caixa',  x:900, y:1100, t0:12.6, s:1.0},
  {k:'medalha',x:150, y:1500, t0:13.2, s:1.0},
  {k:'estrela',x:930, y:1480, t0:13.8, s:1.0},
  {k:'bola',   x:860, y:700,  t0:14.4, s:.95},
  {k:'coracao',x:220, y:700,  t0:15.0, s:1.0},
  {k:'maos',   x:540, y:560,  t0:15.6, s:.9},
];

function star(c,x,y,R,r,n=5){c.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,rr=i%2?r:R;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}c.closePath();}
function gold(c,y0,y1){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#fff3b0');g.addColorStop(.45,'#f5c542');g.addColorStop(1,'#a8700c');return g;}
function drawObj(c,o){
  c.save(); c.shadowColor='rgba(0,0,0,.45)'; c.shadowBlur=30; c.shadowOffsetY=18;
  switch(o.k){
    case 'trofeu':
      c.fillStyle=gold(c,-110,120);
      c.beginPath();c.moveTo(-80,-100);c.lineTo(80,-100);c.quadraticCurveTo(78,10,0,30);c.quadraticCurveTo(-78,10,-80,-100);c.fill();
      c.lineWidth=14;c.strokeStyle='#e0ac2a';c.beginPath();c.arc(-82,-55,34,Math.PI*.5,Math.PI*1.5);c.stroke();c.beginPath();c.arc(82,-55,34,-Math.PI*.5,Math.PI*.5);c.stroke();
      c.fillRect(-14,28,28,50);c.fillStyle='#0b3dbd';c.fillRect(-60,78,120,36);c.fillStyle='#f5c542';c.fillRect(-60,78,120,6);
      c.shadowColor='transparent';c.fillStyle='rgba(255,255,255,.55)';c.fillRect(-55,-92,14,80);break;
    case 'caixa':
      c.fillStyle='#c98a4b';c.fillRect(-85,-55,170,120);c.fillStyle='#e0a868';c.beginPath();c.moveTo(-85,-55);c.lineTo(-55,-95);c.lineTo(115,-95);c.lineTo(85,-55);c.fill();
      c.fillStyle='#a86d34';c.beginPath();c.moveTo(85,-55);c.lineTo(115,-95);c.lineTo(115,25);c.lineTo(85,65);c.fill();
      c.shadowColor='transparent';c.fillStyle='#fff';c.font='900 30px Inter Display';c.textAlign='center';c.fillText('ALIMENTOS',0,0);
      c.fillStyle='#e8433b';c.beginPath();c.arc(0,32,14,0,7);c.fill();break;
    case 'medalha':
      c.fillStyle='#1b5cff';c.beginPath();c.moveTo(-45,-120);c.lineTo(-10,-120);c.lineTo(20,-20);c.lineTo(-15,-20);c.fill();
      c.fillStyle='#5aa0ff';c.beginPath();c.moveTo(45,-120);c.lineTo(10,-120);c.lineTo(-20,-20);c.lineTo(15,-20);c.fill();
      c.fillStyle=gold(c,-30,90);c.beginPath();c.arc(0,30,62,0,7);c.fill();c.shadowColor='transparent';c.fillStyle='#b07a10';star(c,0,30,34,15);c.fill();break;
    case 'estrela':
      c.fillStyle=gold(c,-80,80);star(c,0,0,85,36);c.fill();c.shadowColor='transparent';c.fillStyle='rgba(255,255,255,.5)';star(c,-8,-10,30,12);c.fill();break;
    case 'bola':
      c.fillStyle='#fff';c.beginPath();c.arc(0,0,70,0,7);c.fill();c.shadowColor='transparent';c.fillStyle='#111';
      for(let i=0;i<5;i++){const a=i*1.2566-1.57;c.beginPath();c.arc(Math.cos(a)*48,Math.sin(a)*48,15,0,7);c.fill();}
      c.beginPath();c.arc(0,0,20,0,7);c.fill();break;
    case 'coracao':
      c.fillStyle='#ff4d6d';c.beginPath();c.moveTo(0,70);c.bezierCurveTo(-120,-10,-60,-110,0,-45);c.bezierCurveTo(60,-110,120,-10,0,70);c.fill();
      c.shadowColor='transparent';c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(-35,-35,16,24,-.6,0,7);c.fill();break;
    case 'maos': // símbolo de união: dois anéis entrelaçados
      c.lineWidth=20;c.strokeStyle='#f5c542';c.beginPath();c.arc(-38,0,60,0,7);c.stroke();c.strokeStyle='#ffffff';c.beginPath();c.arc(38,0,60,0,7);c.stroke();break;
  }
  c.restore();
}

function set(el,op,tf){el.style.opacity=op;el.style.transform=tf||'none';}

window.renderAt = function(t){
  const bg=$('bg'), cam=$('cam');
  // ---------- CÂMERA ----------
  let sc=1.0, tx=0, ty=0, ry=0, blur=0;
  if(t<4){ const p=easeOut(prog(t,0,3.6)); sc=lerp(1.55,1.12,p); ty=lerp(140,40,p); }
  else if(t<11){ sc=lerp(1.12,1.18,prog(t,4,11)); ty=40; }
  else if(t<18){ const p=easeInOut(prog(t,11,12.2)); sc=lerp(1.18,1.04,p); ty=lerp(40,0,p); }
  else if(t<24){ const p=prog(t,18,24); ry=Math.sin(p*Math.PI*1.2)*9; tx=-ry*12; sc=lerp(1.14,1.18,p); }
  else { const p=easeOut(prog(t,24,30)); sc=lerp(1.18,1.22,p); ty=lerp(0,30,p); }
  // whip pans (3.8s e 17.8s) e zoom-punch (23.8s)
  const whip=(c)=>{const d=t-c; return Math.abs(d)<.35? Math.cos(d/.35*Math.PI/2):0;};
  const w1=whip(4.0), w2=whip(18.0);
  tx += (t-4.0)/.35*w1*420*(Math.abs(t-4)<.35?1:0) + (t-18)/.35*w2*-420*(Math.abs(t-18)<.35?1:0);
  blur = (w1+w2)*22;
  // respiração sutil da câmera
  tx += Math.sin(t*0.9)*6; ty += Math.cos(t*0.7)*5;
  bg.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  bg.style.filter=blur>0.5?`blur(${blur}px)`:'none';
  cam.style.transform=`rotateY(${ry}deg)`;
  $('veil').style.opacity = 1-easeOut(prog(t,0.6,2.6));

  // ---------- TEXTOS ----------
  { const p=prog(t,1.2,1.9), out=prog(t,3.5,3.9); const s=backOut(p);
    set($('ei'), p*(1-out), `translateZ(${lerp(-900,0,s)}px) rotateX(${lerp(60,0,s)}deg) translateX(${-out*600}px)`); }
  { const p=prog(t,6.3,6.9), out=prog(t,10.6,11.0); const s=backOut(p);
    const wob=Math.sin(t*2)*4;
    set($('dez'), clamp(p*3)*(1-out), `translateZ(${lerp(1800,0,easeOut(p))}px) rotateY(${lerp(-90,0,s)+wob}deg) scale(${1+out*.6})`);
    const g=prog(t,7.1,7.6); set($('gincana'), g*(1-out), `translateY(${lerp(60,0,easeOut(g))}px) rotateX(${lerp(-70,0,easeOut(g))}deg)`); }
  { const p=prog(t,11.6,12.2), out=prog(t,17.4,17.8);
    set($('provas'), p*(1-out), `translateY(${lerp(-80,0,easeOut(p))}px)`); }
  { const p=prog(t,18.4,19.2), out=prog(t,23.6,24.0); const s=backOut(p);
    set($('data'), clamp(p*2)*(1-out), `rotateY(${lerp(70,0,s)+Math.sin(t*1.3)*5}deg) rotateX(${Math.cos(t*1.1)*4}deg) translateZ(${lerp(-600,0,s)}px) scale(${1-out*.3})`); }
  { const p=prog(t,24.6,25.4); const s=backOut(p);
    set($('titulo'), clamp(p*2), `translateZ(${lerp(-1200,0,s)}px) rotateX(${lerp(50,0,s)+Math.sin(t*1.4)*3}deg)`);
    const q=prog(t,26.8,27.5); set($('slogan'), q, `translateY(${lerp(120,0,backOut(q))}px) scale(${lerp(.8,1,backOut(q))})`); }

  // flash de impacto no 10 e no encerramento
  const fl=Math.max(clamp(1-Math.abs(t-6.85)/.25), clamp(1-Math.abs(t-24.6)/.3)*.8, clamp(1-Math.abs(t-4)/.15)*.35, clamp(1-Math.abs(t-18)/.15)*.35);
  $('flash').style.opacity=fl;

  // ---------- PARTÍCULAS ----------
  const b=$('fxBack').getContext('2d'), f=$('fxFront').getContext('2d');
  b.clearRect(0,0,1080,1920); f.clearRect(0,0,1080,1920);
  const dustA=clamp(prog(t,0.2,1.5));
  for(const d of dust){
    const y=((d.y - t*d.s*(1+d.z)) % 1920 + 1920) % 1920, x=d.x+Math.sin(t*.8+d.p)*18 - tx*d.z*.4;
    const tw=.5+.5*Math.sin(t*3+d.p);
    const c=d.z>.75?f:b; c.globalAlpha=dustA*(.25+.6*tw)*(d.z>.75?.7:1);
    const g=c.createRadialGradient(x,y,0,x,y,d.r*(d.z>.75?5:3)); g.addColorStop(0,'#fff8d6'); g.addColorStop(.4,'rgba(150,200,255,.8)'); g.addColorStop(1,'rgba(80,140,255,0)');
    c.fillStyle=g; c.beginPath(); c.arc(x,y,d.r*(d.z>.75?5:3),0,7); c.fill();
  }
  // anel de partículas na entrada do 10
  if(t>6.7&&t<9){ const k=t-6.7; f.globalAlpha=clamp(1-k/2.2);
    for(const r of ring){ const d=r.v*easeOut(clamp(k/1.6)); f.fillStyle=r.g?'#f5c542':'#9cc4ff';
      f.beginPath(); f.arc(540+Math.cos(r.a)*d, 420+Math.sin(r.a)*d*.6, r.r*(1-k/2.5),0,7); f.fill(); } }
  // transição com partículas (17.6–18.4): cortina de brilho
  if(t>17.4&&t<18.6){ const k=prog(t,17.4,18.6); f.globalAlpha=Math.sin(k*Math.PI)*.9;
    for(let i=0;i<120;i++){ const x=((i*97)%1080), y=((i*331)%1920); f.fillStyle=i%2?'#f5c542':'#fff';
      f.beginPath(); f.arc(x+(k-.5)*900, y, 4+(i%5)*2,0,7); f.fill(); } }

  // ---------- OBJETOS 3D (cena 3) ----------
  if(t>11.8&&t<18.2){
    for(const o of objetos){
      const p=prog(t,o.t0,o.t0+.7); if(p<=0) continue;
      const out=prog(t,17.3,17.9);
      const s=backOut(p)*o.s*(1-out*.8);
      const bob=Math.sin((t-o.t0)*2.2+o.x)*16, rot=Math.sin((t-o.t0)*1.4+o.y)*.12;
      const ox=o.x + (o.x<540?-1:1)*out*500;
      const c=(o.k==='bola'||o.k==='coracao'||o.k==='maos')?b:f;
      c.save(); c.globalAlpha=clamp(p*2)*(1-out); c.translate(ox,o.y+bob+lerp(200,0,easeOut(p))); c.rotate(rot); c.scale(s,s); drawObj(c,o); c.restore();
    }
  }
  // ---------- CONFETES (cena 5) ----------
  if(t>24.5){
    for(const p of confetti){ const k=t-24.5-p.d; if(k<0) continue;
      const x=p.x+p.vx*k*Math.exp(-k*.6)*.9 + Math.sin(k*3+p.rot)*30, y=p.y+p.vy*k+700*k*k;
      if(y>2000) continue;
      f.save(); f.globalAlpha=clamp(1.4-k/4.5); f.translate(x,y); f.rotate(p.rot+p.vr*k); f.scale(1,Math.cos(k*8+p.rot)); f.fillStyle=p.c; f.fillRect(-p.w/2,-p.h/2,p.w,p.h); f.restore(); }
  }
  b.globalAlpha=f.globalAlpha=1;
};
window.DUR=DUR;
if(!navigator.webdriver){ const t0=performance.now(); const loop=()=>{renderAt(((performance.now()-t0)/1000)%DUR); requestAnimationFrame(loop);}; loop(); }
</script>
</body>
</html>
