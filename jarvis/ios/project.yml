name: Jarvis
options:
  bundleIdPrefix: com.chagas019
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  xcodeVersion: "16.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  JarvisKit:
    path: Packages/JarvisKit
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - path: Jarvis
    dependencies:
      - package: JarvisKit
      - target: JarvisWidget
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "O Jarvis usa o microfone para ouvir seus comandos de voz."
        NSSpeechRecognitionUsageDescription: "O Jarvis usa o reconhecimento de fala para transformar sua voz em texto (pt-BR)."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER).oauth"
            CFBundleURLSchemes:
              - jarvis
        JarvisAPIURL: "$(JARVIS_API_URL)"
        SupabaseURL: "$(SUPABASE_URL)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        JarvisDevToken: "$(JARVIS_DEV_TOKEN)"
        JarvisAppGroup: "$(JARVIS_APP_GROUP)"
    entitlements:
      path: Jarvis/Jarvis.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(JARVIS_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(JARVIS_BUNDLE_PREFIX)"
        PRODUCT_NAME: Jarvis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  JarvisWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: JarvisWidget
    dependencies:
      - package: JarvisKit
    info:
      path: JarvisWidget/Info.plist
      properties:
        CFBundleDisplayName: "Jarvis Tarefas"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        JarvisAppGroup: "$(JARVIS_APP_GROUP)"
    entitlements:
      path: JarvisWidget/JarvisWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(JARVIS_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(JARVIS_BUNDLE_PREFIX).widget"
        PRODUCT_NAME: JarvisWidget
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisWidget: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
