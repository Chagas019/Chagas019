# Configuração do Supabase CLI para desenvolvimento local (`npx supabase start`).
project_id = "koinonia"

[api]
port = 54321
schemas = ["public"]
max_rows = 100

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed/01_catalog.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirme seu e-mail na KOINONIA"

[storage]
file_size_limit = "2MiB"
