<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Pascom</title>
<meta name="description" content="Pascom: os santos da comunicação, suas frases, a missa ao vivo e a agenda da Pastoral da Comunicação.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: painel branco flutuando sobre um céu de entardecer; grade tipo "streaming":
     barra lateral | destaque (2 col) | explorar  /  missa | santo para você | frase do dia */
  :root {
    color-scheme: light;
    --sky-1: #0d4a5a;
    --sky-2: #2b6f78;
    --sand: #a8643a;
    --sand-2: #5a2f17;
    --panel: #ffffff;
    --soft: #efefef;
    --ink: #121212;
    --ink-2: #1c1c1e;
    --muted: #6d6d72;
    --on-dark: #ffffff;
    --on-dark-muted: rgba(255, 255, 255, 0.7);
    --red: #c8102e;
    --red-deep: #5e0614;
    --glass: rgba(255, 255, 255, 0.16);
    --glass-line: rgba(255, 255, 255, 0.35);
    --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
    --font-body: "Urbanist", "Segoe UI", system-ui, sans-serif;
    --r-xl: 28px;
    --r-lg: 22px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }

  * { box-sizing: border-box; }
  html { background: var(--sand-2); }
  body { min-height: 100vh; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    background:
      radial-gradient(120% 60% at 50% 100%, var(--sand-2), transparent 70%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 34%, #6f8a86 46%, var(--sand) 60%, var(--sand-2) 100%);
    padding-block: 40px 32px;
    padding-inline: 16px;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Frame ---------- */
  .frame {
    max-width: 1180px; margin-inline: auto;
    padding: 10px;
    border-radius: 38px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(10px);
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.55);
  }
  .app {
    background: var(--panel);
    border-radius: var(--r-xl);
    padding: 12px;
    display: grid;
    grid-template-columns: 64px 1.15fr 1fr 0.85fr;
    grid-template-rows: minmax(340px, auto) minmax(280px, auto);
    grid-template-areas:
      "side hero hero browse"
      "side cont pick play";
    gap: 12px;
  }

  /* ---------- Sidebar ---------- */
  .side {
    grid-area: side;
    background: var(--ink);
    border-radius: 20px;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 0;
    gap: 6px;
    color: var(--on-dark);
  }
  .logo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--red); display: grid; place-items: center;
    box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.25);
    margin-bottom: 10px;
  }
  .side hr { width: 28px; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.35); margin: 8px 0; }
  .side .lbl { font-size: 9px; letter-spacing: 0.14em; color: var(--on-dark-muted); text-transform: uppercase; margin: 4px 0; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    color: var(--on-dark-muted);
    transition: background .2s, color .2s;
    position: relative;
  }
  .nav-btn:hover { color: var(--on-dark); background: rgba(255, 255, 255, 0.08); }
  .nav-btn[aria-current="true"] { background: rgba(255, 255, 255, 0.14); color: var(--on-dark); }
  .nav-btn .tip {
    position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
    background: var(--ink); color: var(--on-dark); font-size: 12px; white-space: nowrap;
    padding: 6px 10px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s;
    z-index: 5;
  }
  .nav-btn:hover .tip, .nav-btn:focus-visible .tip { opacity: 1; }
  .side .spacer { flex: 1; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #f1f1f1, #9a9a9a);
    color: var(--ink); font-weight: 700; font-size: 12px;
    display: grid; place-items: center;
    border: 2px solid rgba(255, 255, 255, 0.6);
  }

  /* ---------- Portrait (foto + retrato estilizado de reserva) ---------- */
  .portrait { position: absolute; inset: 0; overflow: hidden; background: var(--p-bg, #333); }
  .portrait::before {
    content: ""; position: absolute; left: 50%; top: 40%;
    width: 70%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 230, 190, 0.55), rgba(255, 210, 150, 0.12) 45%, transparent 70%);
  }
  .portrait::after {
    content: ""; position: absolute; left: 50%; top: 40%;
    width: 46%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; border: 1.5px solid rgba(255, 225, 170, 0.55);
  }
  .portrait .mono {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    font-family: var(--font-display); font-weight: 800; color: rgba(255, 255, 255, 0.9);
    font-size: var(--mono, 64px); letter-spacing: 0.04em; z-index: 1;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
  }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; z-index: 2; }

  /* ---------- Shared card ---------- */
  .tile { position: relative; border-radius: var(--r-lg); overflow: hidden; color: var(--on-dark); background: var(--ink-2); isolation: isolate; }
  .tile .shade { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .tile .content { position: relative; z-index: 4; height: 100%; display: flex; flex-direction: column; padding: 16px 18px; }
  .tile h2 { font-size: 17px; font-weight: 500; margin: 0; }
  .tile .sub { font-size: 12px; color: var(--on-dark-muted); margin-top: 2px; }

  .chip {
    font-size: 11px; padding: 6px 11px; border-radius: 999px;
    background: rgba(0, 0, 0, 0.32); border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px); white-space: nowrap;
  }
  .chip.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3ddc84; margin-right: 6px; vertical-align: 1px; }

  .play-link { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; min-height: 40px; }
  .play-link:hover { opacity: .85; }

  .switch {
    width: 38px; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.3);
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .2s var(--ease);
  }
  .switch[aria-checked="true"] { background: var(--ink); box-shadow: inset 0 0 0 2px #fff; }
  .switch[aria-checked="true"]::after { transform: translateX(16px); }
  .switch-wrap { display: grid; justify-items: end; gap: 3px; font-size: 10px; color: var(--on-dark-muted); }

  /* ---------- Hero ---------- */
  .hero { grid-area: hero; min-height: 340px; }
  .hero .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s var(--ease); }
  .hero .slide.on { opacity: 1; }
  .hero .portrait { --mono: 140px; }
  .hero .portrait .mono { top: 36%; opacity: .35; }
  .hero .shade { background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, transparent 35%, rgba(20,0,4,.55) 70%, rgba(0,0,0,.9) 100%), linear-gradient(90deg, rgba(200,16,46,.35), transparent 60%); }
  .hero-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .hero-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .hero-title { margin: auto 0 0; text-align: center; }
  .hero-title .kicker { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--on-dark-muted); }
  .hero-title h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(30px, 4.6vw, 54px); line-height: 1.02; margin: 6px 0 0;
    letter-spacing: 0.02em; text-wrap: balance;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  }
  .hero-title .rule { width: min(360px, 70%); height: 2px; margin: 10px auto; background: linear-gradient(90deg, transparent, #fff, transparent); }
  .hero-quote { font-size: 14px; color: var(--on-dark-muted); max-width: 46ch; margin: 0 auto; font-style: italic; text-wrap: balance; }
  .hero-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dots button { width: 10px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.4); transition: width .3s var(--ease), background .3s; }
  .dots button[aria-current="true"] { width: 28px; background: #fff; }
  .dots button { position: relative; }
  .dots button::before { content: ""; position: absolute; inset: -10px -3px; }

  /* ---------- Browse ---------- */
  .browse { grid-area: browse; background: var(--soft); border-radius: var(--r-lg); padding: 16px 12px 14px; display: flex; flex-direction: column; }
  .browse h2 { font-size: 17px; font-weight: 500; margin: 0 6px 10px; padding-bottom: 10px; border-bottom: 1px solid #dcdcdc; }
  .cats { display: grid; gap: 4px; flex: 1; align-content: start; }
  .cat {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; border-radius: 999px; text-align: left; width: 100%;
    transition: background .2s, box-shadow .2s;
  }
  .cat:hover { background: rgba(255, 255, 255, 0.6); }
  .cat[aria-pressed="true"] { background: #fff; box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.25); }
  .cat .thumb { position: relative; width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex-shrink: 0; --mono: 13px; }
  .cat .thumb .portrait::after, .cat .thumb .portrait::before { display: none; }
  .cat .thumb .portrait .mono { top: 50%; }
  .cat b { display: block; font-weight: 600; font-size: 13px; }
  .cat small { color: var(--muted); font-size: 11px; }
  .cat svg { margin-left: auto; color: var(--muted); }
  .btn-dark {
    margin-top: 10px; min-height: 40px; border-radius: 999px; background: var(--ink); color: #fff;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    transition: transform .2s var(--ease);
  }
  .btn-dark:hover { transform: translateY(-1px); }

  /* ---------- Continue (missa) ---------- */
  .cont { grid-area: cont; min-height: 280px; background: radial-gradient(80% 70% at 70% 30%, #6b4a2a 0%, #2a1a10 45%, #0e0a08 100%); }
  .cont .candles { position: absolute; inset: 0; z-index: 1; }
  .cont .candles i {
    position: absolute; bottom: 22%; width: 10px; border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, #f6ead2, #c9b48d);
  }
  .cont .candles i::before {
    content: ""; position: absolute; left: 50%; top: -20px; width: 10px; height: 18px; transform: translateX(-50%);
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff6c8, #ffb347 55%, rgba(255, 120, 30, 0) 75%);
    filter: drop-shadow(0 0 12px #ffb347);
    animation: flick 2.4s infinite ease-in-out;
  }
  @keyframes flick { 50% { transform: translateX(-50%) scaleY(1.12) skewX(3deg); } }
  .cont .shade { background: linear-gradient(180deg, rgba(0,0,0,.55), transparent 40%, rgba(0,0,0,.75)); }
  .cont .vert { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-family: var(--font-display); letter-spacing: 0.6em; font-size: 12px; color: rgba(255,255,255,.35); z-index: 4; writing-mode: vertical-rl; }
  .cont .bottom { margin-top: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .time { font-size: 10px; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); margin-top: 8px; position: relative; cursor: pointer; }
  .bar::before { content: ""; position: absolute; inset: -8px 0; }
  .bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #fff; width: 0; }

  /* ---------- Pick ---------- */
  .pick { grid-area: pick; min-height: 280px; background: var(--ink-2); }
  .pick .stage { position: relative; height: 150px; margin: 6px 0 0; }
  .pick .stage .card-img { position: absolute; left: 50%; top: 0; width: 120px; height: 150px; transform: translateX(-50%); border-radius: 16px; overflow: hidden; --mono: 38px; box-shadow: 0 20px 40px -12px rgba(200, 16, 46, 0.6); transition: opacity .25s; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center; color: var(--on-dark-muted); border-radius: 50%; }
  .arrow:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .arrow.prev { left: -6px; } .arrow.next { right: -6px; }
  .pick .info {
    margin: 10px -8px -6px; padding: 14px 14px 12px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(200, 16, 46, 0.55), rgba(94, 6, 20, 0.35));
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .pick .info b { font-weight: 600; font-size: 14px; }
  .btn-white {
    width: 100%; min-height: 40px; margin-top: 12px; border-radius: 999px; background: #fff; color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; font-weight: 500;
    transition: transform .2s var(--ease);
  }
  .btn-white:hover { transform: translateY(-1px); }

  /* ---------- Play (frase do dia) ---------- */
  .play { grid-area: play; min-height: 280px; }
  .play .portrait { --mono: 72px; }
  .play .portrait .mono, .play .portrait::after { opacity: .35; }
  .play .portrait .mono, .play .portrait::before, .play .portrait::after { top: 32%; }
  .play .shade { background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(120, 8, 24, .25) 45%, rgba(0,0,0,.85)); }
  .play .quote { margin-top: auto; font-size: 13.5px; line-height: 1.45; text-wrap: pretty; transition: opacity .25s; }
  .play .quote cite { display: block; margin-top: 6px; font-style: normal; font-size: 11px; color: var(--on-dark-muted); }
  .play .quote[hidden] { display: none; }
  .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .ctl { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: #fff; }
  .ctl:hover { background: rgba(255, 255, 255, 0.12); }
  .ctl[aria-pressed="true"] { color: #fff; background: rgba(255,255,255,.18); }
  .ctl.big { width: 46px; height: 46px; background: #fff; color: var(--ink); }
  .ctl.big:hover { background: #f0f0f0; }

  /* ---------- Modal ---------- */
  dialog {
    width: min(620px, calc(100% - 32px)); max-height: min(86vh, 760px);
    border: 0; border-radius: 26px; padding: 0; background: var(--panel); color: var(--ink);
    box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6);
  }
  dialog::backdrop { background: rgba(8, 20, 24, 0.55); backdrop-filter: blur(6px); }
  .m-head { position: relative; height: 200px; color: #fff; }
  .m-head .portrait { --mono: 90px; }
  .m-head .shade { position: absolute; inset: 0; z-index: 3; background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.85)); }
  .m-head .txt { position: absolute; left: 24px; right: 24px; bottom: 18px; z-index: 4; }
  .m-head h2 { font-family: var(--font-display); font-size: 28px; margin: 4px 0 0; line-height: 1.1; }
  .m-head .kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: .8; }
  .m-close { position: absolute; right: 14px; top: 14px; z-index: 6; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.45); color: #fff; }
  .m-body { padding: 22px 24px 26px; display: grid; gap: 16px; }
  .m-body h3 { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--red); margin: 0; }
  .m-body p { margin: 0; line-height: 1.6; color: #333; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; }
  .facts span { font-size: 12px; padding: 6px 10px; border-radius: 999px; background: var(--soft); }
  .quotes { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .quotes li { padding: 14px 16px; border-radius: 14px; background: var(--soft); border-left: 3px solid var(--red); line-height: 1.5; }
  .quotes li small { display: block; color: var(--muted); margin-top: 4px; font-size: 12px; }
  .m-plain { padding: 26px 24px; display: grid; gap: 16px; }
  .m-plain h2 { margin: 0; font-size: 22px; font-weight: 600; padding-right: 44px; }
  .m-plain .m-close { background: var(--soft); color: var(--ink); }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .g-item { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; color: #fff; text-align: left; --mono: 40px; }
  .g-item .shade { position: absolute; inset: 0; z-index: 3; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.85)); }
  .g-item .cap { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 4; font-size: 13px; font-weight: 600; line-height: 1.25; }
  .g-item .cap small { display: block; font-weight: 400; opacity: .8; font-size: 11px; }
  .g-item:hover .portrait { transform: scale(1.04); }
  .g-item .portrait { transition: transform .4s var(--ease); }
  .search { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid #d6d6d6; padding: 0 14px; font: inherit; font-size: 16px; }
  .search:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(200, 16, 46, .15); }
  .empty { color: var(--muted); }
  .events { display: grid; gap: 8px; }
  .event { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 14px; background: var(--soft); }
  .event .d { text-align: center; font-variant-numeric: tabular-nums; }
  .event .d b { display: block; font-size: 22px; line-height: 1; }
  .event .d span { font-size: 11px; text-transform: uppercase; color: var(--red); letter-spacing: .1em; }
  .event p { margin: 0; color: var(--muted); font-size: 13px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #e6e6e6; }
  .set-row .switch { background: #cfcfcf; }
  .set-row .switch[aria-checked="true"] { background: var(--red); box-shadow: none; }
  form.join { display: grid; gap: 12px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input, .field select { min-height: 44px; border-radius: 12px; border: 1px solid #d6d6d6; padding: 0 12px; font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
  .field input:focus, .field select:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(200, 16, 46, .15); }
  .note { font-size: 13px; color: var(--red); min-height: 1.3em; margin: 0; }
  .btn-red { min-height: 44px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 600; }

  /* ---------- Follow pill ---------- */
  .follow {
    display: flex; align-items: center; gap: 12px; width: fit-content; margin: 34px auto 0;
    padding: 8px 22px 8px 8px; border-radius: 999px; color: #fff;
    background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px);
  }
  .follow .logo { margin: 0; width: 44px; height: 44px; }
  .follow b { display: block; font-weight: 500; }
  .follow small { opacity: .85; font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .25s, transform .25s var(--ease); pointer-events: none; z-index: 50;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1040px) {
    .app {
      grid-template-columns: 64px 1fr 1fr;
      grid-template-rows: auto;
      grid-template-areas:
        "side hero hero"
        "side browse cont"
        "side pick play";
    }
  }
  @media (max-width: 680px) {
    body { padding-block: 16px 96px; }
    .frame { padding: 6px; border-radius: 30px; }
    .app { grid-template-columns: 1fr; grid-template-areas: "hero" "browse" "cont" "pick" "play"; padding: 8px; gap: 8px; }
    .side {
      position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      flex-direction: row; padding: 8px 12px; border-radius: 999px; z-index: 30; width: max-content; max-width: calc(100% - 32px);
      box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.6);
    }
    .side .logo, .side hr, .side .lbl, .side .spacer { display: none; }

<script>
/* ---------- Dados ---------- */
// Para usar fotos reais, coloque os arquivos na pasta "fotos/" com estes nomes.
const SAINTS = [
  { id: "carlo", nome: "São Carlo Acutis", curto: "Carlo Acutis", ini: "CA", cat: ["padroeiros", "jovens"],
    titulo: "O santo da internet", foto: "fotos/carlo-acutis.jpg", cor: "linear-gradient(160deg,#b3122e,#3a0710)",
    fatos: ["1991 – 2006", "Festa: 12 de outubro", "Canonizado em 2025"],
    bio: "Jovem italiano apaixonado por informática e pela Eucaristia. Usou seu talento com computadores para criar um site e uma exposição sobre os milagres eucarísticos do mundo, que até hoje percorre paróquias. É chamado de padroeiro da internet.",
    frases: ["A Eucaristia é a minha autoestrada para o Céu.", "Todos nascem como originais, mas muitos morrem como fotocópias.", "A tristeza é olhar para si mesmo; a felicidade é olhar para Deus."] },
  { id: "francisco", nome: "Papa Francisco", curto: "Papa Francisco", ini: "PF", cat: ["papas"],
    titulo: "Papa da Igreja em saída", foto: "fotos/papa-francisco.jpg", cor: "linear-gradient(160deg,#7d6a4a,#231a10)",
    fatos: ["1936 – 2025", "Papa de 2013 a 2025", "Mensagens para o Dia das Comunicações"],
    bio: "Jorge Mario Bergoglio, primeiro papa latino-americano. Em suas mensagens para o Dia Mundial das Comunicações Sociais, pediu uma comunicação que gere encontro, escute antes de falar e vá ao encontro das pessoas.",
    frases: ["Não tenhais medo de vos tornar cidadãos do ambiente digital.", "A internet pode oferecer maiores possibilidades de encontro e de solidariedade entre todos.", "Prefiro uma Igreja acidentada, ferida e enlameada por ter saído pelas estradas."] },
  { id: "sales", nome: "São Francisco de Sales", curto: "Francisco de Sales", ini: "FS", cat: ["padroeiros"],
    titulo: "Padroeiro dos jornalistas", foto: "fotos/francisco-de-sales.jpg", cor: "linear-gradient(160deg,#3c4f7a,#0f1527)",
    fatos: ["1567 – 1622", "Festa: 24 de janeiro", "Doutor da Igreja"],
    bio: "Bispo de Genebra, escrevia folhetos e os deslizava por baixo das portas para anunciar o Evangelho a quem não ia à igreja. Por isso foi proclamado padroeiro dos jornalistas e escritores católicos.",
    frases: ["Nada é tão forte quanto a gentileza; nada é tão gentil quanto a verdadeira força.", "Seja quem você é, e seja-o bem.", "Apanham-se mais moscas com uma colher de mel do que com um barril de vinagre."] },
  { id: "kolbe", nome: "São Maximiliano Kolbe", curto: "Maximiliano Kolbe", ini: "MK", cat: ["padroeiros"],
    titulo: "Padroeiro dos radioamadores", foto: "fotos/maximiliano-kolbe.jpg", cor: "linear-gradient(160deg,#4e5a52,#141a16)",
    fatos: ["1894 – 1941", "Festa: 14 de agosto", "Mártir da caridade"],
    bio: "Frade franciscano polonês que fundou jornais, uma gráfica e uma estação de rádio para evangelizar. Em Auschwitz, ofereceu a própria vida no lugar de um pai de família.",
    frases: ["Só o amor é criativo."] },
  { id: "clara", nome: "Santa Clara de Assis", curto: "Clara de Assis", ini: "CL", cat: ["padroeiros"],
    titulo: "Padroeira da televisão", foto: "fotos/santa-clara.jpg", cor: "linear-gradient(160deg,#8a6a3a,#2a1c0c)",
    fatos: ["1194 – 1253", "Festa: 11 de agosto", "Fundadora das Clarissas"],
    bio: "Seguidora de São Francisco. Doente e sem poder ir à missa, viu a celebração projetada na parede de seu quarto. Por isso o Papa Pio XII a declarou padroeira da televisão.",
    frases: ["Ama totalmente Aquele que totalmente se entregou por teu amor."] },
  { id: "jp2", nome: "São João Paulo II", curto: "João Paulo II", ini: "JP", cat: ["papas"],
    titulo: "O papa comunicador", foto: "fotos/joao-paulo-ii.jpg", cor: "linear-gradient(160deg,#9b1c1c,#2b0606)",
    fatos: ["1920 – 2005", "Festa: 22 de outubro", "Papa de 1978 a 2005"],
    bio: "Ator na juventude, foi um papa que falava ao mundo pelos meios de comunicação. Em 2002 dedicou sua mensagem às comunicações à internet, como novo fórum para anunciar o Evangelho.",
    frases: ["Não tenhais medo! Abri, escancarai as portas a Cristo!"] },
  { id: "gabriel", nome: "São Gabriel Arcanjo", curto: "Gabriel Arcanjo", ini: "GA", cat: ["padroeiros", "arcanjos"],
    titulo: "Padroeiro das telecomunicações", foto: "fotos/sao-gabriel.jpg", cor: "linear-gradient(160deg,#2f6f8a,#0b1d26)",
    fatos: ["Festa: 29 de setembro", "O mensageiro de Deus"],
    bio: "O anjo que levou a Maria a notícia mais importante da história. Por ser o mensageiro de Deus, foi declarado padroeiro das telecomunicações.",
    frases: ["Ave, cheia de graça, o Senhor é contigo. (Lc 1,28)"] },
];
const CATS = [
  { id: "todos", nome: "Todos", },
  { id: "padroeiros", nome: "Padroeiros" },
  { id: "papas", nome: "Papas" },
  { id: "jovens", nome: "Jovens santos" },
  { id: "arcanjos", nome: "Arcanjos" },
];
const EVENTS = [
  ["12", "Out", "Festa de São Carlo Acutis", "Missa e exposição dos milagres eucarísticos · 19h"],
  ["19", "Out", "Oficina de fotografia com celular", "Sábado, 15h · Salão paroquial"],
  ["26", "Out", "Treinamento de transmissão ao vivo", "Sábado, 16h · Igreja matriz"],
  ["09", "Nov", "Reunião mensal da Pascom", "Sábado, 19h · Sala 2"],
];
const byId = id => SAINTS.find(s => s.id === id);
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("pascom:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pascom:" + k, JSON.stringify(v)); } catch {} },
};

/* ---------- Retrato: foto real se existir, senão retrato estilizado ---------- */
function portrait(s) {
  const el = document.createElement("div");
  el.className = "portrait";
  el.style.setProperty("--p-bg", s.cor);
  el.innerHTML = `<span class="mono" aria-hidden="true">${s.ini}</span>`;
  const img = new Image();
  img.alt = s.nome;
  img.onload = () => el.appendChild(img);
  img.src = s.foto;
  return el;
}
function fill(container, s) { container.replaceChildren(portrait(s)); }

/* ---------- Toast ---------- */
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

/* ---------- Destaque (carrossel) ---------- */
let filter = "todos", list = SAINTS, heroI = 0, heroTimer = null;
let settings = store.get("settings", { carousel: true });

function renderHero() {
  const slides = $("hero-slides"), dots = $("hero-dots");
  slides.replaceChildren(...list.map((s, i) => { const d = document.createElement("div"); d.className = "slide" + (i === heroI ? " on" : ""); d.appendChild(portrait(s)); return d; }));
  dots.replaceChildren(...list.map((s, i) => { const b = document.createElement("button"); b.setAttribute("role", "tab"); b.setAttribute("aria-label", s.nome); b.onclick = () => { showHero(i); restartHero(); }; return b; }));
  showHero(heroI);
}
function showHero(i) {
  heroI = (i + list.length) % list.length;
  const s = list[heroI];
  [...$("hero-slides").children].forEach((d, k) => d.classList.toggle("on", k === heroI));
  [...$("hero-dots").children].forEach((d, k) => d.setAttribute("aria-current", k === heroI));
  $("hero-kicker").textContent = s.titulo;
  $("hero-name").textContent = s.nome;
  $("hero-quote").textContent = "“" + s.frases[0] + "”";
  $("hero-chips").innerHTML = s.fatos.map(f => `<span class="chip">${f}</span>`).join("");
}
function restartHero() {
  clearInterval(heroTimer);
  if (settings.carousel && !matchMedia("(prefers-reduced-motion: reduce)").matches) heroTimer = setInterval(() => showHero(heroI + 1), 7000);
}
$("hero-open").onclick = () => openSaint(list[heroI]);
// arrastar no celular
(() => { let x0 = null; const h = $("hero");
  h.addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  h.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { showHero(heroI + (dx < 0 ? 1 : -1)); restartHero(); } x0 = null; });
})();

/* ---------- Explorar (filtros) ---------- */
function renderCats() {
  $("cats").replaceChildren(...CATS.map(c => {
    const items = c.id === "todos" ? SAINTS : SAINTS.filter(s => s.cat.includes(c.id));
    const b = document.createElement("button");
    b.className = "cat"; b.setAttribute("aria-pressed", c.id === filter);
    const th = document.createElement("span"); th.className = "thumb"; th.appendChild(portrait(items[0]));
    b.append(th);
    b.insertAdjacentHTML("beforeend", `<span><b>${c.nome}</b><small>${items.length} ${items.length === 1 ? "santo" : "santos"}</small></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>`);
    b.onclick = () => { filter = c.id; list = items; heroI = 0; pickI = 0; renderCats(); renderHero(); renderPick(); restartHero(); toast(`Mostrando: ${c.nome}`); };
    return b;
  }));
}

/* ---------- Santo para você ---------- */
let pickI = 0;
let favs = store.get("favs", []);
function renderPick() {
  const s = list[(pickI + list.length) % list.length];
  fill($("pick-img"), s);
  $("pick-name").textContent = s.nome;
  $("pick-sub").textContent = s.titulo;
  $("fav").setAttribute("aria-checked", favs.includes(s.id));
}
$("pick-prev").onclick = () => { pickI = (pickI - 1 + list.length) % list.length; renderPick(); };
$("pick-next").onclick = () => { pickI = (pickI + 1) % list.length; renderPick(); };
$("pick-open").onclick = () => openSaint(list[pickI % list.length]);
$("fav").onclick = () => {
  const s = list[pickI % list.length];
  favs = favs.includes(s.id) ? favs.filter(x => x !== s.id) : [...favs, s.id];
  store.set("favs", favs); renderPick();
  toast(favs.includes(s.id) ? `${s.curto} nos favoritos` : `${s.curto} saiu dos favoritos`);
};

/* ---------- Missa ao vivo (progresso) ---------- */
const MASS_TOTAL = 75 * 60;
let massPos = store.get("mass", 41 * 60), massTimer = null;
const fmt = t => `${String(Math.floor(t / 3600)).padStart(1, "0")}:${String(Math.floor(t / 60) % 60).padStart(2, "0")}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
function renderMass() {
  const pct = massPos / MASS_TOTAL * 100;
  $("mass-fill").style.width = pct + "%";
  $("mass-bar").setAttribute("aria-valuenow", Math.round(pct));
  $("mass-time").textContent = `${fmt(massPos)} / ${fmt(MASS_TOTAL)} · faltam ${Math.ceil((MASS_TOTAL - massPos) / 60)} min`;
}
$("mass-btn").onclick = () => {
  const on = !massTimer;
  if (on) massTimer = setInterval(() => { massPos = Math.min(MASS_TOTAL, massPos + 1); renderMass(); if (massPos % 10 === 0) store.set("mass", massPos); }, 1000);
  else { clearInterval(massTimer); massTimer = null; store.set("mass", massPos); }
  $("mass-btn").setAttribute("aria-pressed", on);
  $("mass-lbl").textContent = on ? "Pausar" : "Retomar";
  $("mass-ico").innerHTML = on ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M6 4l14 8-14 8z"/>';
};
function seekMass(e) { const r = $("mass-bar").getBoundingClientRect(); massPos = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * MASS_TOTAL); store.set("mass", massPos); renderMass(); }
$("mass-bar").addEventListener("click", seekMass);
$("mass-bar").addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { massPos = Math.max(0, Math.min(MASS_TOTAL, massPos + (e.key === "ArrowRight" ? 60 : -60))); renderMass(); e.preventDefault(); } });

/* ---------- Frase do dia (player) ---------- */
const QUOTES = SAINTS.flatMap(s => s.frases.map(f => ({ s, f })));
let qI = (new Date().getDate()) % QUOTES.length, qPlaying = false, qTimer = null, qStart = 0, qDur = 0;
let autoplay = store.get("autoplay", true);
const synth = window.speechSynthesis;
function renderQuote() {
  const { s, f } = QUOTES[qI];
  fill($("play-img"), s);
  $("play-sub").textContent = `${s.curto} · ${qI + 1} de ${QUOTES.length}`;
  $("play-quote").innerHTML = `“${f}”<cite>— ${s.nome}</cite>`;
  $("q-fill").style.width = "0%";
  $("autoplay").setAttribute("aria-checked", autoplay);
}
function setPlayIcon() {
  $("q-ico").innerHTML = qPlaying ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>';
  $("q-play").setAttribute("aria-label", qPlaying ? "Pausar" : "Ouvir frase");
}
function stopQuote() { qPlaying = false; clearInterval(qTimer); try { synth && synth.cancel(); } catch {} setPlayIcon(); }
function playQuote() {
  stopQuote();
  const { s, f } = QUOTES[qI];
  qPlaying = true; setPlayIcon();
  qDur = Math.max(4000, f.length * 85); qStart = performance.now();
  try {
    if (synth) { const u = new SpeechSynthesisUtterance(`${f}. ${s.nome}.`); u.lang = "pt-BR"; u.rate = 0.95; synth.speak(u); }
  } catch {}
  qTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - qStart) / qDur);
    $("q-fill").style.width = p * 100 + "%";
    if (p >= 1) { stopQuote(); if (autoplay) { qI = (qI + 1) % QUOTES.length; renderQuote(); setTimeout(playQuote, 600); } }
  }, 100);
}
$("q-play").onclick = () => qPlaying ? stopQuote() : playQuote();
$("q-next").onclick = () => { const was = qPlaying; stopQuote(); qI = (qI + 1) % QUOTES.length; renderQuote(); if (was) playQuote(); };
$("q-prev").onclick = () => { const was = qPlaying; stopQuote(); qI = (qI - 1 + QUOTES.length) % QUOTES.length; renderQuote(); if (was) playQuote(); };
$("q-cc").onclick = e => { const on = $("play-quote").hidden; $("play-quote").hidden = !on; e.currentTarget.setAttribute("aria-pressed", on); };
$("autoplay").onclick = () => { autoplay = !autoplay; store.set("autoplay", autoplay); $("autoplay").setAttribute("aria-checked", autoplay); toast(autoplay ? "Avanço automático ligado" : "Avanço automático desligado"); };

/* ---------- Modais ---------- */
const modal = $("modal"), mBody = $("modal-body");
const closeBtn = dark => `<button class="m-close" data-close aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
function openModal(html, after) { mBody.innerHTML = html; after && after(); if (!modal.open) modal.showModal(); mBody.querySelector("[data-close]")?.focus(); }
modal.addEventListener("click", e => { if (e.target === modal || e.target.closest("[data-close]")) modal.close(); });
modal.addEventListener("close", () => setNav("home"));

function openSaint(s) {
  openModal(`
    <div class="m-head"><div id="m-por"></div><div class="shade"></div>${closeBtn()}
      <div class="txt"><div class="kicker">${s.titulo}</div><h2>${s.nome}</h2></div></div>
    <div class="m-body">
      <div class="facts">${s.fatos.map(f => `<span>${f}</span>`).join("")}</div>
      <p>${s.bio}</p>
      <h3>Frases</h3>
      <ul class="quotes">${s.frases.map(f => `<li>“${f}”</li>`).join("")}</ul>
      <button class="btn-red" id="m-listen">Ouvir no player</button>
    </div>`, () => {
    $("m-por").appendChild(portrait(s));
    $("m-listen").onclick = () => { qI = QUOTES.findIndex(q => q.s === s); renderQuote(); modal.close(); playQuote(); };
  });
}
function galleryHTML(items) {
  return items.length ? items.map(s => `<button class="g-item" data-saint="${s.id}"><span class="shade"></span><span class="cap">${s.nome}<small>${s.titulo}</small></span></button>`).join("")
    : `<p class="empty">Nenhum santo encontrado. Tente outro nome, como “Carlo” ou “Clara”.</p>`;
}
function hydrateGallery(root) {
  root.querySelectorAll(".g-item").forEach(b => { b.prepend(portrait(byId(b.dataset.saint))); b.onclick = () => openSaint(byId(b.dataset.saint)); });
}
function openGallery() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Santos da comunicação</h2><div class="gallery" id="gal">${galleryHTML(SAINTS)}</div></div>`, () => hydrateGallery($("gal")));
}
function openSearch() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Buscar</h2>
    <label class="sr" for="q">Buscar santo ou frase</label>
    <input class="search" id="q" type="search" placeholder="Nome, padroado ou trecho de frase" autocomplete="off">
    <div class="gallery" id="res">${galleryHTML(SAINTS)}</div></div>`, () => {
    hydrateGallery($("res"));
    const norm = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    $("q").oninput = e => {
      const q = norm(e.target.value.trim());
      const r = SAINTS.filter(s => norm([s.nome, s.titulo, ...s.frases].join(" ")).includes(q));
      $("res").innerHTML = galleryHTML(r); hydrateGallery($("res"));
    };
    setTimeout(() => $("q").focus(), 30);
  });
}
function openAgenda() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Agenda da Pascom</h2>
    <div class="events">${EVENTS.map(([d, m, t, p]) => `<div class="event"><div class="d"><b>${d}</b><span>${m}</span></div><div><b>${t}</b><p>${p}</p></div></div>`).join("")}</div>
    <p class="empty" style="margin:0;font-size:13px">Datas de exemplo. A equipe atualiza a agenda a cada mês.</p></div>`);
}
function openQuotes() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Todas as frases</h2>
    <ul class="quotes">${QUOTES.map((q, i) => `<li><button style="text-align:left;width:100%" data-q="${i}">“${q.f}”<small>${q.s.nome}</small></button></li>`).join("")}</ul></div>`, () => {
    mBody.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { qI = +b.dataset.q; renderQuote(); modal.close(); playQuote(); });
  });
}
function openSettings() {
  const row = (id, label, on) => `<div class="set-row"><span>${label}</span><button class="switch" id="${id}" role="switch" aria-checked="${on}" aria-label="${label}"></button></div>`;
  openModal(`<div class="m-plain">${closeBtn()}<h2>Configurações</h2>
    <div>${row("set-carousel", "Passar os destaques sozinho", settings.carousel)}${row("set-auto", "Avançar frases automaticamente", autoplay)}</div>
    <button class="btn-dark" id="set-reset">Limpar favoritos e progresso</button></div>`, () => {
    $("set-carousel").onclick = e => { settings.carousel = !settings.carousel; store.set("settings", settings); e.target.setAttribute("aria-checked", settings.carousel); restartHero(); };
    $("set-auto").onclick = e => { autoplay = !autoplay; store.set("autoplay", autoplay); e.target.setAttribute("aria-checked", autoplay); $("autoplay").setAttribute("aria-checked", autoplay); };
    $("set-reset").onclick = () => { favs = []; massPos = 41 * 60; store.set("favs", favs); store.set("mass", massPos); renderPick(); renderMass(); toast("Favoritos e progresso limpos"); };
  });
}
function openJoin() {
  openModal(`<div class="m-plain">${closeBtn()}<h2>Venha servir na Pascom</h2>
    <p class="empty" style="margin:0">Não precisa ter experiência. A gente ensina o resto.</p>
    <form class="join" id="join" novalidate>
      <div class="field"><label for="j-nome">Seu nome</label><input id="j-nome" autocomplete="name"></div>
      <div class="field"><label for="j-tel">WhatsApp</label><input id="j-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></div>
      <div class="field"><label for="j-area">Área de interesse</label><select id="j-area"><option>Fotografia</option><option>Vídeo e transmissão</option><option>Redes sociais</option><option>Rádio e podcast</option></select></div>
      <p class="note" id="j-note" role="status"></p>
      <button class="btn-red" type="submit">Quero participar</button>
    </form></div>`, () => {
    $("join").onsubmit = e => {
      e.preventDefault();
      const nome = $("j-nome").value.trim(), tel = $("j-tel").value.trim();
      if (!nome || !tel) { $("j-note").textContent = "Preencha seu nome e WhatsApp para continuar."; return; }
      $("join").innerHTML = `<p style="margin:0;font-size:16px">Obrigado, ${nome.split(" ")[0]}! A equipe da Pascom vai falar com você pelo WhatsApp.</p>`;
    };
  });
}

/* ---------- Navegação ---------- */
function setNav(a) { document.querySelectorAll(".nav-btn").forEach(b => b.setAttribute("aria-current", b.dataset.action === a)); }
const ACTIONS = { home: () => { window.scrollTo({ top: 0, behavior: "smooth" }); }, search: openSearch, agenda: openAgenda, gallery: openGallery, settings: openSettings, join: openJoin, quotes: openQuotes };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  setNav(b.dataset.action); ACTIONS[b.dataset.action]();
});

/* ---------- Início ---------- */
renderCats(); renderHero(); renderPick(); renderMass(); renderQuote(); restartHero();
</script>
</body>
</html>
