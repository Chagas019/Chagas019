<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1400, H = 1400;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const s = 0.12; // inclinação (itálico) das peças
const P = (x, y) => new THREE.Vector2(x + s * y, y);
const pieces = [
  [P(0, 3), P(3.2, 3), P(2.55, 2.1), P(0, 2.1)],
  [P(0, 1.98), P(2.4, 1.98), P(1.75, 0.95), P(0, 0.95)],
  [P(0, 0.83), P(1.2, 0.83), P(0, -1.5)],
];
const mat = new THREE.MeshPhysicalMaterial({
  color: 0x0b0b0c, metalness: 0.92, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 0.35,
});
const group = new THREE.Group();
for (const pts of pieces) {
  const geo = new THREE.ExtrudeGeometry(new THREE.Shape(pts), {
    depth: 0.85, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.04, bevelSegments: 3,
  });
  group.add(new THREE.Mesh(geo, mat));
}
const box = new THREE.Box3().setFromObject(group);
const c = box.getCenter(new THREE.Vector3());
group.children.forEach(m => m.position.sub(c));
const root = new THREE.Group();
root.add(group);
const q = new URLSearchParams(location.search);
root.rotation.set(+(q.get('rx') ?? -0.3), +(q.get('ry') ?? 0.5), +(q.get('rz') ?? -0.35), 'YXZ');
scene.add(root);

const warm = new THREE.DirectionalLight(0xff3a0a, 10); warm.position.set(2.5, -4, -1); scene.add(warm);
const warm2 = new THREE.PointLight(0xff5a1a, 60, 0, 2); warm2.position.set(1.6, 0.2, 2.2); /* sem ponto quente */
const key = new THREE.DirectionalLight(0xffffff, 3.6); key.position.set(-3, 6, -1); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 5.0); rim.position.set(-2, -3, -4); scene.add(rim);

const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
cam.position.set(0, 0, 14);
cam.lookAt(0, 0, 0);
renderer.render(scene, cam);
window.done = renderer.domElement.toDataURL('image/png');
</script></body></html>
