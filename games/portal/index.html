<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fanzone Games</title>
  <meta name="description" content="Lançamentos, datas, plataformas e dicas de games, com as fontes de cada informação.">
  <meta name="theme-color" content="#111216">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="preload" as="image" href="img/hero.webp" type="image/webp">
  <link rel="stylesheet" href="portal.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -3 31 33'%3E%3Crect x='-4' y='-3' width='31' height='33' rx='6' fill='%23111216'/%3E%3Cg fill='%23fff'%3E%3Cpolygon points='3.4,0 22.6,0 18,5.4 2.7,5.4'/%3E%3Cpolygon points='2.6,6.1 17,6.1 12.4,12.3 1.9,12.3'/%3E%3Cpolygon points='1.8,13 9,13 0.1,27'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-marca" viewBox="0 0 23 27"><polygon fill="currentColor" points="3.4,0 22.6,0 18,5.4 2.7,5.4"/><polygon fill="currentColor" points="2.6,6.1 17,6.1 12.4,12.3 1.9,12.3"/><polygon fill="currentColor" points="1.8,13 9,13 0.1,27"/></symbol>
    <symbol id="i-casa" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.6 1.5 7v7.4h4.6V10h3.8v4.4h4.6V7z"/></symbol>
    <symbol id="i-camadas" viewBox="0 0 16 16"><g fill="currentColor"><ellipse cx="8" cy="3.6" rx="6" ry="2.2"/><path d="M2 6.2c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2v2.6c0 1.2-2.7 2.2-6 2.2s-6-1-6-2.2z"/><path d="M2 11.2c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2v1.4c0 1.2-2.7 2.2-6 2.2s-6-1-6-2.2z"/></g></symbol>
    <symbol id="i-pasta" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 3.5h5l1.4 1.6h6.6v8.4h-13z"/></symbol>
    <symbol id="i-cubo" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1 14.5 4.6v6.8L8 15 1.5 11.4V4.6zM8 2.6 3.4 5.1 8 7.6l4.6-2.5z"/></symbol>
    <symbol id="i-marcador" viewBox="0 0 16 16"><path fill="currentColor" d="M3.5 1.5h9v13L8 11.4l-4.5 3.1z"/></symbol>
    <symbol id="i-trofeu" viewBox="0 0 16 16"><path fill="currentColor" d="M4 1.5h8v1.6h2.5v1.7c0 2-1.4 3.3-3.1 3.5A4.1 4.1 0 0 1 9 10.6v1.9h2.4v2H4.6v-2H7v-1.9a4.1 4.1 0 0 1-2.4-2.3C2.9 8.1 1.5 6.8 1.5 4.8V3.1H4zm0 3.2H3v.1c0 .9.4 1.6 1.1 1.9zm8 0v2c.7-.3 1.1-1 1.1-1.9v-.1z"/></symbol>
    <symbol id="i-lupa" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.4 10.4 3.6 3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-controle" viewBox="0 0 16 16"><path fill="currentColor" d="M4.6 4h6.8a3.4 3.4 0 0 1 3.3 2.7l.7 3.6a1.8 1.8 0 0 1-3.1 1.6L10.8 10H5.2l-1.5 1.9a1.8 1.8 0 0 1-3.1-1.6l.7-3.6A3.4 3.4 0 0 1 4.6 4zm.4 1.9v1H4v1h1v1h1v-1h1v-1H6v-1zm5.6.4a.6.6 0 1 0 0 1.2.6.6 0 0 0 0-1.2zm1.4 1.4a.6.6 0 1 0 0 1.2.6.6 0 0 0 0-1.2z"/></symbol>
    <symbol id="i-sino" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1.5a4.2 4.2 0 0 1 4.2 4.2v3.1l1.4 2.2H2.4l1.4-2.2V5.7A4.2 4.2 0 0 1 8 1.5zM6.2 12.2h3.6a1.8 1.8 0 0 1-3.6 0z"/></symbol>
    <symbol id="i-calendario" viewBox="0 0 16 16"><path fill="currentColor" d="M4 1.5h1.4V3h5.2V1.5H12V3h2v11.5H2V3h2zM3.4 6v7.1h9.2V6z"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </svg>

  <a class="pular" href="#principal">Pular para o conteúdo</a>

  <div class="app">
    <a class="logo" href="#inicio" aria-label="Fanzone Games, início"><svg><use href="#i-marca"/></svg><span>FANZONE</span></a>

    <form class="busca" role="search" id="busca">
      <label class="sr" for="campo-busca">Buscar jogos</label>
      <input id="campo-busca" type="search" placeholder="Buscar jogos" autocomplete="off">
      <svg aria-hidden="true"><use href="#i-lupa"/></svg>
    </form>

    <div class="acoes">
      <a class="redondo" href="#plataformas" aria-label="Plataformas"><svg><use href="#i-controle"/></svg></a>
      <a class="redondo" href="#salvos" aria-label="Jogos salvos"><svg><use href="#i-marcador"/></svg><b class="contador" id="contador-salvos" hidden>0</b></a>
      <div class="avisos">
        <button class="redondo" type="button" id="botao-avisos" aria-label="Próximos lançamentos" aria-expanded="false" aria-controls="lista-avisos"><svg><use href="#i-sino"/></svg></button>
        <div class="avisos__lista" id="lista-avisos" hidden></div>
      </div>
    </div>

    <aside class="lateral" aria-label="Navegação">
      <nav aria-label="Menu">
        <h2 class="rotulo">Menu</h2>
        <ul class="menu" id="menu">
          <li><a href="#inicio" data-view="inicio"><svg aria-hidden="true"><use href="#i-casa"/></svg>Início</a></li>
          <li><a href="#lancamentos" data-view="lancamentos"><svg aria-hidden="true"><use href="#i-camadas"/></svg>Lançamentos</a></li>
          <li><a href="#dicas" data-view="dicas"><svg aria-hidden="true"><use href="#i-pasta"/></svg>Dicas</a></li>
          <li><a href="#plataformas" data-view="plataformas"><svg aria-hidden="true"><use href="#i-cubo"/></svg>Plataformas</a></li>
          <li><a href="#salvos" data-view="salvos"><svg aria-hidden="true"><use href="#i-marcador"/></svg>Salvos</a></li>
          <li><a href="#fontes" data-view="fontes"><svg aria-hidden="true"><use href="#i-trofeu"/></svg>Fontes</a></li>
        </ul>
      </nav>
      <section class="guias" aria-labelledby="guias-titulo">
        <h2 class="rotulo" id="guias-titulo">Guias populares</h2>
        <ul class="lista-mini" id="guias"></ul>
      </section>
      <a class="perfil" href="#salvos">
        <span class="avatar avatar--perfil" aria-hidden="true">FZ<i class="online"></i></span>
        <span>Visitante</span>
      </a>
    </aside>

    <main class="principal" id="principal" tabindex="-1"></main>

    <aside class="direita" aria-label="Status dos jogos">
      <h2 class="rotulo">Jogáveis agora</h2>
      <ul class="lista-mini" id="jogaveis"></ul>
      <h2 class="rotulo rotulo--off">Em breve</h2>
      <ul class="lista-mini" id="embreve"></ul>
      <a class="botao-cinza" href="#lancamentos"><svg aria-hidden="true"><use href="#i-calendario"/></svg>Ver calendário</a>
    </aside>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-titulo"></dialog>

  <script src="dados.js"></script>
  <script src="portal.js"></script>
</body>
</html>
