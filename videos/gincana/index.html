<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gincana – Novas Datas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#01040f;--btn:rgba(56,130,255,.14);--line:rgba(120,190,255,.35);--txt:#dbeafe;--cyan:#22d3ee}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 16px;overflow:hidden}
  #stage{height:calc(100vh - 84px);max-width:calc(100vw - 32px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(80,160,255,.18),0 20px 80px rgba(20,90,255,.25)}
  canvas{width:100%;height:100%;display:block}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{font:600 13px Montserrat,system-ui,sans-serif;color:var(--txt);background:var(--btn);border:1px solid var(--line);
    padding:9px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s}
  button:hover{background:rgba(56,130,255,.28);border-color:var(--cyan)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.rec{border-color:rgba(255,90,120,.6)}
  button.on{background:rgba(34,211,238,.25);border-color:var(--cyan)}
  #status{font-size:12px;opacity:.75;min-height:15px;text-align:center}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1080" height="1920"></canvas></div>
<div class="bar">
  <button id="btnRestart" title="Reiniciar animação">↻ Reiniciar</button>
  <button id="btnRec" class="rec" title="Gravar e baixar o vídeo">● Gravar vídeo</button>
  <button id="btnTv" title="Exibir dentro da TV retrô (green screen)">📺 Modo TV</button>
</div>
<div id="status"></div>

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

/* ---------- utilidades ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInCubic = k => k * k * k;
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = (k, s = 1.70158) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const eOutElastic = k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
const bell = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
let S = 1; // escala do layout (para shadowBlur, que ignora transformações)
function setFont(c, size, weight = 900) { c.font = `${weight} ${size}px ${FONT}`; }
function fitSize(c, str, size, weight, maxW) { setFont(c, size, weight); const m = c.measureText(str).width; return m > maxW ? size * maxW / m : size; }
function glowText(c, str, x, y, size, { weight = 900, fill = '#fff', glow = '#22d3ee', blur = 30, maxW = 960, align = 'center' } = {}) {
  size = fitSize(c, str, size, weight, maxW); setFont(c, size, weight);
  c.textAlign = align; c.textBaseline = 'middle';
  c.shadowColor = glow; c.shadowBlur = blur * 1.6 * S; c.fillStyle = fill; c.fillText(str, x, y);
  c.shadowBlur = blur * .5 * S; c.fillText(str, x, y); c.shadowBlur = 0;
  return size;
}

/* ---------- fundo: azul-marinho, auroras, grid e partículas ---------- */
const R = rng(7);
const PARTS = Array.from({ length: 120 }, () => ({ x: R(), y: R(), r: .6 + R() * 2.6, s: .015 + R() * .06, ph: R() * 6.28, c: R() }));
function drawBackground(c, w, h, t) {
  const u = Math.min(w, h) / 1080;
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  const g = c.createRadialGradient(w * .5, h * .38, 0, w * .5, h * .45, Math.max(w, h) * .8);
  g.addColorStop(0, '#0b2a7a'); g.addColorStop(.45, '#061442'); g.addColorStop(1, '#010414');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'lighter';
  [[.2, .25, '#1d4ed8', .5], [.85, .55, '#0891b2', .35], [.4, .85, '#2563eb', .4]].forEach(([bx, by, col, a], i) => {
    const x = w * (bx + Math.sin(t * .6 + i * 2) * .08), y = h * (by + Math.cos(t * .5 + i) * .05), r = Math.max(w, h) * .45;
    const rg = c.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, 'transparent');
    c.globalAlpha = a * .45; c.fillStyle = rg; c.fillRect(0, 0, w, h);
  });
  // grid em perspectiva no rodapé
  c.globalAlpha = .18; c.strokeStyle = '#3b82f6'; c.lineWidth = 2 * u;
  const hy = h * .72;
  for (let i = 0; i < 14; i++) { const k = ((i + (t * .9) % 1) / 14); const y = hy + Math.pow(k, 2.2) * (h - hy); c.globalAlpha = .22 * k; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
  c.globalAlpha = .12;
  for (let i = -10; i <= 10; i++) { c.beginPath(); c.moveTo(w / 2 + i * w * .04, hy); c.lineTo(w / 2 + i * w * .3, h); c.stroke(); }
  // partículas luminosas
  for (const p of PARTS) {
    const x = (p.x + Math.sin(t * .4 + p.ph) * .02) * w, y = (((p.y - t * p.s) % 1) + 1) % 1 * h;
    const r = p.r * u * (1 + .4 * Math.sin(t * 3 + p.ph));
    c.globalAlpha = .35 + .5 * (.5 + .5 * Math.sin(t * 2 + p.ph));
    const rg = c.createRadialGradient(x, y, 0, x, y, r * 5);
    rg.addColorStop(0, p.c > .6 ? '#ffffff' : p.c > .3 ? '#67e8f9' : '#60a5fa'); rg.addColorStop(1, 'transparent');
    c.fillStyle = rg; c.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  }
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
}

/* ---------- CENA 1: gancho de impacto (0–3s) ---------- */
function alertIcon(c) {
  c.lineJoin = 'round';
  c.beginPath(); c.moveTo(0, -150); c.lineTo(165, 130); c.lineTo(-165, 130); c.closePath();
  const g = c.createLinearGradient(0, -150, 0, 130); g.addColorStop(0, '#38bdf8'); g.addColorStop(1, '#1d4ed8');
  c.fillStyle = g; c.shadowColor = '#22d3ee'; c.shadowBlur = 60 * S; c.fill();
  c.lineWidth = 26; c.strokeStyle = '#7dd3fc'; c.stroke(); c.shadowBlur = 0;
  c.fillStyle = '#fff'; rr(c, -15, -55, 30, 120, 15); c.fill();
  c.beginPath(); c.arc(0, 98, 18, 0, 7); c.fill();
}
function scene1(c, t) {
  // tag
  const tg = eOutBack(prog(t, .15, .55));
  if (tg > 0) {
    c.save(); c.globalAlpha = clamp(tg); c.translate(0, -600 + (1 - tg) * -60);
    setFont(c, 34, 800); const tw = c.measureText('COMUNICADO OFICIAL').width + 70;
    rr(c, -tw / 2, -32, tw, 64, 32); c.fillStyle = 'rgba(37,99,235,.35)'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#38bdf8'; c.stroke();
    c.fillStyle = '#e0f2fe'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('COMUNICADO OFICIAL', 0, 2); c.restore();
  }
  // anéis de pulso
  for (let i = 0; i < 6; i++) {
    const st = .05 + i * .38, k = prog(t, st, st + 1.1); if (k <= 0 || k >= 1) continue;
    c.beginPath(); c.arc(0, -320, 120 + eOutCubic(k) * 520, 0, 7);
    c.lineWidth = 14 * (1 - k); c.strokeStyle = `rgba(34,211,238,${.8 * (1 - k)})`; c.shadowColor = '#22d3ee'; c.shadowBlur = 30 * S; c.stroke(); c.shadowBlur = 0;
  }
  // ícone de alerta (elástico + leve balanço)
  const ki = eOutElastic(prog(t, .05, 1.1));
  if (ki > 0) {
    c.save(); c.translate(0, -320); c.rotate(Math.sin(t * 9) * .06 * (1 - prog(t, .6, 2.2))); c.scale(ki * (1 + .04 * Math.sin(t * 8)), ki * (1 + .04 * Math.sin(t * 8)));
    alertIcon(c); c.restore();
  }
  // ATENÇÃO!
  const ka = eOutElastic(prog(t, .45, 1.35));
  if (ka > 0) {

  if (s1 > 0 && t > .05) { shx += Math.sin(t * 95) * 16 * s1; shy += Math.cos(t * 80) * 12 * s1; }
  if (s3 > 0 && s3 < .4) { const a = 22 * (1 - s3 / .4); shx += Math.sin(s3 * 110) * a; shy += Math.cos(s3 * 90) * a; }
  c.save(); c.translate(w / 2 + shx * S, h / 2 + shy * S); c.scale(S, S);
  if (t < T2) scene1(c, t); else if (t < T3) scene2(c, t, w, h, bgc);
  else {
    const ko = prog(t, T4, T4 + .5);
    if (ko < 1) { c.save(); c.globalAlpha = 1 - ko; const z = 1 + eInCubic(ko) * .6; c.scale(z, z); scene3(c, t); c.restore(); }
    if (t > T4 + .15) outro(c, t);
  }
  c.restore();
  c.setTransform(1, 0, 0, 1, 0, 0);
  wipe(c, w, h, t); warp(c, w, h, t);
  // flashes
  const fl = Math.max(.75 * (1 - prog(t, 0, .3)), .9 * bell(t, T3, .09), .25 * bell(t, T3 + 2.15, .06), .45 * bell(t, T4 + .2, .08));
  if (fl > .01) { c.fillStyle = `rgba(200,240,255,${fl})`; c.fillRect(0, 0, w, h); }
  const fo = eInOut(prog(t, DUR - .7, DUR)); // fade final
  if (fo > 0) { c.fillStyle = `rgba(1,4,15,${fo})`; c.fillRect(0, 0, w, h); }
  // vinheta
  const v = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .45, w / 2, h / 2, Math.max(w, h) * .75);
  v.addColorStop(0, 'transparent'); v.addColorStop(1, 'rgba(0,4,20,.65)'); c.fillStyle = v; c.fillRect(0, 0, w, h);
}

/* ---------- MODO TV (green screen da imagem) ---------- */
let tv = null, tvMode = false;
function prepareTV() {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const o = document.createElement('canvas'); o.width = W; o.height = H; const c = o.getContext('2d');
      c.drawImage(img, 0, 0, W, H);
      const d = c.getImageData(0, 0, W, H), p = d.data; let x0 = W, y0 = H, x1 = 0, y1 = 0;
      for (let i = 0; i < p.length; i += 4) {
        const r = p[i], g = p[i + 1], b = p[i + 2], ex = g - Math.max(r, b);
        if (ex > 45) { p[i + 3] = 0; const px = (i / 4) % W, py = (i / 4 / W) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
        else if (ex > 12) { p[i + 3] = 255 * (1 - (ex - 12) / 33); p[i + 1] = Math.max(r, b); }
      }
      c.putImageData(d, 0, 0);
      const pad = 6, sw = x1 - x0 + pad * 2, sh = y1 - y0 + pad * 2;
      const sc = document.createElement('canvas'); sc.width = sw * 2; sc.height = sh * 2;
      tv = { frame: o, x: x0 - pad, y: y0 - pad, w: sw, h: sh, screen: sc };
      res();
    };
    img.onerror = () => res();
    img.src = TV_SRC;
  });
}
function renderTV(t) {
  const sc = tv.screen, sctx = sc.getContext('2d');
  render(sctx, sc.width, sc.height, t);
  // linhas de varredura CRT
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.fillStyle = 'rgba(0,0,0,.18)';
  for (let y = (t * 60) % 4; y < sc.height; y += 4) sctx.fillRect(0, y, sc.width, 1.5);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(sc, tv.x, tv.y, tv.w, tv.h);
  ctx.drawImage(tv.frame, 0, 0);
  // luz azul da tela banhando o ambiente
  const cx = tv.x + tv.w / 2, cy = tv.y + tv.h / 2, fl = .32 + .05 * Math.sin(t * 23) + .3 * bell(t, T3, .1);
  const g = ctx.createRadialGradient(cx, cy, tv.w * .3, cx, cy, W * 1.1);
  g.addColorStop(0, `rgba(60,150,255,${fl})`); g.addColorStop(1, 'transparent');
  ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
}

/* ---------- loop, reinício e gravação ---------- */
/* Ritmo: mapeia o tempo real (s) para o tempo da animação.
   As transições correm quase na velocidade normal; os momentos
   de leitura são esticados para dar tempo de ler cada informação. */
const PACE = [[0, 0], [1.7, 2.0], [2.6, 4.6], [3.7, 5.9], [4.7, 7.3], [5.0, 7.8], [5.45, 10.0], [6.35, 11.0],
  [8.3, 13.2], [10.4, 16.2], [12.05, 18.0], [12.3, 20.0], [13, 20.8]];
const REAL_DUR = PACE[PACE.length - 1][1];
function animT(r) {
  for (let i = 1; i < PACE.length; i++) {
    const [a0, r0] = PACE[i - 1], [a1, r1] = PACE[i];
    if (r <= r1) return a0 + (a1 - a0) * (r - r0) / (r1 - r0);
  }
  const [a, rl] = PACE[PACE.length - 1]; return a + (r - rl);
}
window.__animT = animT; window.__REAL_DUR = REAL_DUR;
let t0 = performance.now();
function frame(now) {
  const t = animT((now - t0) / 1000);
  if (tvMode && tv) renderTV(t); else render(ctx, W, H, t);
  requestAnimationFrame(frame);
}
const status = document.getElementById('status');
function restart() { t0 = performance.now(); }
document.getElementById('btnRestart').onclick = restart;
const btnTv = document.getElementById('btnTv');
btnTv.onclick = () => { if (!tv) { status.textContent = 'Imagem da TV indisponível.'; return; } tvMode = !tvMode; btnTv.classList.toggle('on', tvMode); restart(); };

const btnRec = document.getElementById('btnRec');
btnRec.onclick = () => {
  if (!window.MediaRecorder || !cv.captureStream) { status.textContent = 'Seu navegador não suporta gravação (use Chrome/Edge).'; return; }
  const types = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const rec = new MediaRecorder(cv.captureStream(60), { mimeType: mime, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: mime || 'video/webm' }));
    a.download = `gincana-novas-datas${tvMode ? '-tv' : ''}.${ext}`; a.click();
    btnRec.disabled = false; btnRec.textContent = '● Gravar vídeo'; status.textContent = `Vídeo salvo (.${ext}).`;
  };
  btnRec.disabled = true; btnRec.textContent = '● Gravando…'; status.textContent = `Gravando ${Math.round(REAL_DUR)}s — mantenha esta aba aberta e visível.`;
  restart(); rec.start(250);
  setTimeout(() => rec.stop(), (REAL_DUR + .4) * 1000);
};

Promise.race([document.fonts.load(`900 100px Montserrat`).then(() => document.fonts.load(`800 100px Montserrat`)), new Promise(r => setTimeout(r, 2000))])
  .catch(() => {}).then(prepareTV).then(() => {
    const q = new URLSearchParams(location.search);
    if (q.has('tv') && tv) { tvMode = true; btnTv.classList.add('on'); }
    if (q.has('t')) { const ft = +q.get('t'); (tvMode && tv) ? renderTV(ft) : render(ctx, W, H, ft); window.__ready = true; return; }
    restart(); requestAnimationFrame(frame);
  });
window.__render = (t, tvOn) => { tvMode = !!tvOn && !!tv; tvMode ? renderTV(t) : render(ctx, W, H, t); };
</script>
