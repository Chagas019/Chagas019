<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10ª Gincana Solidária PAFIES 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<script src="config.js"></script>
<style>
  :root {
    --fundo: #050607;
    --painel: #0d0f10;
    --azul: #2f7bff;
    --azul-claro: #8cc8ff;
    --ciano: #27c4f5;
    --laranja: #4da3ff;
    --branco: #f4f6f5;
    --cinza: #8a8f8c;
    --fonte: "Inter Display", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--fonte); color: var(--branco); -webkit-font-smoothing: antialiased; }

  #palco {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    /* degradê preto → azul */
    background: radial-gradient(90% 70% at 50% 115%, #0b3a9e 0%, rgba(11,58,158,0) 60%),
                linear-gradient(180deg, #000 0%, #01040d 40%, #04123a 78%, #0a2a78 100%);
    overflow: hidden; transform-origin: 0 0;
  }
  .camada { position: absolute; inset: 0; pointer-events: none; }
  #brilho { background: radial-gradient(60% 55% at 50% 50%, rgba(47,123,255,.16), transparent 70%); }
  #pontos {
    background-image: radial-gradient(rgba(255,255,255,.08) 1.4px, transparent 1.6px);
    background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(70% 70% at 50% 50%, #000 20%, transparent 80%);
            mask-image: radial-gradient(70% 70% at 50% 50%, #000 20%, transparent 80%);
  }
  #vinheta { background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.75) 100%); }
  #grao { opacity: .07; mix-blend-mode: overlay; }
  #flash { background: radial-gradient(50% 50% at 50% 50%, rgba(200,228,255,.9), rgba(47,123,255,.25) 40%, transparent 70%); opacity: 0; }

  .el { position: absolute; left: 0; top: 0; will-change: transform, opacity, filter; transform-origin: 50% 50%; }

  .painel {
    border-radius: 44px;
    background: linear-gradient(180deg, #16191a 0%, #0b0c0d 100%);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 50px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07);
    overflow: hidden;
  }
  .painel::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(125deg, rgba(255,255,255,.07), transparent 35%);
  }
  .rotulo { font-size: 22px; font-weight: 600; letter-spacing: .16em; color: var(--cinza); text-transform: uppercase; display: flex; align-items: center; gap: 14px; }
  .rotulo svg { width: 30px; height: 30px; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* 2017 */
  #p2017 { width: 640px; height: 420px; padding: 44px 52px; }
  #p2017 .ano { font-size: 172px; font-weight: 800; letter-spacing: -.045em; line-height: 1; margin-top: 26px; }
  #p2017 .frase { font-size: 30px; color: #c9cdca; font-weight: 400; margin-top: 18px; letter-spacing: -.01em; }
  #p2017 .linha { position: absolute; left: 52px; right: 52px; bottom: 38px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
  #p2017 .linha i { position: absolute; inset: 0; transform-origin: 0 50%; background: linear-gradient(90deg, var(--azul), var(--azul-claro)); border-radius: 4px; }

  /* Fotos */
  .foto { width: 300px; height: 230px; border-radius: 30px; padding: 10px; }
  .foto .img { position: absolute; inset: 10px 10px 54px 10px; border-radius: 22px; overflow: hidden; background-size: cover; background-position: center; }
  .foto .img.textura::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.18), transparent 50%); }
  .foto .img svg { position: absolute; right: 14px; top: 12px; width: 26px; height: 26px; opacity: .55; }
  .foto .leg { position: absolute; left: 22px; bottom: 15px; font-size: 20px; font-weight: 600; color: #d9dcda; letter-spacing: -.01em; }
  .foto .leg::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--azul); margin-right: 10px; vertical-align: 2px; box-shadow: 0 0 10px var(--azul); }

  /* Edições */
  #pEdicoes { width: 980px; height: 470px; padding: 44px 52px; }
  #pEdicoes .topo { display: flex; justify-content: space-between; align-items: center; }
  #pEdicoes .grande { display: flex; align-items: baseline; gap: 20px; margin-top: 22px; }
  #pEdicoes .grande b { font-size: 112px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  #pEdicoes .grande span { font-size: 30px; color: var(--cinza); font-weight: 500; }
  #pEdicoes .barras { position: absolute; left: 52px; right: 52px; bottom: 34px; height: 230px; display: flex; gap: 16px; align-items: flex-end; }
  #pEdicoes .barra { flex: 1; position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  #pEdicoes .barra .tubo { width: 100%; border-radius: 22px; background: linear-gradient(180deg, #232826, #171a19); border: 1px solid rgba(255,255,255,.05); position: relative; overflow: hidden; }
  #pEdicoes .barra .tubo i { position: absolute; inset: 0; border-radius: 22px; transform-origin: 50% 100%; background: linear-gradient(180deg, #2c3f63, #1e2d4c); }
  #pEdicoes .barra.atual .tubo i { background: linear-gradient(180deg, var(--azul-claro), var(--azul) 60%, #1546c9); box-shadow: 0 0 40px rgba(47,123,255,.5); }
  #pEdicoes .barra.futura .tubo { border: 2px dashed rgba(140,200,255,.45); background: rgba(47,123,255,.05); }
  #pEdicoes .barra small { font-size: 19px; font-weight: 600; color: #7d837f; margin-top: 12px; }
  #pEdicoes .barra.futura small { color: var(--azul-claro); }
  #pEdicoes .dica { position: absolute; top: -54px; left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 14px; background: rgba(255,255,255,.1); font-size: 19px; font-weight: 600; white-space: nowrap; color: var(--azul-claro); }

  /* Alimentos */
  #pAlimentos { width: 1100px; height: 470px; padding: 50px 60px; }
  #pAlimentos .valor { font-size: 168px; font-weight: 800; letter-spacing: -.05em; line-height: 1; margin-top: 40px; }
  #pAlimentos .valor em { font-style: normal; color: var(--laranja); }
  #pAlimentos .sub { font-size: 36px; color: #b5bab7; margin-top: 18px; font-weight: 500; letter-spacing: -.01em; }
  #pAlimentos svg.anel { position: absolute; right: 60px; top: 50%; width: 300px; height: 300px; transform: translateY(-46%) rotate(-90deg); }

  /* Chip "9 edições" */
  .chip { height: 96px; padding: 0 34px 0 22px; border-radius: 30px; display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 600; white-space: nowrap; }
  .chip .bola { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: rgba(47,123,255,.14); }
  .chip .bola svg { width: 30px; height: 30px; }
  .chip b { font-weight: 800; font-size: 38px; }

  /* Contador de edições */
  #pContador { width: 600px; height: 600px; border-radius: 64px; }
  #pContador svg { position: absolute; inset: 0; }
  #pContador .n { position: absolute; inset: 0; display: grid; place-items: center; }
  #pContador .n div { text-align: center; }
  #pContador .n b { display: block; font-size: 250px; font-weight: 800; letter-spacing: -.06em; line-height: .9; }
  #pContador .n b sup { font-size: .38em; vertical-align: .95em; margin-left: 4px; letter-spacing: 0; }
  #pContador .n div > span { display: block; font-size: 26px; letter-spacing: .24em; color: var(--cinza); font-weight: 600; margin-top: 18px; }

  /* Marca: 10ª Gincana Solidária PAFIES 2027 */
  #marca { width: 1360px; height: 460px; border-radius: 60px; display: flex; align-items: center; padding: 0 80px; gap: 56px; }
  #marca .dez { font-size: 330px; font-weight: 900; letter-spacing: -.07em; line-height: .8; background: linear-gradient(180deg, #e3f1ff 0%, var(--azul-claro) 35%, var(--azul) 75%, #1546c9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 40px rgba(47,123,255,.35)); }
  #marca .dez sup { font-size: .34em; vertical-align: 1.35em; margin-left: 6px; letter-spacing: 0; }
  #marca .col { display: flex; flex-direction: column; gap: 6px; }
  #marca .gs { font-size: 54px; font-weight: 600; letter-spacing: .1em; color: #dfe3e0; }
  #marca .pf { font-size: 172px; font-weight: 900; letter-spacing: -.035em; line-height: .92; }
  #marca .ano { align-self: flex-start; margin-top: 16px; padding: 10px 26px; border-radius: 20px; font-size: 44px; font-weight: 700; color: #031027; background: linear-gradient(90deg, var(--azul-claro), var(--azul)); letter-spacing: .02em; }
  #marca .borda { position: absolute; inset: 0; border-radius: inherit; padding: 2px; background: conic-gradient(from var(--a, 0deg), transparent 0 60%, rgba(140,200,255,.9) 75%, rgba(39,196,245,.8) 85%, transparent 95%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }

  /* Calendário */
  #pCalendario { width: 1080px; height: 420px; padding: 46px 56px; }
  #pCalendario .topo { display: flex; justify-content: space-between; align-items: center; }
  #pCalendario .topo .ano { font-size: 30px; font-weight: 700; color: var(--azul-claro); }
  #pCalendario .frase { font-size: 60px; font-weight: 700; letter-spacing: -.03em; line-height: 1.08; margin-top: 30px; max-width: 900px; }
  #pCalendario .trilho { position: absolute; left: 56px; right: 56px; bottom: 62px; height: 60px; }
  #pCalendario .trilho .base { position: absolute; left: 0; right: 0; top: 28px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); }
  #pCalendario .trilho .cheio { position: absolute; left: 0; top: 28px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--azul), var(--azul-claro)); transform-origin: 0 50%; box-shadow: 0 0 16px rgba(47,123,255,.6); }
  #pCalendario .marco { position: absolute; top: 18px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: #1e2321; border: 3px solid #2f3632; }
  #pCalendario .marco.ok { background: var(--azul); border-color: #0b2350; }
  #pCalendario .marco.novo { width: 40px; height: 40px; top: 10px; margin-left: -20px; background: var(--azul-claro); border-color: #e3f1ff; box-shadow: 0 0 0 10px rgba(140,200,255,.18), 0 0 40px rgba(140,200,255,.8); }
  #pCalendario .trilho small { position: absolute; top: -26px; font-size: 20px; font-weight: 600; color: var(--cinza); transform: translateX(-50%); }

  /* Encerramento */
  #final { width: 1500px; text-align: center; }
  #final .t { font-size: 92px; font-weight: 800; letter-spacing: -.04em; }
  #final .cta { display: inline-flex; align-items: center; gap: 18px; margin-top: 34px; padding: 22px 38px; border-radius: 30px; font-size: 40px; font-weight: 600; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  #final .cta svg { width: 42px; height: 42px; }
  #final .icones { display: flex; justify-content: center; gap: 22px; margin-bottom: 30px; }
  #final .icones span { width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; background: #111413; border: 1px solid rgba(255,255,255,.08); }
  #final .icones svg { width: 40px; height: 40px; }

  /* Legenda */
  #legenda { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); max-width: 1500px; padding: 14px 30px; border-radius: 20px; background: rgba(0,0,0,.55); font-size: 36px; font-weight: 500; line-height: 1.25; text-align: center; color: #f2f4f3; letter-spacing: -.005em; white-space: nowrap; text-shadow: 0 2px 8px rgba(0,0,0,.6); }

  /* Player (só aparece fora do modo de renderização) */
  #controles { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 18px; background: rgba(20,22,22,.88); border: 1px solid rgba(255,255,255,.1); font: 500 15px var(--fonte); z-index: 10; }
  #controles button { font: inherit; color: #031027; background: var(--azul); border: 0; border-radius: 12px; padding: 9px 18px; cursor: pointer; font-weight: 700; }
  #controles input { width: min(46vw, 520px); accent-color: var(--azul); }
  #controles output { color: #cfd3d0; min-width: 52px; font-variant-numeric: tabular-nums; }
  body.render #controles { display: none; }
</style>
</head>
<body>
<div id="palco">
  <div class="camada" id="brilho"></div>
  <div class="camada" id="pontos"></div>
  <canvas class="camada" id="particulas" width="1920" height="1080"></canvas>
  <svg class="camada" id="linhas" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="gLinha" x1="0" x2="1"><stop offset="0" stop-color="#2f7bff" stop-opacity=".1"/><stop offset=".5" stop-color="#8cc8ff" stop-opacity=".9"/><stop offset="1" stop-color="#27c4f5" stop-opacity=".2"/></linearGradient>
      <radialGradient id="gPonto"><stop offset="0" stop-color="#e6f3ff"/><stop offset=".4" stop-color="#8cc8ff" stop-opacity=".9"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="raios"></g>
    <g id="conexoes"></g>
  </svg>
  <div id="mundo"></div>
  <div class="camada" id="flash"></div>
  <div class="camada" id="vinheta"></div>
  <canvas class="camada" id="grao" width="960" height="540"></canvas>
  <div id="legenda"></div>
</div>
<div id="controles">
  <button id="tocar">▶ Assistir</button>
  <input id="barra" type="range" min="0" max="58" step="0.01" value="0">
  <output id="tempo">0,0 s</output>
</div>

<script>
(() => {
  const C = window.PAFIES;
  const T = C.textos;
  const S = C.cenas;
  const W = 1920, H = 1080, CX = W / 2, CY = H / 2, PERSP = 1500;
  const $ = (s, r = document) => r.querySelector(s);
  const palco = $("#palco"), mundo = $("#mundo");

  for (const [k, v] of Object.entries(C.cores)) {
    const nome = k.replace(/[A-Z]/g, m => "-" + m.toLowerCase());
    document.documentElement.style.setProperty("--" + nome, v);
  }

  // ---------- utilidades de tempo ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const suave = x => x * x * (3 - 2 * x);
  const sai = x => 1 - Math.pow(1 - x, 3);
  const entra = x => x * x * x;
  const vaiVem = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const mola = x => { if (x <= 0) return 0; if (x >= 1) return 1; return 1 - Math.exp(-6.5 * x) * Math.cos(9 * x) ; };
  const mix = (a, b, x) => a + (b - a) * x;
  // janela: sobe em [a, a+ea], fica, desce em [b-eb, b]
  const janela = (t, a, b, ea = .8, eb = .8) => Math.min(sai(prog(t, a, a + ea)), 1 - entra(prog(t, b - eb, b)));
  const fmtMil = n => Math.round(n).toLocaleString("pt-BR");
  function aleatorio(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

  // ---------- ícones ----------
  const I = {
    semente: '<svg viewBox="0 0 24 24" fill="none" stroke="#2f7bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7Z" fill="#2f7bff33"/><path d="M12 15c0-3-2.5-5.5-7-5.5 0 3 2.5 5.5 7 5.5Z" fill="#2f7bff22"/></svg>',
    grafico: '<svg viewBox="0 0 24 24" fill="none" stroke="#2f7bff" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V13"/><path d="M10 20V9"/><path d="M15 20V11"/><path d="M20 20V5"/></svg>',
    cesta: '<svg viewBox="0 0 24 24" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-2 10H5L3 10Z" fill="#4da3ff22"/><path d="M8 10l4-6 4 6"/><path d="M9 14v3M12 14v3M15 14v3"/></svg>',
    calendario: '<svg viewBox="0 0 24 24" fill="none" stroke="#27c4f5" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3.5" fill="#27c4f522"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="12" cy="15" r="1.6" fill="#27c4f5"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M9 7l1.5-3h3L15 7"/></svg>',
    coracao: '<svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.9c0 6-8 10.6-8 10.6Z" fill="#ff4d5e"/></svg>',
    maos: '<svg viewBox="0 0 24 24" fill="none" stroke="#2f7bff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4-4 3 1 3-2 3 2 3-1 4 4"/><path d="M6 8l5 6c.8.9 2 .9 2.8 0L16 11.5"/><path d="M9 15.5l1.5 1.5c.8.8 2 .8 2.8 0L18 12"/><path d="M2 12l3.5 3.5M22 12l-3.5 3.5"/></svg>',
    celular: '<svg viewBox="0 0 24 24" fill="none" stroke="#27c4f5" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="3" fill="#27c4f522"/><path d="M10.5 18.5h3"/></svg>',
    seta: '<svg viewBox="0 0 24 24" fill="none" stroke="#8cc8ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  };

  // ---------- monta os elementos ----------
  function el(id, cls, html) {
    const d = document.createElement("div");
    if (id) d.id = id;
    d.className = "el " + (cls || "");
    d.innerHTML = html || "";
    mundo.appendChild(d);
    return d;
  }

  // Fotos (ficam atrás dos painéis)
  const sorte = aleatorio(17);
  const fotos = C.fotos.map((f, i) => {
    const d = el(null, "painel foto", `<div class="img"></div><div class="leg">${f.legenda}</div>`);
    const img = $(".img", d);
    const h1 = Math.floor(sorte() * 360), h2 = (h1 + 40 + sorte() * 80) % 360;
    // Textura no lugar da foto, enquanto o arquivo real não existir
    img.classList.add("textura");
    img.style.background = `radial-gradient(120% 90% at ${20 + sorte() * 60}% ${20 + sorte() * 50}%, hsl(${h1} 38% 46% / .9), transparent 60%),
      radial-gradient(90% 80% at ${40 + sorte() * 50}% 90%, hsl(${h2} 42% 34% / .85), transparent 65%),
      linear-gradient(${Math.floor(sorte() * 360)}deg, #1a1d1c, #3a2d28)`;
    img.innerHTML = I.camera;
    return { d, img, arquivo: f.arquivo, carregada: false };
  });

  const p2017 = el("p2017", "painel", `
    <div class="rotulo">${I.semente}${T.comecoTitulo}</div>
    <div class="ano num">${T.anoInicio}</div>
    <div class="frase">${T.comecoFrase}</div>
    <div class="linha"><i></i></div>`);

  const total = T.edicaoNumero;
  const pEdicoes = el("pEdicoes", "painel", `
    <div class="topo"><div class="rotulo">${I.grafico}${T.crescimentoTitulo}</div></div>
    <div class="grande"><b class="num">${T.edicoesRealizadas}</b><span>${T.edicoesRotulo}</span></div>
    <div class="barras">${Array.from({ length: total }, (_, i) => {
      const futura = i >= T.edicoesRealizadas;
      return `<div class="barra ${futura ? "futura" : ""}"><div class="tubo" style="height:${38 + (i / (total - 1)) * 58}%"><i></i>${futura ? `<div class="dica">${T.ano}</div>` : ""}</div><small>${i + 1}ª</small></div>`;
    }).join("")}</div>`);
  const barras = [...pEdicoes.querySelectorAll(".barra")];
  barras.forEach(b => b.querySelector(".tubo").style.overflow = "visible");
  barras.forEach(b => { const i = b.querySelector("i"); i.style.position = "absolute"; });

  const pAlimentos = el("pAlimentos", "painel", `
    <div class="rotulo">${I.cesta}Arrecadação</div>
    <div class="valor num"><em>${T.alimentosPrefixo}</em><span>0</span></div>
    <div class="sub">${T.alimentosRotulo}</div>
    <svg class="anel" viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="#0f1f3d" stroke-width="13"/><circle class="arco" cx="60" cy="60" r="48" fill="none" stroke="url(#gAnel)" stroke-width="13" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/><defs><linearGradient id="gAnel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cc8ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs></svg>`);
  const valorAlimentos = $(".valor span", pAlimentos), arcoAlimentos = $(".arco", pAlimentos);

  const chipEdicoes = el("chipEdicoes", "painel chip", `<span class="bola">${I.grafico}</span><span><b class="num">${T.edicoesRealizadas}</b> ${T.edicoesRotulo}</span>`);

  // Contador 1 → 10 com anel de segmentos
  const segs = Array.from({ length: total }, (_, i) => {
    const a0 = -90 + i * (360 / total) + 3, a1 = a0 + 360 / total - 6;
    const r = 262, p = a => [300 + r * Math.cos(a * Math.PI / 180), 300 + r * Math.sin(a * Math.PI / 180)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `<path class="seg" d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="#202523" stroke-width="22" stroke-linecap="round" fill="none"/>`;
  }).join("");
  const pContador = el("pContador", "painel", `<svg viewBox="0 0 600 600">${segs}</svg><div class="n"><div><b class="num"><span>1</span><sup>ª</sup></b><span>EDIÇÃO</span></div></div>`);
  const segEls = [...pContador.querySelectorAll(".seg")], numContador = $(".n b span", pContador);

  const marca = el("marca", "painel", `<div class="borda"></div>
    <div class="dez num">${T.edicaoNumero}<sup>ª</sup></div>
    <div class="col"><div class="gs">${T.edicaoNome}</div><div class="pf">${T.marca}</div><div class="ano num">${T.ano}</div></div>`);
  const bordaMarca = $(".borda", marca);

  const anos = [];
  const pCalendario = el("pCalendario", "painel", `
    <div class="topo"><div class="rotulo">${I.calendario}${T.calendarioTitulo}</div><div class="ano num">${T.ano}</div></div>
    <div class="frase">${T.calendarioFrase}</div>
    <div class="trilho"><div class="base"></div><div class="cheio"></div>
      ${Array.from({ length: total }, (_, i) => `<div class="marco ${i === total - 1 ? "novo" : ""}" style="left:${(i / (total - 1)) * 100}%"></div>`).join("")}
      <small style="left:0;transform:none">${T.anoInicio}</small><small style="left:100%;transform:translateX(-100%)">${T.ano}</small>
    </div>`);
  const marcosCal = [...pCalendario.querySelectorAll(".marco")], cheioCal = $(".cheio", pCalendario);

  const final = el("final", "", `
    <div class="icones"><span>${I.coracao}</span><span>${I.maos}</span><span>${I.celular}</span></div>
    <div class="t">${T.finalTitulo}</div>
    <div class="cta">${I.seta}${T.finalInscricoes}</div>`);
  final.style.width = "1500px";

  const legenda = $("#legenda");

  // ---------- partículas e grão ----------
  const ctx = $("#particulas").getContext("2d");
  const rp = aleatorio(2027);
  const parts = Array.from({ length: 90 }, () => ({ x: rp() * W, y: rp() * H, z: rp(), v: .2 + rp() * .8, f: rp() * 6.28 }));
  const grao = $("#grao"), gctx = grao.getContext("2d");
  const ruidos = Array.from({ length: 6 }, (_, k) => {
    const c = document.createElement("canvas"); c.width = 960; c.height = 540;
    const g = c.getContext("2d"), im = g.createImageData(960, 540), r = aleatorio(99 + k);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); return c;
  });

  // ---------- posicionamento 3D com projeção própria ----------
  let cam = { x: 0, y: 0 };
  function poe(e, o) {
    // o: x, y, z (centro, relativo ao centro da tela), s (escala), ry/rx (graus), op, blur
    const z = o.z || 0;
    const k = PERSP / (PERSP - z);
    const sx = CX + (o.x - cam.x * (1 - z / 2000)) * k;
    const sy = CY + (o.y - cam.y * (1 - z / 2000)) * k;
    const s = (o.s == null ? 1 : o.s) * k;
    // tamanho medido uma vez (elementos ocultos medem 0)
    if (!e._w) { e._w = e.offsetWidth; e._h = e.offsetHeight; }
    const w = e._w, h = e._h;
    const op = o.op == null ? 1 : o.op;
    e.style.opacity = op.toFixed(3);
    e.style.display = op <= 0.002 ? "none" : "";
    // fotos ficam sempre atrás dos painéis
    e.style.zIndex = Math.round((e.classList.contains("foto") ? 1000 : 5000) + z);
    e.style.transform = `translate(${(sx - w / 2).toFixed(2)}px, ${(sy - h / 2).toFixed(2)}px) perspective(1600px) scale(${s.toFixed(4)}) rotateY(${(o.ry || 0).toFixed(2)}deg) rotateX(${(o.rx || 0).toFixed(2)}deg)`;
    const blur = o.blur || 0;
    e.style.filter = (blur > .05 ? `blur(${blur.toFixed(2)}px) ` : "") + (o.filtro || "");
    return { sx, sy, s };
  }

  // Posições da nuvem de fotos (crescimento)
  const nuvem = [
    [-640, -270, -120], [-235, -320, -320], [215, -300, -170], [640, -250, -360],
    [-720, 140, -260], [-300, 230, -60], [170, 250, -300], [660, 190, -130], [-20, -40, -520],
  ];

  // ---------- quadro ----------
  function quadro(t) {
    cam.x = Math.sin(t * .13) * 34 + Math.sin(t * .31) * 10;
    cam.y = Math.cos(t * .11) * 20;

    // Fundo
    const brilhoCor = t < S.conquista ? "47,123,255" : t < S.decima ? "39,150,245" : "47,123,255";
    const intens = .1 + .1 * janela(t, S.crescimento - 1, 60, 3, 1) + .25 * Math.exp(-Math.max(0, t - S.revelacao) * .8) * (t > S.revelacao ? 1 : 0);
    $("#brilho").style.background = `radial-gradient(60% 55% at 50% 50%, rgba(${brilhoCor},${intens.toFixed(3)}), transparent 70%)`;
    $("#brilho").style.opacity = (sai(prog(t, 0, 2.5)) * (1 - .6 * prog(t, C.duracao - 3, C.duracao))).toFixed(3);
    $("#pontos").style.opacity = (.25 + .75 * sai(prog(t, S.crescimento - 1, S.crescimento + 2))).toFixed(3);
    $("#pontos").style.backgroundPosition = `${(-cam.x * .3).toFixed(1)}px ${(-cam.y * .3 - t * 4).toFixed(1)}px`;

    // Partículas
    ctx.clearRect(0, 0, W, H);
    const pOp = sai(prog(t, 1, 5)) * (1 - prog(t, C.duracao - 2.5, C.duracao));
    for (const p of parts) {
      const y = ((p.y - t * 14 * p.v) % H + H) % H;
      const x = p.x + Math.sin(t * .4 + p.f) * 20 - cam.x * p.z * .6;
      const r = .8 + p.z * 2.4;
      ctx.globalAlpha = pOp * (.15 + .5 * p.z) * (.6 + .4 * Math.sin(t * 1.3 + p.f));
      ctx.fillStyle = p.z > .7 ? "#8cc8ff" : "#ffffff";
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
    gctx.drawImage(ruidos[Math.floor(t * 24) % ruidos.length], 0, 0);

    // ----- CENA 1: 2017 -----
    {
      const a = 1.2;
      const ent = sai(prog(t, a, a + 2.2));
      const saida = vaiVem(prog(t, S.crescimento - .4, S.crescimento + 1.2));
      const op = ent * (1 - saida);
      poe(p2017, {
        x: mix(0, -560, saida), y: mix(60 - 60 * ent, -330, saida), z: mix(-260 + 260 * ent, -200, saida),
        s: mix(1, .5, saida), ry: mix(-14 * (1 - ent), 10, saida) + Math.sin(t * .5) * 3, rx: 4 * (1 - ent),
        op, blur: 10 * (1 - ent) + 4 * saida,
      });
      $(".linha i", p2017).style.transform = `scaleX(${sai(prog(t, 2.5, 10)).toFixed(4)})`;
    }

    // ----- Fotos -----
    const pontosFotos = [];
    fotos.forEach((f, i) => {
      let o = { x: 0, y: 0, z: 0, op: 0 };
      const [nx, ny, nz] = nuvem[i];
      const deriva = { x: Math.sin(t * .35 + i) * 14, y: Math.cos(t * .3 + i * 1.7) * 12 };
      const filtroAntigo = t < S.crescimento + 1 ? `sepia(${(.7 * (1 - prog(t, S.crescimento - .5, S.crescimento + 1))).toFixed(2)}) saturate(${(.6 + .4 * prog(t, S.crescimento - .5, S.crescimento + 1)).toFixed(2)})` : "";

      // No começo, só duas "fotografias antigas" aparecem atrás do 2017
      if (t < S.crescimento && i < 2) {
        const e = sai(prog(t, 4.8 + i * 1.2, 7 + i * 1.2));
        o = { x: (i ? 470 : -480) + deriva.x, y: (i ? 210 : -190) + deriva.y, z: -420, ry: i ? -16 : 16, op: e * .85, blur: 3, filtro: filtroAntigo };
      }
      // Crescimento: entram em sequência formando a galeria flutuante
      if (t >= S.crescimento - .01 || i >= 2) {
        const ini = S.crescimento + .2 + i * .32;
        const e = mola(prog(t, ini, ini + 1.6));
        if (t >= ini || (i < 2 && t >= S.crescimento)) {
          const de = i < 2 ? [(i ? 470 : -480), (i ? 210 : -190), -420] : [nx * 1.6, ny * 1.6, -1400];
          const ee = i < 2 ? sai(prog(t, S.crescimento, S.crescimento + 1.6)) : e;
          o = {
            x: mix(de[0], nx, ee) + deriva.x, y: mix(de[1], ny, ee) + deriva.y, z: mix(de[2], nz, ee),
            ry: nx / -40 + Math.sin(t * .4 + i) * 4, rx: ny / 60, op: clamp(i < 2 ? .85 + .15 * ee : sai(prog(t, ini, ini + .6))),
            blur: Math.max(0, (-nz - 150) / 70), filtro: filtroAntigo,
          };
        }
        // Painel de edições entra na frente: fotos recuam
        const recua = vaiVem(prog(t, S.crescimento + 2.2, S.crescimento + 3.4));
        if (t >= S.crescimento) {
          o.z = (o.z || 0) - 260 * recua; o.blur = (o.blur || 0) + 3 * recua; o.op = (o.op ?? 1) * (1 - .45 * recua);
        }
        // Conquista e décima: recuam mais e convergem para o centro antes da revelação
        const fundo = vaiVem(prog(t, S.conquista - .3, S.conquista + 1));
        o.z -= 160 * fundo; o.op *= 1 - .35 * fundo;
        const conv = entra(prog(t, S.revelacao - 1.1, S.revelacao));
        if (conv > 0) { o.x = mix(o.x, 0, conv); o.y = mix(o.y, 0, conv); o.z = mix(o.z, -300, conv); o.op *= 1 - conv; }
      }
      // Marco: voltam como uma galeria em órbita ao redor da marca
      if (t >= S.revelacao + .6) {
        const e = sai(prog(t, S.revelacao + .6 + i * .12, S.revelacao + 2.4 + i * .12));
        const ang = i * (Math.PI * 2 / fotos.length) + (t - S.revelacao) * .09 - .6;
        const ox = Math.cos(ang) * 820, oy = Math.sin(ang) * 410 + 10, oz = Math.sin(ang) * 260 - 330;
        const fora = vaiVem(prog(t, S.convite - .3, S.convite + 1.4));
        o = {
          x: mix(0, ox, e) * (1 + .25 * fora), y: mix(0, oy, e) * (1 + .25 * fora), z: mix(-600, oz, e) - 500 * fora,
          ry: -Math.cos(ang) * 18, rx: 0, op: e * (1 - .75 * fora) * (1 - prog(t, S.final - 1, S.final + 1)),
          blur: Math.max(0, (-oz - 200) / 80) + 4 * fora, s: .86,
        };
      }
      const r = poe(f.d, o);
      pontosFotos.push({ ...r, op: o.op || 0 });
    });

    // ----- Conexões luminosas entre as fotos -----
    const g = $("#conexoes");
    let svg = "";
    const opLinhas = sai(prog(t, S.crescimento + 2.8, S.crescimento + 4.5)) * (1 - vaiVem(prog(t, S.conquista - .3, S.conquista + .8)));
    const opOrbita = sai(prog(t, S.revelacao + 2, S.revelacao + 3.5)) * (1 - vaiVem(prog(t, S.convite - .3, S.convite + 1)));
    if (opLinhas > .01) {
      const pares = [[0, 1], [1, 2], [2, 3], [4, 5], [5, 6], [6, 7], [0, 4], [3, 7], [1, 5], [2, 6], [8, 5], [8, 2]];
      pares.forEach(([a, b], k) => {
        const A = pontosFotos[a], B = pontosFotos[b];
        const d = prog(t, S.crescimento + 2.8 + k * .12, S.crescimento + 4 + k * .12);
        const x2 = mix(A.sx, B.sx, d), y2 = mix(A.sy, B.sy, d);
        svg += `<line x1="${A.sx.toFixed(1)}" y1="${A.sy.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="url(#gLinha)" stroke-width="2" opacity="${(opLinhas * .55).toFixed(3)}"/>`;
        const u = ((t * .35 + k * .23) % 1);
        if (d >= 1) svg += `<circle cx="${mix(A.sx, B.sx, u).toFixed(1)}" cy="${mix(A.sy, B.sy, u).toFixed(1)}" r="9" fill="url(#gPonto)" opacity="${opLinhas.toFixed(3)}"/>`;
      });
    }
    if (opOrbita > .01) {
      pontosFotos.forEach((A, k) => {
        svg += `<line x1="${CX - cam.x}" y1="${CY - cam.y}" x2="${A.sx.toFixed(1)}" y2="${A.sy.toFixed(1)}" stroke="url(#gLinha)" stroke-width="1.6" opacity="${(opOrbita * .35 * A.op).toFixed(3)}"/>`;
        const u = ((t * .3 + k * .37) % 1);
        svg += `<circle cx="${mix(CX - cam.x, A.sx, u).toFixed(1)}" cy="${mix(CY - cam.y, A.sy, u).toFixed(1)}" r="8" fill="url(#gPonto)" opacity="${(opOrbita * A.op).toFixed(3)}"/>`;
      });
    }
    g.innerHTML = svg;

    // ----- CENA 2: painel de edições -----
    {
      const a = S.crescimento + 2.2;
      const ent = mola(prog(t, a, a + 1.5));
      const vira = vaiVem(prog(t, S.conquista - .3, S.conquista + .9));
      poe(pEdicoes, {
        x: mix(0, -380, vira), y: mix(110 - 110 * ent, 380, vira) + 20, z: mix(-500 + 500 * ent, -200, vira),
        s: mix(1, .35, vira), ry: mix(18 * (1 - ent), 0, vira) + Math.sin(t * .45) * 2.5, rx: 8 * (1 - ent),
        op: sai(prog(t, a, a + .7)) * (1 - vira),
      });
      barras.forEach((b, i) => {
        const futura = i >= T.edicoesRealizadas;
        const ini = a + .9 + i * .42;
        const e = futura ? sai(prog(t, ini + .2, ini + 1)) : sai(prog(t, ini, ini + .9));
        b.querySelector("i").style.transform = futura ? "scaleY(0)" : `scaleY(${e.toFixed(4)})`;
        b.querySelector(".tubo").style.opacity = futura ? (e * (.65 + .35 * Math.sin(t * 4))).toFixed(3) : 1;
        b.classList.toggle("atual", !futura && t > ini && (i === T.edicoesRealizadas - 1 || t < ini + 1.1));
      });
    }

    // ----- CENA 3: +50.000 alimentos -----
    {
      const a = S.conquista;
      const ent = mola(prog(t, a + .1, a + 1.5));
      const sai3 = vaiVem(prog(t, S.decima - .2, S.decima + 1));
      poe(pAlimentos, {
        x: 0, y: mix(-30 + 80 * (1 - ent), -60, sai3), z: mix(-500 + 500 * ent, -700, sai3),
        ry: -16 * (1 - ent) + Math.sin(t * .5) * 2, rx: 6 * (1 - ent), op: sai(prog(t, a + .1, a + .8)) * (1 - sai3), blur: 8 * sai3,
      });
      // conta até o total junto com a fala "mais de 50 mil alimentos"
      const c = vaiVem(prog(t, a + .7, 21.9));
      valorAlimentos.textContent = fmtMil(T.alimentos * c);
      arcoAlimentos.setAttribute("stroke-dashoffset", (100 - 100 * c).toFixed(2));
      poe(chipEdicoes, {
        x: mix(-380, 0, 0), y: 330 + 40 * (1 - sai(prog(t, a + .6, a + 1.6))), z: 0,
        op: sai(prog(t, a + .6, a + 1.4)) * (1 - sai3), ry: Math.sin(t * .6) * 3,
      });
    }

    // ----- CENA 4: contador 1 → 10 -----
    let numAtual = 1;
    {
      const a = S.decima;
      const ent = mola(prog(t, a + .1, a + 1.4));
      // "depois de nove edições": conta de 1 a 9 até a palavra "edições"
      const conta = prog(t, a + .1, 24.9);
      numAtual = 1 + Math.floor(clamp(conta * (T.edicoesRealizadas - 1) + .0001, 0, T.edicoesRealizadas - 1));
      // "décima": vira 10
      const dezAt = 29.1 - 1.4;
      if (t >= dezAt) numAtual = T.edicaoNumero;
      const pop = t >= dezAt ? 1 + .12 * Math.exp(-(t - dezAt) * 5) * Math.cos((t - dezAt) * 14) : 1;
      numContador.textContent = numAtual;
      segEls.forEach((s, i) => {
        const ligado = i < numAtual;
        const novo = i === T.edicaoNumero - 1;
        s.setAttribute("stroke", ligado ? (novo ? "#8cc8ff" : "#2f7bff") : novo ? "#1e2a40" : "#202523");
        s.style.filter = ligado ? `drop-shadow(0 0 ${novo ? 16 : 8}px rgba(${novo ? "140,200,255" : "47,123,255"},.8))` : "";
      });
      const conv = entra(prog(t, S.revelacao - .5, S.revelacao + .15));
      poe(pContador, {
        x: 0, y: 0, z: mix(-600 + 600 * ent, 300, conv), s: pop * mix(1, .6, conv),
        ry: 20 * (1 - ent) + Math.sin(t * .7) * 3, rx: -6 * (1 - ent),
        op: sai(prog(t, a + .1, a + .8)) * (1 - conv), blur: 12 * conv,
      });
    }

    // ----- Revelação: flash e raios -----
    {
      const f = t >= S.revelacao ? Math.exp(-(t - S.revelacao) * 2.2) : 0;
      $("#flash").style.opacity = (f * .75).toFixed(3);
      let raios = "";
      const op = (t >= S.revelacao ? sai(prog(t, S.revelacao, S.revelacao + .4)) : 0) * (1 - prog(t, S.revelacao + 1, S.revelacao + 4));
      if (op > .01) {
        const k = sai(prog(t, S.revelacao, S.revelacao + 2.5));
        for (let i = 0; i < 28; i++) {
          const ang = i / 28 * Math.PI * 2 + .1;
          const r0 = 200 + 500 * k, r1 = r0 + 160 + (i % 3) * 90;
          raios += `<line x1="${(CX + Math.cos(ang) * r0).toFixed(1)}" y1="${(CY + Math.sin(ang) * r0 * .6).toFixed(1)}" x2="${(CX + Math.cos(ang) * r1).toFixed(1)}" y2="${(CY + Math.sin(ang) * r1 * .6).toFixed(1)}" stroke="#8cc8ff" stroke-width="2.5" stroke-linecap="round" opacity="${(op * (.4 + .6 * ((i * 7) % 5) / 5)).toFixed(3)}"/>`;
        }
      }
      $("#raios").innerHTML = raios;
    }

    // ----- Marca 10ª GINCANA SOLIDÁRIA PAFIES 2027 -----
    {
      const a = S.revelacao;
      const ent = mola(prog(t, a, a + 1.6));
      const sobe = vaiVem(prog(t, S.convite - .2, S.convite + 1.4));
      const desce = vaiVem(prog(t, S.final - .2, S.final + 1.6));
      const yConvite = -300, yFinal = -140;
      poe(marca, {
        x: 0, y: mix(mix(0, yConvite, sobe), yFinal, desce), z: mix(-700 + 700 * ent, 0, 1),
        s: mix(mix(.6 + .4 * ent, .5, sobe), .62, desce),
        ry: Math.sin(t * .45) * 3 * (1 - sobe), rx: Math.cos(t * .4) * 1.5 * (1 - sobe),
        op: sai(prog(t, a, a + .5)), blur: 14 * (1 - sai(prog(t, a, a + 1))),
      });
      bordaMarca.style.setProperty("--a", ((t - a) * 70).toFixed(1) + "deg");
    }

    // ----- CENA 5: calendário / convite -----
    {
      const a = S.convite;
      const ent = mola(prog(t, a + .5, a + 2));
      const vai = vaiVem(prog(t, S.final - .4, S.final + 1.2));
      poe(pCalendario, {
        x: 0, y: mix(160 + 90 * (1 - ent), 260, vai), z: mix(-500 + 500 * ent, -400, vai),
        ry: -14 * (1 - ent) + Math.sin(t * .5) * 2, rx: 8 * (1 - ent), op: sai(prog(t, a + .5, a + 1.2)) * (1 - vai), blur: 8 * vai,
      });
      const enche = vaiVem(prog(t, a + 1.4, a + 4.6));
      cheioCal.style.width = (100 * enche) + "%";
      marcosCal.forEach((m, i) => {
        const pos = i / (total - 1);
        m.classList.toggle("ok", i < T.edicoesRealizadas && enche >= pos - .001);
        if (i === total - 1) m.style.transform = `scale(${(enche >= 1 ? 1 + .12 * Math.sin(t * 5) : .6).toFixed(3)})`;
      });
    }

    // ----- Encerramento -----
    {
      const a = S.final;
      const e = sai(prog(t, a + .6, a + 2));
      poe(final, { x: 0, y: 230 + 40 * (1 - e), z: -200 + 200 * e, op: e * (1 - prog(t, C.duracao - .6, C.duracao)), blur: 8 * (1 - e) });
      marca.style.opacity = (parseFloat(marca.style.opacity) * (1 - prog(t, C.duracao - .6, C.duracao))).toFixed(3);
    }

    // Escurece no começo e no fim
    palco.style.filter = `brightness(${(sai(prog(t, 0, 1.4)) * (1 - prog(t, C.duracao - .5, C.duracao))).toFixed(3)})`;

    // ----- Legenda -----
    if (C.legendas) {
      const fala = C.falas.find(([a, b]) => t >= a - .05 && t <= b);
      if (fala) {
        const [a, b, txt] = fala;
        legenda.textContent = txt;
        legenda.style.opacity = (Math.min(prog(t, a - .05, a + .15), 1 - prog(t, b - .15, b))).toFixed(3);
      } else legenda.style.opacity = 0;
    } else legenda.style.display = "none";
  }

  // ---------- carregamento das fotos ----------
  const pronto = Promise.all([
    document.fonts ? document.fonts.ready : Promise.resolve(),
    ...fotos.map(f => new Promise(res => {
      const im = new Image();
      im.onload = () => {
        f.img.classList.remove("textura");
        f.img.innerHTML = "";
        f.img.style.background = `url("${f.arquivo}") center / cover`;
        f.carregada = true; res();
      };
      im.onerror = () => res();
      im.src = f.arquivo;
    })),
  ]);

  window.renderAt = async t => { quadro(t); await new Promise(requestAnimationFrame); };
  window.pronto = pronto;

  // ---------- player ----------
  const modoRender = new URLSearchParams(location.search).has("render");
  if (modoRender) { document.body.classList.add("render"); pronto.then(() => quadro(0)); return; }

  function ajusta() {
    const k = Math.min(innerWidth / W, innerHeight / H);
    palco.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`;
  }
  addEventListener("resize", ajusta); ajusta();

  const voz = new Audio(C.audio.narracao), trilha = new Audio(C.audio.trilha);
  const barra = $("#barra"), tempo = $("#tempo"), botao = $("#tocar");
  barra.max = C.duracao;
  let tocando = false, t0 = 0, base = 0;
  const agora = () => (tocando ? base + (performance.now() - t0) / 1000 : base);

  function volumeTrilha(t) {
    const falando = C.falas.some(([a, b]) => t >= a - .25 && t <= b + .15);
    return falando ? C.audio.trilhaSobVoz : C.audio.trilhaNasPausas;
  }
  function sincroniza(t) {
    const tv = t - C.audio.narracaoInicio;
    if (tv >= 0 && tv < (voz.duration || 99)) { if (Math.abs(voz.currentTime - tv) > .15) voz.currentTime = tv; if (tocando && voz.paused) voz.play(); }
    else if (!voz.paused) voz.pause();
    if (Math.abs(trilha.currentTime - t) > .15) trilha.currentTime = t;
    if (tocando && trilha.paused) trilha.play();
  }
  let volAtual = C.audio.trilhaNasPausas;
  function laco() {
    let t = agora();
    if (t >= C.duracao) { t = C.duracao; pausa(); }
    quadro(t);
    barra.value = t; tempo.textContent = t.toFixed(1).replace(".", ",") + " s";
    volAtual += (volumeTrilha(t) - volAtual) * .08;
    trilha.volume = clamp(volAtual);
    if (tocando) { sincroniza(t); requestAnimationFrame(laco); }
  }
  function toca() { if (agora() >= C.duracao) base = 0; tocando = true; t0 = performance.now(); botao.textContent = "❚❚ Pausar"; sincroniza(base); laco(); }
  function pausa() { base = agora(); tocando = false; voz.pause(); trilha.pause(); botao.textContent = "▶ Assistir"; }
  botao.onclick = () => (tocando ? pausa() : toca());
  barra.oninput = () => { base = parseFloat(barra.value); t0 = performance.now(); if (tocando) sincroniza(base); else laco(); };
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); botao.click(); } });
  pronto.then(() => quadro(0));
})();
</script>
</body>
</html>
